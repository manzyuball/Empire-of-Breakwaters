l_japanese:
 # 影響力イベント
 CHI_influence.1.t:0 "静かなる暗躍"
 CHI_influence.1.d:0 "影響力拡大のための各種工作が開始された。表向きは平静を装う都市や農村でも、裏では賄賂、暗殺、そして扇動が日常茶飯事となっている。全ての派閥が、いずれ来る「その日」に向けて牙を研いでいるのだ。"
 CHI_influence.1.a:0 "時が来るのを待とう"
 CHI_influence.2.t:0 "中央工業地帯での争議"
 CHI_influence.2.d:0 "我が国の心臓部たる工業地帯において、派閥間の激しい主導権争いが表面化した。ストライキ、工場占拠、さらには軍隊の介入により生産は停滞している。ここは誰の支配下にあるべきか、血を流してでも証明せねばならないだろう。"
 CHI_influence.2.a:0 "事態を注視せよ"
 
 CHI_influence.100.t:0 "運命の時：内戦の号砲"
 CHI_influence.100.d:0 "ついにその時が来た。妥協の余地は完全に失われ、首都南京での最後の交渉は銃声によって打ち切られた。影響力工作の成果が今明らかになる。各地の軍区や政治結邦は、我々の築き上げた基盤に従って旗幟を鮮明にしつつある。\n\n国家は引き裂かれた。もはや言葉での平和的解決は不可能である。銃と鉄と血だけが、この国の正統な支配者を決定するのだ。"
 CHI_influence.100.a:0 "ダイスは投げられた！"
 
 # ルートAイベント：連合国RP
 CHI_route_a.1.t:0 "日英への支援要請"
 CHI_route_a.1.d:0 "「我々が倒れれば世界は終わる」——この言葉は決して誇張ではない。赤い津波が迫る中、我々は伝統と秩序を守る最後の砦として立ち上がった。だが、力不足は否めない。嵐の中の灯火となるためには、かつての敵対者であった連合国の力を借りねばならない。"
 CHI_route_a.1.a:0 "ロンドンと東京へ急使を送れ"
 
 # ルートBイベント：パリ派RP
 CHI_route_b.1.t:0 "東方の世界革命"
 CHI_route_b.1.d:0 "同志諸君！我々の工場に灯る火は、やがて全土を、いや世界を焼き尽くす革命の炎となるのだ！帝国主義者とブルジョアジーによって築かれた欺瞞の秩序に、今こそ労働者の鉄槌を下せ！第四インターナショナルの旗のもとに、名もなきプロレタリアートの力を見せつける時が来た。"
 CHI_route_b.1.a:0 "東方インターナショナルの創設！"
 CHI_route_b.1.b:0 "第四インターナショナルへの合流"
 
 # ルートCイベント
 CHI_route_c.1.t:0 "パリ派の粛清"
 CHI_route_c.1.d:0 "「秩序なき自由は毒だ。」都市部で無軌道な革命を叫ぶ偽りの同志たちは、我々の「大地の革命」にとって最悪の障害となっている。彼らを一網打尽にし、無分別な暴走に終止符を打たねばならない。革命を大義名分にした略奪者たちに、真の鉄の規律を教え込むのだ。"
 CHI_route_c.1.a:0 "彼らに慈悲はない"
 
 # 内戦ユニットスポーン カスタムツールチップ
 CHI_civil_war_spawn_units_tt:0 "内戦開始と同時に、我々の支配地域各地に追加部隊が召集される。反乱軍にも相応の戦力が与えられるだろう。"

 # 内戦イベント
 CHI_civil_war.1.t:0 "秩序の崩壊と反乱の狼煙"
 CHI_civil_war.1.d:0 "南京政府の命令はもはや都市部や一部の農村に届かない。急進的な革命派と農民ゲリラが同時に蜂起し、国軍の拠点に襲いかかっている。彼らは国家の解体を望んでいる。我々国民党右派は、この混沌を力によって鎮静化し、正統な政府の権威を再確立しなければならない。"
 CHI_civil_war.1.a:0 "一切の容赦なく鎮圧せよ"
 
 CHI_civil_war.2.t:0 "紅い蜂起"
 CHI_civil_war.2.d:0 "長きにわたる抑圧の末、プロレタリアートはついに鎖を引きちぎった。主要都市でゼネストが発動し、武装した労働者たちが警察署と兵器廠を制圧している。腐敗した旧政府の残党と、時代遅れの農民兵たちが我々の行く手を塞ごうとしているが、歴史の必然は我々の側にある。"
 CHI_civil_war.2.a:0 "労働者諸君、武器を取れ！"
 
 CHI_civil_war.3.t:0 "大地の怒り"
 CHI_civil_war.3.d:0 "「都市は点に過ぎない。我々には海のような大地がある。」何百万という農民たちが、長年の搾取と貧困に終止符を打つべく立ち上がった。都市のエリートや帝国主義の走狗どもは、我々が無知な田舎者だと嘲笑っている。だが、彼らが飢えに直面したとき、その笑みは凍りつくだろう。"
 CHI_civil_war.3.a:0 "都市を包囲し、敵を干上がらせよ"
 
 # 内戦 B/C合流・終結イベント
 CHI_civil_war.10.t:0 "血盟——BとCの統一戦線"
 CHI_civil_war.10.d:0 "パリ派と農村革命派が一時的な政治的対立を棚上げにし、秩序派政府に対抗するための統一反乱軍を結成した。この同盟は脆くも強力だ。二方向からの圧力は、我々の防衛線を著しく複雑にするだろう。"
 CHI_civil_war.10.a:0 "分断工作を強化せよ"

 CHI_civil_war.100.t:0 "内戦の終結"
 CHI_civil_war.100.d:0 "長く血みどろの戦いに終止符が打たれた。銃声は止み、廃墟に静寂が訪れた。今こそ、戦火で荒廃した国土を再建する時だ。我々の思想の旗のもとに、新しい中国が生まれる。"
 CHI_civil_war.100.a:0 "新しい中国の建設を始めよ"

 # 影響力イベント（追加）
 CHI_influence.3.t:0 "軍の忠誠心"
 CHI_influence.3.d:0 "国軍の将校団は誰に忠誠を誓うのか。給与の不払いと派閥的な人事が軍の一体性を蝕んでいる。各派閥は軍内部の人脈を通じて影響力を浸透させようとしている。"
 CHI_influence.3.a:0 "状況を注視する"

 CHI_influence.4.t:0 "秩序派の準備"
 CHI_influence.4.d:0 "右派の秩序主義者たちが着々と準備を整えている。彼らは財閥と旧軍閥の資金を背景に、官僚機構への浸透を深めている。"
 CHI_influence.4.a:0 "来るべき時に備えよ"

 CHI_influence.5.t:0 "パリ派の動員"
 CHI_influence.5.d:0 "工場地帯で秘密集会が相次ぎ、パリ派の活動家たちが労働者を組織している。第四インターナショナルの国際的な連帯が、彼らの背後を支えている。"
 CHI_influence.5.a:0 "来るべき時に備えよ"

 CHI_influence.6.t:0 "モスクワ派の農村工作"
 CHI_influence.6.d:0 "農村での土地分配を訴えるモスクワ派の工作員が各地に潜入している。飢えと貧困にあえぐ農民たちは、彼らの言葉に耳を傾けている。"
 CHI_influence.6.a:0 "来るべき時に備えよ"

 CHI_influence.10.t:0 "中央工業地帯での熾烈な主導権争い"
 CHI_influence.10.d:0 "長江中流域の工業地帯で三派閥が激しくぶつかり合っている。ここを制した者が次の中国の覇者となるだろう。介入するか、静観するか——決断の時だ。"
 CHI_influence.10.a:0 "全力を投入して主導権を奪取する"
 CHI_influence.10.b:0 "静観する（安定を優先）"

 CHI_influence.100.b:0 "決断の時！（パリ派の勝利）"
 CHI_influence.100.c:0 "決断の時！（モスクワ派の勝利）"
 CHI_influence.100.a_tt:0 "秩序派が最大の影響力を獲得した。ルートAの内戦が始まる。"
 CHI_influence.100.b_tt:0 "パリ派が都市と工業地帯を掌握した。ルートBの内戦が始まる。"
 CHI_influence.100.c_tt:0 "モスクワ派が農村を制した。ルートCの内戦が始まる。"

 CHI_influence.20.t:0 "妨害工作の成果"
 CHI_influence.20.d:0 "我々の工作員が敵派閥の重要拠点に打撃を与えた。暗殺、資金凍結、扇動工作……汚い手を使ってでも、影響力の均衡を変えなければならない。"
 CHI_influence.20.a:0 "工作の継続を命じる"

 CHI_influence.21.t:0 "中央工業地帯の浸透工作完了"
 CHI_influence.21.d:0 "工業地帯の工場主と労働組合幹部を取り込む工作が成功した。この地域での主導権は今や我々の手中にある。"
 CHI_influence.21.a:0 "成果を確認する"

 CHI_influence.22.t:0 "プロパガンダ攻勢の反響"
 CHI_influence.22.d:0 "大規模なプロパガンダ攻勢が民衆の間に波紋を広げている。成功すれば強烈な支持を得られるが、反感を買えば逆効果になりかねない。"
 CHI_influence.22.a:0 "民衆は我々の訴えに応えた！（追加ボーナス）"
 CHI_influence.22.b:0 "一部で激しい反発が起きた（反動）"

 # ルートAイベント（追加）
 CHI_route_a.2.t:0 "連合国への接近"
 CHI_route_a.2.d:0 "ロンドンとワシントンへの外交攻勢が実を結び始めた。共産主義という共通の脅威に対抗するため、彼らは我々の政府を正統なものとして認めようとしている。この関係を深めることで、物資と外交的支援を獲得できる。"
 CHI_route_a.2.a:0 "連合国との関係を強化する"

 CHI_route_a.3.t:0 "沿岸州返還交渉の開始"
 CHI_route_a.3.d:0 "英国と日本が不当に占領する我々の沿岸州を外交によって取り戻す時が来た。彼らが平和的に返還するか、我々が実力で奪還するかを決めるのは、この交渉の結果次第だ。"
 CHI_route_a.3.a:0 "交渉使節団を派遣する"

 CHI_route_a.4.t:0 "満州返還交渉"
 CHI_route_a.4.d:0 "傀儡国家「満州国」を通じて中国東北部を支配する日本に対し、満州の返還を正式に要求する。彼らが受け入れれば東北の豊富な資源が手に入る。拒否すれば……戦争の理由が一つ増えるだけだ。"
 CHI_route_a.4.a:0 "日本への要求書を提出する"

 CHI_route_a.100.t:0 "中国秩序派政府からの支援要請"
 CHI_route_a.100.d:0 "南京の新政府から使節が到着した。彼らは共産主義勢力に対抗するため、我々の協力を求めている。支援するならば経済的な見返りを期待できるが、この地域への深入りは危険も孕む。"
 CHI_route_a.100.a:0 "要請を受諾する（装備を提供）"
 CHI_route_a.100.b:0 "要請を断る"

 CHI_route_a.101.t:0 "中国沿岸州の返還要求"
 CHI_route_a.101.d:0 "中国の新政府が我々の占領する沿岸州の返還を求めてきた。共産主義の波を押しとどめる彼らの役割を考えれば、この要求は一定の合理性がある。だが、経済的な利権を手放す決断は容易ではない。"
 CHI_route_a.101.a:0 "返還を受諾する（中国と和解）"
 CHI_route_a.101.b:0 "拒否する（現状維持）"

 CHI_route_a.102.t:0 "満州国の処遇"
 CHI_route_a.102.d:0 "中国から満州の返還を求める強い圧力がかかっている。満州国は我々の生命線だが、中国を安定させることで共産主義勢力の拡大を防ぐという論理もある。歴史的な決断の時だ。"
 CHI_route_a.102.a:0 "満州国を解体し、中国に返還する"
 CHI_route_a.102.a2:0 "占領地を直接返還する"
 CHI_route_a.102.b:0 "満州は帝国の生命線——断固拒否する"

 # ルートBイベント（追加）
 CHI_route_b.100.t:0 "東方からの革命の呼びかけ"
 CHI_route_b.100.d:0 "中国の都市社会主義勢力が第四インターナショナルへの参加を求めてきた。東アジアに革命の炎を広げる可能性を秘めた申し出だが、中国の事情はヨーロッパとは大きく異なる。"
 CHI_route_b.100.a:0 "歓迎する！同志よ、共に戦おう"
 CHI_route_b.100.b:0 "残念ながら、状況が許さない"

 CHI_route_b.10.t:0 "山間部での武装蜂起"
 CHI_route_b.10.d:0 "農村軽視の政策に怒り狂った農民たちがモスクワ派残党と合流し、山岳地帯で武装蜂起を起こした。都市革命の成功に陶酔している間に、大地が燃え始めている。どう対処するか？"
 CHI_route_b.10.a:0 "軍を派遣して徹底鎮圧する"
 CHI_route_b.10.b:0 "政治的交渉で収束を図る"
 CHI_route_b.10.c:0 "農村部に駐留部隊を増強する"

 # ルートCイベント（追加）
 CHI_route_c.1.b:0 "国外追放で穏便に処理する"

 CHI_route_c.2.t:0 "パリ派との共存か吸収か"
 CHI_route_c.2.d:0 "モスクワ派が勝利した今、敗北したパリ派都市社会主義者たちをどう扱うか。完全に敵に回せば都市部が不安定化するが、彼らの思想を容認すれば農村革命の純粋性が損なわれる。"
 CHI_route_c.2.a:0 "現状のまま共存を認める（ペナルティ＋経済ボーナス）"
 CHI_route_c.2.b:0 "農村革命思想に吸収・統合する"

 CHI_route_c.10.t:0 "都市部での抵抗運動"
 CHI_route_c.10.d:0 "粛清令に反発した都市の知識人と工場労働者が抵抗運動を組織した。農村からの「野蛮人」支配に屈服を拒む彼らの声は、大きな政治的問題になりつつある。"
 CHI_route_c.10.a:0 "軍事力で鎮圧する"
 CHI_route_c.10.b:0 "部分的な政治的配慮で収束させる"

 CHI_route_c.100.t:0 "ソ連からの初期支援"
 CHI_route_c.100.d:0 "モスクワから同志の証として武器と軍事顧問が届いた。ソ連の支援は革命の加速を意味するが、その代価として彼らへの政治的依存が深まることも覚悟しなければならない。"
 CHI_route_c.100.a:0 "全ての支援を受け入れる"
 CHI_route_c.100.b:0 "最低限の支援のみ受け取る（独立路線を維持）"

 CHI_route_c.101.t:0 "ソ連参戦の決断"
 CHI_route_c.101.d:0 "我々の要請を受け、ソ連が満州への軍事介入を申し出てきた。北から赤い嵐が吹き荒れれば、日本軍は二正面作戦を強いられる。しかし、中国の地にソ連軍を招き入れることは、戦後の政治地図を大きく変える可能性がある。"
 CHI_route_c.101.a:0 "ソ連軍の介入を要請する"
 CHI_route_c.101.b:0 "単独での人民戦争を選ぶ"

 # 統一イベント
 CHI_unification.100.t:0 "全土統一宣言"
 CHI_unification.100.d:0 "長きにわたる血塗られた闘争の末、ついに中国全土に我々の旗が翻った。無数の命が失われ、大地は焦土と化したが、その犠牲の上に新しい中国が誕生したのだ。軍閥の群雄割拠は完全に終息し、外国勢力の影響も排除された。我々は今、一つの国家、一つの意志として歩み出す。歴史の新たなページが、今開かれたのだ。"
 CHI_unification.100.a:0 "中華は遂に統一された！"
