l_japanese:
 # ============================================================================
 # EGY イベント - Empire of Breakwaters
 # ============================================================================

 # EGY_events.1 - 中央同盟からの返答
 EGY_events.1.t:0 "中央同盟からの返答"
 EGY_events.1.d:0 "オーストリア＝ハンガリーがエジプトの加盟申請を検討している。中央同盟への参加はエジプトに新たな選択肢をもたらすが、英国との関係は完全に破綻するだろう。"
 EGY_events.1.a:0 "加盟が承認された！"
 EGY_events.1.b:0 "条件付きで受け入れてもらえた"

 # EGY_events.2 - 第四インターからの返答
 EGY_events.2.t:0 "第四インターからの返答"
 EGY_events.2.d:0 "第四インターナショナルがエジプト革命政府の加盟申請を受理した。国際的な革命連帯がエジプトに力を与えるだろう。"
 EGY_events.2.a:0 "革命の同志たちよ、共に帝国主義と戦おう！"
 EGY_events.2.b:0 "独自の革命路線を歩む"

 # EGY_events.3 - スエズ危機
 EGY_events.3.t:0 "スエズ危機"
 EGY_events.3.d:0 "スエズ運河の国有化宣言が世界を震撼させた。英国は激怒し、軍事的対応も辞さない構えを見せている。エジプトはいかに対応するか？"
 EGY_events.3.a:0 "断固として戦う！英国の侵略を許さない！"
 EGY_events.3.b:0 "国際社会の調停を求める"
 EGY_events.3.c:0 "英国が驚くべき黙認を示した"

 # EGY_events.4 - 憲法制定会議
 EGY_events.4.t:0 "憲法制定会議"
 EGY_events.4.d:0 "新憲法の草案を巡り、議会と国王の間で激論が交わされている。急進的な議会主権か、穏健な王権留保か。エジプトの政治体制が今決まる。"
 EGY_events.4.a:0 "議会主権の急進的憲法を採択する"
 EGY_events.4.b:0 "王権留保の穏健的憲法を採択する"

 # EGY_events.5 - 王政復古宣言
 EGY_events.5.t:0 "王政復古宣言"
 EGY_events.5.d:0 "ファルーク国王の権威が完全に復活した。民衆の反応は二分されている。王政を歓迎する声と、民主化を求める不満の声が交錯している。"
 EGY_events.5.a:0 "国民の歓呼が響き渡る！"
 EGY_events.5.b:0 "民主勢力が抵抗を始めた"

 # EGY_events.6 - アラブ革命の波及
 EGY_events.6.t:0 "アラブ革命の波及"
 EGY_events.6.d:0 "エジプト革命の炎が隣国を揺るがしている。アラブ世界全体に革命の波が広がるか？隣国の反応が今後のアラブ情勢を左右するだろう。"
 EGY_events.6.a:0 "シリアとイラクが革命に呼応した！"
 EGY_events.6.b:0 "隣国は沈黙を守っている"
 EGY_events.6.c:0 "隣国政府が敵対的姿勢を示した"

 # EGY_events.7 - 英国との合同軍事演習
 EGY_events.7.t:0 "英国との合同軍事演習"
 EGY_events.7.d:0 "エジプト軍と英国軍の合同演習が実施された。演習の結果が両国の軍事協力の行方を左右する。"
 EGY_events.7.a:0 "演習は大成功！両軍の連携は完璧だ"
 EGY_events.7.b:0 "連携不全。英国将校たちは失望を隠せない"

 # EGY_events.8 - 土地改革の成果
 EGY_events.8.t:0 "土地改革の成果"
 EGY_events.8.d:0 "土地改革が実施されてから数ヶ月が経過した。農村の変化が明らかになってきた。"
 EGY_events.8.a:0 "農民たちは新たな土地で働き始めた"
 EGY_events.8.b:0 "地主階級が武装蜂起した！鎮圧が必要だ"

 # EGY_events.9 - 労働者の権利宣言
 EGY_events.9.t:0 "労働者の権利宣言"
 EGY_events.9.d:0 "労働者の権利法が公布された。工場労働者たちの反応は様々だ。"
 EGY_events.9.a:0 "労働者が政府への支持を表明した"
 EGY_events.9.b:0 "一部の工場でストライキが勃発した"

 # EGY_events.10 - 完全独立の達成
 EGY_events.10.t:0 "完全独立の達成"
 EGY_events.10.d:0 "長年の闘争が実を結んだ。エジプトは英国の支配から完全に解放され、真の主権国家として世界の舞台に立つ。カイロの街に喜びの声が溢れる。"
 EGY_events.10.a:0 "エジプト万歳！自由と独立の新時代だ！"

 # EGY_events.11 - 植民地化の危機
 EGY_events.11.t:0 "植民地化の危機"
 EGY_events.11.d:0 "英国の影響力がエジプトを完全に掌握しつつある。このままでは事実上の植民地に成り下がってしまう。どう対処するか？"
 EGY_events.11.a:0 "英国の条件を受け入れ、安定を優先する"
 EGY_events.11.b:0 "屈服しない！独立への道を死守する"

 # EGY_events.20 - ファシズム一党独裁化
 EGY_events.20.t:0 "ファシズム一党支配体制へ"
 EGY_events.20.d:0 "政治体制は一党独裁制へと転換された。国内の自由は制限されるが、国家統制の下で強力な国家建設が可能になるだろう。"
 EGY_events.20.a:0 "鉄の規律で国家を強化する"
 EGY_events.20.b:0 "民族主義宣伝を展開し、戦意を高める"
 EGY_events.20.c:0 "内部粛清で体制を固める"

 # EGY_events.21 - 共産革命前衛党
 EGY_events.21.t:0 "革命前衛党の結成"
 EGY_events.21.d:0 "共産主義革命の指導者として、人民の前衛党が公式に結成された。労働者と農民の階級闘争の時代が始まる。"
 EGY_events.21.a:0 "人民評議会による支配を樹立する"
 EGY_events.21.b:0 "農民・労働者への土地と工場の分配を優先する"
 EGY_events.21.c:0 "反革命勢力を一掃し、革命を守護する"

 # EGY_events.30 - 経済ブーム
 EGY_events.30.t:0 "エジプト経済の好況"
 EGY_events.30.d:0 "エジプト経済が力強く回復し、工場の生産量が拡大している。この好況をどのように活用するか？"
 EGY_events.30.a:0 "生産拡大に投資し、さらなる成長を促進する"
 EGY_events.30.b:0 "国民生活の改善に資源を充てる"

 # EGY_events.31 - 経済危機
 EGY_events.31.t:0 "エジプト経済の危機"
 EGY_events.31.d:0 "経済指標が急激に悪化している。消費財の不足と工場生産の停滞が国民の不満を高めている。緊急の対応が必要だ。"
 EGY_events.31.a:0 "緊急財政措置を発動し、経済を安定させる"
 EGY_events.31.b:0 "外国からの援助を求める"
 EGY_events.31.c:0 "状況を静観し、自然回復を待つ"

 # EGY_events.32 - 政治的不安定
 EGY_events.32.t:0 "街頭の不満が爆発"
 EGY_events.32.d:0 "経済危機の影響で市民の不満が限界に達した。カイロとアレキサンドリアの街頭でデモが頻発し、政府への批判が高まっている。"
 EGY_events.32.a:0 "強硬鎮圧で秩序を回復する"
 EGY_events.32.b:0 "国民に向けて演説し、対話で解決を図る"
 EGY_events.32.c:0 "経済改革を約束し、民心を取り戻す"

 # EGY_events.33 - 国際的圧力
 EGY_events.33.t:0 "国際社会の圧力"
 EGY_events.33.d:0 "英国がエジプトの政治的混乱を口実に内政干渉を強めている。国際社会の圧力にどう応じるか？"
 EGY_events.33.a:0 "断固として内政干渉を拒否する"
 EGY_events.33.b:0 "英国の要求を一部受け入れ、摩擦を和らげる"
 EGY_events.33.c:0 "第三国の支援を求めてバランスを保つ"

 # EGY_events.34 - スエズ海運ブーム
 EGY_events.34.t:0 "スエズ海運の好況"
 EGY_events.34.d:0 "世界的な海上貿易の拡大により、スエズ運河の通行量が急増している。この機会を最大限に活用すべき時だ。"
 EGY_events.34.a:0 "通行料を引き上げ、最大限の収益を確保する"
 EGY_events.34.b:0 "港湾と造船施設を拡充し、長期的な発展を目指す"
 EGY_events.34.c:0 "近隣アラブ諸国と海運協定を結び、地域連携を強化する"

 # ============================================================================
 # EGY ディシジョン - Empire of Breakwaters
 # ============================================================================

 EGY_negotiate_trade_deal:0 "英国との通商交渉"
 EGY_negotiate_trade_deal_desc:0 "英国との貿易協定を改定し、経済的な恩恵と引き換えに英国との関係を強化する。"

 EGY_nationalize_industry:0 "産業国有化"
 EGY_nationalize_industry_desc:0 "外国資本の工場や企業を国有化し、経済的自立を推進する。英国は激しく反発するだろう。"

 EGY_british_officers:0 "英国軍事顧問招聘"
 EGY_british_officers_desc:0 "英国の軍事専門家をエジプト軍に招聘し、訓練と戦術の向上を図る。"

 EGY_train_national_army:0 "国軍独自訓練"
 EGY_train_national_army_desc:0 "外国の助けを借りずに、エジプト独自の軍事訓練プログラムを実施する。"

 EGY_suez_toll_increase:0 "スエズ通行料引上げ"
 EGY_suez_toll_increase_desc:0 "スエズ運河の通行料を引き上げ、運河収入を増やす。英国は不満を示すだろう。"

 EGY_accept_british_terms:0 "英国条件受諾"
 EGY_accept_british_terms_desc:0 "英国の経済・政治的要求を受け入れ、安定と引き換えに従属を深める。"

 EGY_anti_colonial_rally:0 "反植民地集会"
 EGY_anti_colonial_rally_desc:0 "反帝国主義の大規模集会を開催し、国民の独立意識を高める。"

 EGY_expel_british_garrison:0 "英国守備隊追放"
 EGY_expel_british_garrison_desc:0 "エジプト国内の英国軍基地を閉鎖し、守備隊を強制退去させる。これは取り消せない一歩だ。"
