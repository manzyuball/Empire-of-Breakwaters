 AUS.40.d:0 "旧態依然とした軍制を改革し、列強に対抗しうる軍隊を再建するための法案が提出された。"
 AUS.40.a:0 "法案を提出する"
 AUS.41.t:0 "産業近代化計画"
 AUS.41.d:0 "帝国の産業基盤を強化し、経済成長を促進するための大規模な補助金計画が策定された。"
 AUS.41.a:0 "法案を提出する"
 AUS.42.t:0 "情報統制の強化"
 AUS.42.d:0 "国内の安定を維持し、反体制的な言論を封じ込めるため、報道規制の強化が検討されている。"
 AUS.42.a:0 "法案を提出する"
 AUS.43.t:0 "財政基盤の再編"
 AUS.43.d:0 "地方の不満を解消しつつ、中央政府の財政基盤を強化するための税制改革案が浮上している。"
 AUS.43.a:0 "法案を提出する"
 AUS.44:0 "ウィーン金融改革"
 AUS.44_desc:0 "ウィーンを欧州の金融ハブとして再興させるため、銀行法の改正が必要とされている。"
