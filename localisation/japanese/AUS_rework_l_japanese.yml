 AUS_Galicia_Lodomeria_infrastructure:0 "ガリツィア・ロドメリアのインフラ"
 AUS_Galicia_Lodomeria_infrastructure_desc:0 "ガリツィア・ロドメリアのインフラを整備し、東部の開発を促進します。"
 AUS_Galicia_Lodomeria_mines:0 "ガリツィア・ロドメリアの鉱山"
 AUS_Galicia_Lodomeria_mines_desc:0 "ガリツィア・ロドメリアの資源開発を進めます。"
 AUS_danube_arsenals:0 "ドナウの工廠"
 AUS_danube_arsenals_desc:0 "ドナウ川沿いに兵器工場を建設し、軍需生産を拡大します。"
 AUS_hungarian_aluminum:0 "ハンガリーのアルミニウム"
 AUS_hungarian_aluminum_desc:0 "ハンガリーのボーキサイト鉱山を開発し、航空機生産を支えます。"
 AUS_hungarian_airplane_factory:0 "ハンガリーの空軍工場"
 AUS_hungarian_airplane_factory_desc:0 "ハンガリーの空軍工場を整備し、空軍の生産を増やします。"
 AUS_empire_economic_conference:0 "帝国経済会議"
 AUS_empire_economic_conference_desc:0 "帝国内の経済連携を強化し、統合された経済圏を構築します。"
 AUS_mediterranean_trade:0 "地中海貿易"
 AUS_mediterranean_trade_desc:0 "地中海諸国との貿易を拡大し、経済的利益を確保します。"

 # Military Focuses
 AUS_vienna_military_academy_focus:0 "ウィーン軍事アカデミー"
 AUS_vienna_military_academy_focus_desc:0 "ウィーン軍事アカデミーを再編し、優秀な将校を育成します。"
 AUS_imperial_line_defense:0 "帝国の防衛線"
 AUS_imperial_line_defense_desc:0 "国境沿いに防衛線を構築し、敵の侵攻に備えます。"
 AUS_tyrol_redoubts:0 "チロルの要塞群"
 AUS_tyrol_redoubts_desc:0 "チロルの山岳地帯に要塞を建設し、防衛力を高めます。"
 AUS_carpathian_shield:0 "カルパティアの盾"
 AUS_carpathian_shield_desc:0 "カルパティア山脈を防衛の要とし、東方からの脅威に対抗します。"
 AUS_alpine_fortress:0 "アルプス要塞"
 AUS_alpine_fortress_desc:0 "アルプス全域を要塞化し、難攻不落の防壁とします。"
 AUS_danube_river_guard:0 "ドナウ河防衛隊"
 AUS_danube_river_guard_desc:0 "ドナウ川の防衛を強化し、水上からの侵入を防ぎます。"
 AUS_balkan_sentinel:0 "バルカンの番人"
 AUS_balkan_sentinel_desc:0 "バルカン半島方面の警戒を強め、南方の安全を確保します。"
 AUS_panzerkorps_budapest:0 "ブダペスト装甲軍団"
