 AUS_transylvania_infrastructure:0 "トランシルヴァニアのインフラ"
 AUS_transylvania_infrastructure_desc:0 "トランシルヴァニアのインフラを整備し、資源輸送を円滑にします。"
 AUS_transylvanian_mines:0 "トランシルヴァニアの鉱山"
