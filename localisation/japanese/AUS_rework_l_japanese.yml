 AUS_danube_mechanization:0 "ドナウの機械化"
 AUS_danube_mechanization_desc:0 "軍の機械化を推進し、迅速な展開能力を獲得します。"
 AUS_heavy_tank_development:0 "重戦車開発"
 AUS_heavy_tank_development_desc:0 "重戦車の開発を進め、圧倒的な火力を手に入れます。"
 AUS_motorized_logistics:0 "自動車化兵站"
 AUS_motorized_logistics_desc:0 "兵站の自動車化を進め、補給能力を向上させます。"
 AUS_mobile_warfare_doctrine:0 "機動戦ドクトリン"
 AUS_mobile_warfare_doctrine_desc:0 "機動戦ドクトリンを採用し、電撃的な作戦遂行を可能にします。"
 AUS_imperial_airfleet:0 "帝国航空艦隊"
 AUS_imperial_airfleet_desc:0 "帝国航空艦隊を創設し、空の支配権を確立します。"
 AUS_black_eagle_paratroops:0 "黒鷲空挺部隊"
 AUS_black_eagle_paratroops_desc:0 "精鋭空挺部隊「黒鷲」を編成し、敵の後方を撹乱します。"
 AUS_tactical_bomber_fleet:0 "戦術爆撃機隊"
 AUS_tactical_bomber_fleet_desc:0 "戦術爆撃機隊を整備し、地上部隊を支援します。"
 AUS_strategic_air_command:0 "戦略空軍司令部"
 AUS_strategic_air_command_desc:0 "戦略空軍司令部を設置し、組織的な航空作戦を展開します。"
 AUS_mountain_infantry_corps:0 "山岳歩兵軍団"
 AUS_mountain_infantry_corps_desc:0 "山岳戦に特化した歩兵軍団を編成します。"
 AUS_marine_corps:0 "海兵師団"
 AUS_marine_corps_desc:0 "上陸作戦に特化した海兵隊を創設します。"
 AUS_emperors_war_cabinet:0 "皇帝の戦時内閣"
 AUS_emperors_war_cabinet_desc:0 "皇帝直属の戦時内閣を組織し、総力戦体制を整えます。"
 AUS_combined_arms_offensive:0 "統合諸兵科連合攻勢"
 AUS_combined_arms_offensive_desc:0 "諸兵科連合による攻勢作戦を研究し、攻撃力を高めます。"
 AUS_imperial_general_staff:0 "帝国参謀本部"
 AUS_imperial_general_staff_desc:0 "参謀本部を強化し、作戦立案能力を向上させます。"
 AUS_total_mobilization_preparation:0 "総動員準備"
 AUS_total_mobilization_preparation_desc:0 "国家の総力を挙げて戦争に備えるための準備を進めます。"

 # Events
 AUS.1.t:0 "帝国の行く末"
 AUS.1.d:0 "多民族国家である我らが帝国は、歴史的な転換点に立たされている。内外の圧力が高まる中、我々はどのような道を歩むべきだろうか？"
 AUS.1.a:0 "運命を受け入れよう"
 AUS.10.t:0 "自治拡大の波"
 AUS.10.d:0 "各民族からの自治拡大要求が高まる中、議会に新たな自治法案が提出された。これを可決すれば帝国の結束は緩むかもしれないが、不満は解消されるだろう。"
 AUS.10.a:0 "審議を開始する"
 AUS.20.t:0 "新たな指導者"
 AUS.20.d:0 "摂政として新たな指導者を選出する必要がある。"
 AUS.20.a:0 "チェコ人の代表"
 AUS.20.b:0 "スロバキア人の代表"
