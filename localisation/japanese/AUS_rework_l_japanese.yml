 # Political Focuses
 AUS_imperial_politics:0 "帝国の政治"
 AUS_imperial_politics_desc:0 "帝国の現状を再確認し、進むべき道を定めます。"
 AUS_expansion_of_autonomy:0 "自治の拡大"
 AUS_expansion_of_autonomy_desc:0 "各民族の自治権を拡大し、帝国の安定を図ります。"
 AUS_strengthen_magyar_influence:0 "マジャール人の影響力強化"
 AUS_strengthen_magyar_influence_desc:0 "マジャール人の地位を向上させ、二重帝国の絆を強めます。"
 AUS_strengthen_habsburg_legitimacy:0 "ハプスブルクの正当性強化"
 AUS_strengthen_habsburg_legitimacy_desc:0 "ハプスブルク家の正統性を強調し、中央集権化を進めます。"
 AUS_anti_austrian_parliament:0 "反オーストリア議会"
 AUS_anti_austrian_parliament_desc:0 "オーストリアの支配に反対する勢力が議会で結集します。"
 AUS_convocation_of_imperial_parliament:0 "帝国議会の召集"
 AUS_convocation_of_imperial_parliament_desc:0 "全民族の代表を集めた帝国議会を召集します。"
 AUS_autonomy_bill:0 "自治法案"
 AUS_autonomy_bill_desc:0 "広範な自治権を認める法案を提出します。"
 AUS_Hungary_Unity:0 "マジャール人の団結"
 AUS_Hungary_Unity_desc:0 "マジャール人の結束を固め、帝国における地位を不動のものにします。"
 AUS_germany_unity:0 "ドイツとの結束"
 AUS_germany_unity_desc:0 "ドイツとの関係を強化し、中央同盟の復活を目指します。"
 AUS_abandon_germany:0 "ドイツを見放す"
 AUS_abandon_germany_desc:0 "ドイツとの同盟関係を見直し、独自の道を歩みます。"
 AUS_abandon_italy:0 "イタリアを見放す"
 AUS_abandon_italy_desc:0 "イタリアとの対立を辞さず、領土問題の解決を目指します。"
 AUS_coup_detat:0 "クーデター"
 AUS_coup_detat_desc:0 "政府に対するクーデターを実行し、秩序を回復します。"
 AUS_imperial_regency:0 "帝国摂政"
 AUS_imperial_regency_desc:0 "皇帝の代理として摂政を置き、国政を安定させます。"
 AUS_true_royal_authority:0 "真なる王権"
 AUS_true_royal_authority_desc:0 "皇帝の真の権威を回復し、強力な指導体制を築きます。"
 AUS_strengthen_royal_authority:0 "王権強化"
 AUS_strengthen_royal_authority_desc:0 "王権をさらに強化し、絶対的な支配を確立します。"
 AUS_start_of_autocracy:0 "専政開始"
 AUS_start_of_autocracy_desc:0 "議会を無力化し、専制政治を開始します。"
 AUS_continuous_support_germany:0 "ドイツへの継続的な支援"
 AUS_continuous_support_germany_desc:0 "ドイツへの支援を継続し、同盟関係を維持します。"
 AUS_factories_for_weapons:0 "武器の代わりに工場を"
 AUS_factories_for_weapons_desc:0 "ドイツへの武器供与の代償として、工場建設の支援を受けます。"
 AUS_tech_for_weapons:0 "武器の代わりの技術提供"
 AUS_tech_for_weapons_desc:0 "ドイツへの武器供与の代償として、技術支援を受けます。"
 AUS_industrial_support_italy:0 "イタリアへの産業支援"
 AUS_industrial_support_italy_desc:0 "イタリアへの産業支援を行い、関係を改善します。"
 AUS_military_support_italy:0 "イタリアへの軍事支援"
 AUS_military_support_italy_desc:0 "イタリアへの軍事支援を行い、同盟の基盤を築きます。"
 AUS_unrecovered_italian_question:0 "未回収のイタリア問題"
 AUS_unrecovered_italian_question_desc:0 "未回収のイタリア問題を解決し、国境を確定させます。"
 AUS_strong_alliance:0 "強固な同盟"
 AUS_strong_alliance_desc:0 "イタリアとの強固な同盟関係を構築します。"
 AUS_expand_intervention:0 "イタリアへの介入拡大"
 AUS_expand_intervention_desc:0 "イタリアへの介入を拡大し、地中海での影響力を強めます。"
 AUS_conscription_reform_bill:0 "徴兵法改正案"
 AUS_conscription_reform_bill_desc:0 "徴兵制度を改革し、軍の規模を拡大します。"
 AUS_industrial_subsidy_bill:0 "産業補助金法案"
 AUS_industrial_subsidy_bill_desc:0 "産業への補助金を増やし、経済成長を促進します。"
 AUS_press_regulation_bill:0 "報道規制法案"
 AUS_press_regulation_bill_desc:0 "報道機関への規制を強め、世論を統制します。"
 AUS_regional_tax_reform:0 "地方税制改革"
 AUS_regional_tax_reform_desc:0 "地方税制を改革し、財政基盤を強化します。"
 AUS_political_bribery:0 "政治的賄賂"
 AUS_political_bribery_desc:0 "政治的な裏工作を行い、反対派を懐柔します。"
 AUS_mass_propaganda:0 "大衆宣伝"
 AUS_mass_propaganda_desc:0 "大規模なプロパガンダを行い、国民の支持を集めます。"

 # Economic Focuses
 AUS_wien_modernization:0 "ウィーン近代化"
 AUS_wien_modernization_desc:0 "帝国の首都ウィーンを近代化し、経済の中心としての地位を確立します。"
 AUS_imperial_development_company:0 "帝国開発会社"
 AUS_imperial_development_company_desc:0 "帝国開発会社を設立し、経済を活性化します。"
 AUS_tyrol_power_grid:0 "チロル電力網"
 AUS_tyrol_power_grid_desc:0 "チロル地域の電力網を整備し、産業を活性化します。"
 AUS_graz_steel:0 "グラーツ製鉄"
 AUS_graz_steel_desc:0 "グラーツ地域の鋼鉱を整備し、産業を活性化します。"
 AUS_wien_capital_bank:0 "ウィーン首都銀行"
 AUS_wien_capital_bank_desc:0 "ウィーン首都銀行を設立し、経済を活性化します。"
 AUS_develop_empire_teritory:0 "帝国開発"
 AUS_develop_empire_teritory_desc:0 "帝国の開発を進め、経済を活性化します。"
 AUS_wien_bank_law:0 "ウィーン銀行法"
 AUS_wien_bank_law_desc:0 "ウィーン銀行法を制定し、金融システムを安定させます。"
 AUS_hungarian_military_zone:0 "ハンガリー軍需地帯"
 AUS_hungarian_military_zone_desc:0 "ハンガリー地域に軍需産業を集積させ、帝国の防衛力を底上げします。"
 AUS_state_development:0 "州開発"
 AUS_state_development_desc:0 "帝国内の各州の開発を進め、全体の経済力を向上させます。"
 AUS_bohemia_infrastructure:0 "ボヘミアのインフラ"
 AUS_bohemia_infrastructure_desc:0 "工業地帯であるボヘミアのインフラを整備し、生産効率を高めます。"
 AUS_bohemian_industrial_trust:0 "ボヘミア産業トラスト"
 AUS_bohemian_industrial_trust_desc:0 "ボヘミアの産業をトラスト化し、競争力を強化します。"
