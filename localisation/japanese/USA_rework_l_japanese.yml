 # ========================================================================

 # 派閥対立イベント
 usa.1.t:0 "派閥対立の激化"
 usa.1.desc:0 "アメリカは二つの勢力に分裂している。ルイジアナ州知事ヒューイ・ロングは「富の共有」を掲げ、既存の経済秩序を破壊しようとしている。一方、ダグラス・マッカーサー将軍は軍の近代化と秩序の回復を訴えている。どちらを支持するかは、国家の将来を決定する重大な選択である。"
 usa.1.a:0 "ヒューイ・ロングを支持する"
 usa.1.b:0 "ダグラス・マッカーサーを支持する"
 usa.1.c:0 "中立を保つ"

 # 選挙イベント
 usa.10.t:0 "1936年選挙結果"
 usa.10.desc:0 "激しい選挙戦が終わり、ついに結果が出た。アメリカ国民は歴史的な選択を行った。"
 usa.10.a:0 "ヒューイ・ロングの勝利！"
 usa.10.b:0 "ダグラス・マッカーサーの勝利！"
 usa.10.c:0 "同点だ...選択を迫られる"

 usa.11.t:0 "決選投票"
 usa.11.desc:0 "選挙結果は僅差で決着がつかなかった。議会は大統領を選出しなければならない。"
 usa.11.a:0 "ヒューイ・ロングを選出"
 usa.11.b:0 "ダグラス・マッカーサーを選出"

 # Longルートイベント
 usa.20.t:0 "キングフィッシュ革命"
 usa.20.desc:0 "ヒューイ・ロングは大統領就任と同時に、急進的な改革を開始した。「すべての人が王様になれる！」というスローガンの下、富裕層への課税と資産の再分配が始まった。反対派は次々と逮捕され、議会は形骸化していく。アメリカは「キングフィッシュ」の支配下に入った。"
 usa.20.a:0 "新時代の始まり"

 usa.21.t:0 "財閥粛清の影響"
 usa.21.desc:0 "大企業家たちの粛清は、社会に大きな動揺をもたらした。一部の国民は正義の実現と喜んでいるが、経済への悪影響を懸念する声も上がっている。"
 usa.21.a:0 "革命の代償は必要だ"
 usa.21.b:0 "もう少し穏健に進めよう"

 # MacArthurルートイベント
 usa.30.t:0 "軍政の確立"
 usa.30.desc:0 "マッカーサー将軍は大統領就任と同時に、効率的な政府運営を開始した。軍人としての規律と組織力を政府全体に適用し、腐敗した官僚機構を一掃する。「秩序と規律」がアメリカ再建の基盤となる。"
 usa.30.a:0 "秩序の回復"

 usa.31.t:0 "産業復興"
 usa.31.desc:0 "フォーディズムの徹底により、アメリカの産業は急速に回復している。大量生産方式と効率的な管理により、工場は再びフル稼働を始めた。"
 usa.31.a:0 "産業の奇跡だ"

 # 外交イベント
 usa.40.t:0 "ロンドンへの接近"
 usa.40.desc:0 "マッカーサー政権は大英帝国との関係修復を模索している。過去の経済的摩擦を乗り越え、共通の敵である共産主義に対抗するため協力を申し出る。"
 usa.40.a:0 "使節を派遣する"

 usa.41.t:0 "アメリカからの協力提案"
 usa.41.desc:0 "アメリカのマッカーサー政権から、関係修復と協力の申し出があった。彼らは共産主義に対抗するため、英米協調を提案している。"
 usa.41.a:0 "協力を受け入れる"
 usa.41.b:0 "慎重に対応する"

 usa.42.t:0 "東京への接近"
 usa.42.desc:0 "マッカーサー政権は日本帝国との関係改善を模索している。太平洋における勢力圏を相互に認め、協力関係を構築する提案を行う。"
 usa.42.a:0 "使節を派遣する"

 usa.43.t:0 "アメリカからの協商提案"
 usa.43.desc:0 "アメリカのマッカーサー政権から、関係改善と太平洋協商の申し出があった。"
 usa.43.a:0 "協商を受け入れる"
 usa.43.b:0 "慎重に対応する"

 # 復讐イベント
 usa.50.t:0 "復讐の宣言"
 usa.50.desc:0 "ヒューイ・ロング大統領は全国民に向けて演説を行った。「日本と英国はアメリカを搾取し、屈辱を与えた。今こそ、復讐の時である！」この宣言により、アメリカは日英に対する全面戦争の準備を開始した。"
 usa.50.a:0 "復讐の十字軍を開始！"

 usa.51.t:0 "パナマ運河接収"
 usa.51.desc:0 "アメリカ軍はパナマ運河地帯を制圧した。パナマ政府は転覆され、運河は永久にアメリカの支配下に置かれることとなった。"
 usa.51.a:0 "運河は我々のものだ"

 # ========================================================================
 # アイデア
 # ========================================================================

 USA_anglo_japanese_dominance:0 "日英の経済支配"
 USA_anglo_japanese_dominance_desc:0 "アメリカ経済は日本の財閥とロンドンの銀行家たちの支配下にある。重要産業の多くは外国資本が所有し、貿易条件は不利に設定されている。この従属状態から脱却しなければ、真の独立は達成できない。"

 USA_industrial_hollowing:0 "産業の空洞化"
 USA_industrial_hollowing_desc:0 "大恐慌と世界革命の影響により、アメリカの産業基盤は著しく弱体化している。多くの工場は閉鎖され、熟練労働者は職を失った。産業の復興には長い時間と多大な努力が必要である。"

 USA_faction_rivalry:0 "派閥対立"
 USA_faction_rivalry_desc:0 "国内はロング派とマッカーサー派に二分されている。両者の激しい対立により、政府は機能不全に陥り、必要な改革が進まない状態にある。"

 USA_kingfish_regime:0 "キングフィッシュ政権"
 USA_kingfish_regime_desc:0 "ヒューイ・ロング大統領の急進的な政権。富の再分配を掲げ、既存の経済秩序を破壊しながら、独裁的な権力を確立しつつある。"

 USA_president_for_life:0 "終身大統領"
 USA_president_for_life_desc:0 "ヒューイ・ロングは終身大統領として君臨している。すべての権力は彼に集中し、反対派は完全に排除された。"

 USA_plunder_economy:0 "略奪経済"
 USA_plunder_economy_desc:0 "富裕層と外国資本からの資産没収を基盤とする経済体制。持続可能性には疑問があるが、短期的には大量の資源を動員できる。"

 USA_war_debt_repudiation:0 "戦債拒否"
 USA_war_debt_repudiation_desc:0 "日英への債務を一方的に破棄した。国際的な信用は失墜したが、債務返済の重荷からは解放された。"

 USA_mass_conscription:0 "国民皆兵"
 USA_mass_conscription_desc:0 "すべての成人男性に兵役義務を課す体制。質より量を重視し、大規模な軍を編成する。"

 USA_crusade_of_vengeance:0 "復讐の十字軍"
 USA_crusade_of_vengeance_desc:0 "日英への復讐戦争を遂行する国家体制。全国民が復讐という大義のもとに動員される。"

 USA_peoples_emperor:0 "民衆皇帝"
 USA_peoples_emperor_desc:0 "ヒューイ・ロングは日英を打倒し、「世界の民衆皇帝」として君臨している。すべての国は「富の共有」の下に置かれる。"

 USA_american_caesar:0 "アメリカのカエサル"
 USA_american_caesar_desc:0 "マッカーサー将軍は「アメリカのカエサル」として、共和国を救済する使命を負っている。軍人としての規律と名誉が、新たなアメリカの基盤となる。"

 USA_military_government:0 "軍政"
 USA_military_government_desc:0 "マッカーサー将軍による軍人政府。効率と規律を重視し、腐敗した官僚機構を一掃する。"

 USA_industrial_miracle:0 "産業の奇跡"
 USA_industrial_miracle_desc:0 "マッカーサー政権下で達成された産業復興。大量生産方式と効率的な管理により、アメリカの産業は急速に回復した。"

 USA_fordism_mega:0 "フォーディズム・メガ"
 USA_fordism_mega_desc:0 "大量生産方式を極限まで推し進めた産業体制。流れ作業と標準化により、世界最大の工業生産能力を実現。"

 USA_military_industrial_complex:0 "軍産複合体"
 USA_military_industrial_complex_desc:0 "軍と民間企業の緊密な協力関係。防衛産業の発展が経済成長を牽引する。"

 USA_grand_fleet_program:0 "大艦隊計画"
 USA_grand_fleet_program_desc:0 "太平洋と大西洋の両方で覇権を確立するための大規模な艦隊建設計画。"

 USA_world_police:0 "世界の警察官"
 USA_world_police_desc:0 "アメリカは世界秩序の守護者となった。日英と協力し、共産主義を打倒して自由と民主主義を世界に広める。"

 USA_london_cooperation:0 "ロンドン協調"
 USA_london_cooperation_desc:0 "大英帝国との協力関係。過去の摩擦を乗り越え、共通の敵に対抗するため手を結んでいる。"

 USA_tokyo_entente:0 "東京協商"
 USA_tokyo_entente_desc:0 "日本帝国との協力関係。太平洋における勢力圏を相互に認め、共存共栄を図る。"

 USA_great_depression:0 "大恐慌"
 USA_great_depression_desc:0 "1929年の株式市場崩壊から始まった経済危機。失業率は25%を超え、多くの銀行が破綻した。"

 USA_great_depression_1:0 "大恐慌（軽減）"
 USA_great_depression_1_desc:0 "経済対策により、大恐慌の影響は軽減されつつある。しかし、完全な回復にはまだ時間がかかる。"

 USA_great_depression_2:0 "大恐慌（回復中）"
 USA_great_depression_2_desc:0 "経済は着実に回復しつつある。失業率は低下し、産業活動も活発化してきた。"

 USA_dust_bowl:0 "ダストボウル"
 USA_dust_bowl_desc:0 "大平原を襲った大干ばつと砂嵐。数百万の農民が土地を失い、流浪の民となっている。"

 USA_rearmament:0 "軍備拡張"
 USA_rearmament_desc:0 "国防力強化のための軍備拡張計画。新型兵器の開発と軍の増強を進める。"

 USA_national_defense_act:0 "国防法"
 USA_national_defense_act_desc:0 "国家防衛を強化するための包括的な法律。徴兵制度と軍の組織を改革する。"

 USA_anti_communist_crusade:0 "反共十字軍"
 USA_anti_communist_crusade_desc:0 "国内外の共産主義勢力に対抗するための政策。欧州連合の脅威に備える。"

