 # ========================================================================
 # Dynamic Modifiers
 # ========================================================================
 USA_political_modifier:0 "合衆国の政治"
 USA_economic_modifier:0 "合衆国経済"
 USA_military_industry_modifier:0 "合衆国の軍事産業"
 USA_army_modifier:0 "合衆国陸軍"
 USA_navy_modifier:0 "合衆国海軍"

 # ========================================================================
 # PHASE 1: 共通ツリー - National Focus
 # ========================================================================
 # 開始点
 USA_hollow_state:0 "空洞化した共和国"
 USA_hollow_state_desc:0 "1929年の大恐慌は、アメリカ合衆国を根底から揺さぶった。かつて世界の工場と称された国は、失業者で溢れ、工場は閉鎖され、銀行は破綻した。さらに悪いことに、世界革命の余波により、日本の財閥とロンドンの銀行家たちが経済の主導権を握り、アメリカは実質的な経済植民地と化している。国内産業は日英資本に依存し、貿易条件は不利に設定され、政治は派閥争いで麻痺している。かつての「アメリカンドリーム」は遠い過去のものとなり、国民は絶望の淵に立たされている。しかし、この苦境から立ち上がる時が来た。"
 USA_hollow_state_tt:0 "§GUSA変数システムを初期化§!"
 
 # 経済ブランチ
 USA_gold_standard:0 "金本位制の再確立"
 USA_gold_standard_desc:0 "ドルの信頼性を回復するため、金本位制への復帰を宣言する。通貨の安定こそが経済復興の第一歩であり、投資家の信頼を取り戻す鍵となる。金という確固たる裏付けにより、インフレを抑制し、国際貿易における信用を回復する。"
 
 USA_rfc_loans:0 "復興金融公社"
 USA_rfc_loans_desc:0 "1932年に設立された復興金融公社（RFC）の権限を拡大し、苦境に立つ銀行と企業への融資を拡大する。政府主導の緊急資金注入により、金融システムの崩壊を食い止め、経済の血流を再び循環させる。"
 
 USA_bank_stabilization:0 "銀行安定化法"
 USA_bank_stabilization_desc:0 "全国で続発する銀行の破綻連鎖を断ち切るため、包括的な金融改革を実施する。連邦預金保険制度（FDIC）の導入により、国民の貯蓄を保護し、銀行への信頼を回復させる。これにより、預金者のパニックを防ぎ、金融システムの安定化を図る。"
 
 USA_tariff_war:0 "関税戦争"
 USA_tariff_war_desc:0 "外国製品、特に日英からの輸入品に高関税を課すことで、国内産業を保護する。これは貿易相手国との摩擦を招き、報復関税の危険性もあるが、空洞化した国内産業を復興させるためには避けられない措置である。「アメリカ製品を買おう」運動を全国で展開する。"
 
 USA_debt_audit:0 "債務監査"
 USA_debt_audit_desc:0 "日英への債務状況を詳細に監査し、不当な条件で結ばれた契約を精査する。多くの契約が、アメリカの弱みにつけ込んで締結されたものであり、再交渉の余地は十分にある。これは日英の経済支配からの脱却への第一歩となり、経済的独立を取り戻すための闘いの始まりである。"
 
 # 社会ブランチ
 USA_address_strikes:0 "ストライキへの対応"
 USA_address_strikes_desc:0 "失業と賃金切り下げに憤る労働者たちは、全国各地でストライキを決行している。工場は操業停止に追い込まれ、港湾は機能不全に陥っている。政府は労働者の要求を聞き入れるか、断固たる態度で臨むか、難しい選択を迫られている。対応を誤れば、社会的混乱はさらに拡大するだろう。"
 
 USA_veterans_bonus:0 "退役軍人ボーナス"
 USA_veterans_bonus_desc:0 "第一次世界大戦の退役軍人たちは、1924年に約束されたボーナスの即時支払いを要求している。1932年には数万人がワシントンに「ボーナス軍」として行進し、政府との対峙を強いた。この約束を果たすことで、社会不安を軽減し、軍との関係を強化し、愛国心を鼓舞する。"
 
 USA_dust_bowl_relief:0 "ダストボウル救済"
 USA_dust_bowl_relief_desc:0 "1930年代初頭、大平原を襲った未曾有の大干ばつと砂嵐により、オクラホマ、テキサス、カンザスの数百万の農民が土地を失い、流浪の民となった。「ダストボウル」と呼ばれるこの生態学的大惨事は、農業危機を深刻化させ、国民の士気を打ち砕いた。連邦政府による大規模な救済プログラムを実施し、土壌保全と農業再生に取り組む。"
 
 USA_civil_unrest:0 "市民不安への対処"
 USA_civil_unrest_desc:0 "経済危機により全国で暴動と抗議が続いている。失業者たちは路上でデモを行い、一部は過激化して略奪や放火に及んでいる。「フーヴァーヴィル」と呼ばれるスラム街が都市の周辺に広がり、社会の分断は深まる一方である。秩序を回復し、社会の安定を取り戻さなければ、国家の崩壊は時間の問題となる。"
 
 # 政治ブランチ
 USA_faction_rivalry:0 "派閥対立"
 USA_faction_rivalry_desc:0 "共和国は致命的な分裂の危機に直面している。一方には、ルイジアナ州知事ヒューイ・ロングの「富の共有」運動がある。彼は「すべての人が王様になれる」と訴え、富裕層から財産を没収して貧困層に再分配することを主張する。もう一方には、ダグラス・マッカーサー将軍の軍改革派がいる。彼は「秩序と規律」を掲げ、軍の統制による効率的な国家運営を提唱する。両派の対立は日増しに激化し、国家の将来をめぐる決定的な衝突が迫っている。"
 
 USA_administrative_failure:0 "行政の機能不全"
 USA_administrative_failure_desc:0 "現フーヴァー政権は、危機に対処する能力を完全に失った。派閥争いと汚職により連邦政府は麻痺状態に陥り、必要な改革は何一つ実現していない。官僚機構は腐敗し、議会は無為無策である。国民の不満は臨界点に達し、「何かを変えなければならない」という声が全国に響き渡っている。次の選挙で、国民が新たな道を選ぶ時が来た。"
 
 USA_election_1936:0 "1936年選挙"
 USA_election_1936_desc:0 "運命の日が来た。1936年11月、アメリカ国民は国家の将来を決定する歴史的な選択に直面している。ヒューイ・ロングの「富の共有」か、ダグラス・マッカーサー将軍の「秩序と規律」か。この選挙の結果は、アメリカ合衆国の運命を、そして世界の未来をも決定するだろう。投票所には長蛇の列ができ、国民は息を詰めて結果を待っている。"
 
 # ========================================================================
 # PHASE 1: 産業復興ブランチ - 詳細desc
 # ========================================================================
 
 USA_industrial_recovery_start:0 "産業復興の開始"
 USA_industrial_recovery_start_desc:0 "大恐慌により壊滅的な打撃を受けたアメリカの産業を再建する時が来た。工場の閉鎖、失業者の増加、生産の低下——この悪循環を断ち切るため、連邦政府が主導的な役割を果たす。産業復興プログラムを開始し、経済の血流を再び流す。これは政府の役割についての歴史的な転換点となる。"
 
 USA_rfc_reconstruction:0 "RFC再建プログラム"
 USA_rfc_reconstruction_desc:0 "復興金融公社（RFC）を通じて、破綻寸前の企業や銀行に資金を注入する。政府による直接的な経済介入は、従来のアメリカ的価値観からの逸脱だが、危機的状況には異例の措置が必要である。民間企業を救済することで、雇用を守り、経済の崩壊を食い止める。"
 
 USA_banking_reform:0 "銀行改革"
 USA_banking_reform_desc:0 "全国で続発する銀行の破綻を防ぐため、連邦預金保険制度（FDIC）を導入する。国民の貯蓄を政府が保証することで、銀行への信頼を回復し、預金引き出しの パニックを防ぐ。これは政府が個人の資産を保護するという、新しい社会契約の始まりである。"
 
 USA_industrial_codes:0 "産業規約"
 USA_industrial_codes_desc:0 "各産業部門に「公正競争規約」を導入し、価格の安定化と労働条件の改善を図る。過度な競争を制限し、企業間の協力を促すことで、産業全体の健全な発展を目指す。これは自由市場経済への介入だが、無秩序な競争の弊害を是正する必要がある。"
 
 USA_factory_standardization:0 "工場の標準化"
 USA_factory_standardization_desc:0 "生産方式と製品規格を標準化し、生産効率を向上させる。フォーディズムの原則を全産業に適用し、アメリカの工業力を復活させる。互換性のある部品、統一された工程、合理化された管理——これらにより、生産コストは劇的に低下する。"
 
 USA_dockyard_expansion:0 "造船所の拡張"
 USA_dockyard_expansion_desc:0 "沿岸部の造船所を拡張し、海運業を復活させる。新しい雇用を創出し、海上貿易の能力を向上させる。アメリカは大陸国家であると同時に海洋国家でもある——太平洋と大西洋の両方で、強力な海軍力と商船隊が必要である。"
 
 USA_production_efficiency:0 "生産効率の向上"
 USA_production_efficiency_desc:0 "工場の近代化、労働者の訓練、管理手法の改善により、生産効率を飛躍的に向上させる。アメリカの工業力が完全に回復し、再び世界の工場としての地位を取り戻す。危機は終わった——復興の時代が始まる。"
 
 # ========================================================================
 # PHASE 1: 貿易・資源ブランチ - 詳細desc
 # ========================================================================
 
 USA_trade_stabilization:0 "貿易の安定化"
 USA_trade_stabilization_desc:0 "国際貿易を安定化させるため、二国間貿易協定を再交渉し、不利な条件を改善する。日英両国の経済的支配から徐々に脱却し、より対等な貿易関係を築く。これは長期的な経済的独立への第一歩である。"
 
 USA_tariff_policy:0 "関税政策"
 USA_tariff_policy_desc:0 "保護関税を調整し、国内産業を守りつつ、必要な輸入品は確保する。完全な 自由貿易でも厳格な保護主義でもなく、国益に基づいた戦略的な関税政策を実施する。外国製品との競争から国内企業を保護しながら、消費者の利益も考慮する微妙なバランスが求められる。"
 
 USA_resource_stockpile:0 "資源の備蓄"
 USA_resource_stockpile_desc:0 "石油、鉄鋼、銅、ゴムなどの戦略資源を政府が買い上げ、備蓄する。将来の危機や紛争に備え、資源の安定供給を確保する。外国からの資源依存を減らし、経済的・軍事的な自立を目指す。"
 
 USA_market_regulation:0 "市場規制"
 USA_market_regulation_desc:0 "証券市場を規制し、投機的な取引を制限する。1929年の大暴落を招いた無秩序な株式市場の弊害を是正し、投資家を保護する。証券取引委員会（SEC）を設立し、市場の透明性と公正性を確保する。"
 
 USA_export_drives:0 "輸出促進"
 USA_export_drives_desc:0 "アメリカ製品の輸出を促進するため、政府が貿易使節団を派遣し、新しい市場を開拓する。ラテンアメリカ、アジア、欧州——世界中にアメリカ製品を輸出し、貿易黒字を拡大する。経済復興には、国内市場だけでなく、海外市場の開拓も不可欠である。"
 
 USA_resource_independence:0 "資源の自立"
 USA_resource_independence_desc:0 "国内資源の開発を加速し、外国への依存を減らす。テキサスの油田、アパラチアの炭鉱、五大湖の鉄鉱石——アメリカは豊富な天然資源に恵まれている。これらを最大限に活用し、資源の自給自足を実現する。"
 
 USA_economic_coordination:0 "経済調整"
 USA_economic_coordination_desc:0 "産業、貿易、資源政策を統合し、国家レベルで経済を調整する。各部門がバラバラに動くのではなく、全体として最適化された経済システムを構築する。これは計画経済ではないが、政府による積極的な調整である。"
 
 # ========================================================================
 # PHASE 1: 社会・労働ブランチ - 詳細desc
 # ========================================================================
 
 USA_social_stabilization:0 "社会の安定化"
 USA_social_stabilization_desc:0 "経済危機により深刻化した社会不安を緩和するため、緊急救済プログラムを実施する。失業者への食料配給、路上生活者への一時的な住居提供、困窮家庭への現金給付——政府が直接、国民の生活を支援する。これは慈善ではなく、社会の安定という国家的利益のための投資である。"
 
 USA_veterans_welfare:0 "退役軍人福祉"
 USA_veterans_welfare_desc:0 "第一次世界大戦の退役軍人たちに対し、約束されたボーナスを支払い、医療と雇用を提供する。彼らは国のために戦った——今度は国が彼らのために尽くす番である。退役軍人への支援は、軍の士気を高め、愛国心を鼓舞する効果もある。"
 
 USA_agricultural_relief:0 "農業救済"
 USA_agricultural_relief_desc:0 "ダストボウルと農産物価格の暴落により壊滅的な打撃を受けた農民を救済する。土壌保全プログラムを実施し、農産物の買い上げにより価格を安定させる。アメリカの農業を守ることは、食料安全保障と地方経済の維持に不可欠である。"
 
 USA_labor_cooperation:0 "労使協調"
 USA_labor_cooperation_desc:0 "労働組合と企業経営者の対話を促進し、ストライキと労働争議を減らす。労働者の権利を認めつつ、企業の経営も尊重する——この微妙なバランスを実現することで、生産性を向上させる。対立ではなく協力が、繁栄への道である。"
 
 USA_welfare_programs:0 "福祉プログラム"
 USA_welfare_programs_desc:0 "包括的な社会福祉制度を導入し、貧困層への支援を拡大する。母子家庭への援助、障害者への年金、失業保険の拡充——政府が「安全網」として機能し、国民を貧困から守る。これは社会主義ではなく、人間的な資本主義の実現である。"
 
 USA_infrastructure_projects:0 "インフラ事業"
 USA_infrastructure_projects_desc:0 "大規模な公共事業により、道路、橋、ダム、学校を建設する。これは単なる雇用創出ではなく、国家の基盤を強化する長期的な投資である。テネシー川流域開発公社（TVA）のような巨大プロジェクトが、地域経済を変革する。"
 
 USA_social_security:0 "社会保障制度"
 USA_social_security_desc:0 "史上初の包括的な社会保障制度を確立する。老齢年金、失業保険、障害者支援——すべての国民に最低限の生活を保障する。これはアメリカ社会の歴史的な転換点であり、政府の役割についての新しい認識を示している。国民は単なる個人ではなく、社会の一員として保護される。"
 
 # ========================================================================
 # PHASE 1: 派閥対立ブランチ - 詳細desc
 # ========================================================================
 
 USA_faction_struggle:0 "派閥闘争"
 USA_faction_struggle_desc:0 "ヒューイ・ロングとダグラス・マッカーサーの対立が表面化し、アメリカは内部分裂の危機に直面している。両者は全く異なる国家像を描いている——ロングは富の再分配による平等を、マッカーサーは軍事的規律による秩序を。この対立は単なる政治的対立ではなく、アメリカの魂をめぐる戦いである。"
 
 USA_share_our_wealth:0 "富の共有運動"
 USA_share_our_wealth_desc:0 "ヒューイ・ロングの「富の共有」運動が全国に広がる。ラジオ演説、集会、パンフレット——あらゆる手段を使って、ロングは「すべての人が王様になれる」というメッセージを伝える。貧困層と中産階級は熱狂的に支持し、富裕層は恐怖に震える。この運動は政治運動であると同時に、大衆動員の社会現象である。"
 
 USA_radio_campaign_long:0 "ロングのラジオ演説"
 USA_radio_campaign_long_desc:0 "ヒューイ・ロングは毎週末、全国ネットのラジオ番組で演説を行う。彼の雄弁な語り口と 分かりやすいメッセージは、数百万人の聴衆を魅了する。「泥棒男爵」への非難、「民衆の権利」の主張、そして日英帝国主義への怒り——ロングの言葉は、民衆の不満を代弁し、希望を与える。"
 
 USA_populist_rallies:0 "ポピュリスト集会"
 USA_populist_rallies_desc:0 "全国各地でロング支持者による大規模な集会が開催される。数万人が集まり、「富の共有」を叫び、ロングの肖像画を掲げる。集会は時に暴力的になり、反対派との衝突も発生する。この熱狂は、民主主義の活力か、それとも危険な大衆扇動か——評価は分かれている。"
 
 USA_long_machine:0 "ロング政治マシーン"
 USA_long_machine_desc:0 "ロングは全国的な政治組織を構築し、選挙での勝利に向けて準備を進める。地方の政治家、労働組合、農民団体——あらゆる勢力を糾合し、強力な政治マシーンを形成する。この組織力が、ロングに大統領選での勝利をもたらすかもしれない。"
 
 USA_military_reform:0 "軍事改革"
 USA_military_reform_desc:0 "ダグラス・マッカーサー将軍は、軍の近代化と効率化を訴える。第一次世界大戦の教訓を活かし、機動力、火力、組織力を向上させる。軍は単なる戦闘組織ではなく、規律と秩序の象徴である——この理念が、マッカーサーの改革の基盤となる。"
 
 USA_officer_corps:0 "将校団の育成"
 USA_officer_corps_desc:0 "ウェストポイント士官学校を中心に、優秀な将校を育成する。戦術、戦略、指揮統制、そして何よりも名誉と規律——これらを徹底的に教育する。将校団は軍のエリートであり、国家のリーダーシップの源泉である。"
 
 USA_order_discipline:0 "秩序と規律"
 USA_order_discipline_desc:0 "マッカーサーは「秩序と規律」をスローガンに掲げ、混乱した社会に安定をもたらすと約束する。軍隊の組織原理を社会全体に適用し、効率的で規律正しい国家を作る——この理念が、保守層と中産階級の支持を集める。"
 
 USA_mac_coalition:0 "マッカーサー連合"
 USA_mac_coalition_desc:0 "マッカーサーは軍部、保守派政治家、企業経営者を糾合し、強力な政治連合を形成する。彼らはロングの「急進的な富の再分配」に反対し、「秩序ある改革」を主張する。この連合が、マッカーサーを大統領の座へと押し上げるかもしれない。"
 
 USA_election_crisis:0 "選挙危機"
 USA_election_crisis_desc:0 "1936年の大統領選挙が近づくにつれ、国家は分裂の危機に直面している。ロング派とマッカーサー派の対立は激化し、暴力的な衝突も発生している。選挙は平和的に行われるのか、それとも内戦の引き金となるのか——誰にも予測できない。国民は不安と期待の中で、運命の日を待っている。"
 
 # ========================================================================
 # PHASE 2A: Longルート - National Focus
 # ========================================================================
 
 # ルート開始
 USA_long_victory:0 "ロングの勝利"
 USA_long_victory_desc:0 "「すべての人が王様になれる！」ヒューイ・P・ロングの声が、全国のラジオから響き渡る。圧倒的な支持を得て大統領に選出された彼は、就任演説で「富の共有」の実現を誓った。ロックフェラー、モルガン、フォード——これらの「泥棒男爵」たちから富を奪い取り、困窮する民衆に再分配する。そして、アメリカを搾取してきた日英帝国主義への復讐を宣言した。アメリカ史上最も急進的な政権が誕生し、既存の秩序は根底から覆されようとしている。"
 USA_long_victory_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+10%§!"
 
 # 政治ブランチ
 USA_kingfish_revolution:0 "キングフィッシュ革命"
 USA_kingfish_revolution_desc:0 "ヒューイ・ロングは自らを「キングフィッシュ」（大魚、支配者の意）と称し、既存の政治体制を一掃する「革命」を宣言した。議会は形骸化し、すべての権力が大統領府に集中する。反対派の議員は次々と追放され、ロングに忠実な側近たちが要職を占める。マスメディアは検閲され、キングフィッシュを称える歌と演説で溢れる。これは民主主義の終焉か、それとも真の民衆革命の始まりか。"
 USA_kingfish_revolution_desc_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+5%§!"
 
 USA_suspend_habeas:0 "人身保護令状の停止"
 USA_suspend_habeas_desc:0 "「反革命分子」と「民衆の敵」を迅速に処理するため、合衆国憲法の根幹である人身保護令状を停止する。これにより、政府は令状なしに市民を逮捕・拘禁できるようになる。政治的反対派、富裕層、保守派の知識人たちが次々と拘束され、「再教育キャンプ」に送られる。批判者たちは警告する：「これは独裁への道だ」と。しかしロングは応える：「民衆の意志こそが最高法規である」と。"
 USA_suspend_habeas_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+10%§!\nイデオロギードリフト防衛: §G+25%§!"
 
 USA_loyalty_oaths:0 "忠誠の誓い"
 USA_loyalty_oaths_desc:0 "すべての公務員、教師、軍人、そして主要企業の幹部に、キングフィッシュへの絶対的忠誠を誓わせる制度を導入する。この誓約を拒む者は、即座に解雇され、ブラックリストに載せられる。子供たちは学校で「忠誠の歌」を斉唱し、ロングの肖像画が全国の公共施設に掲げられる。この制度により、ロング体制への支持を確認し、潜在的な反対派を炙り出す。"
 USA_loyalty_oaths_tooltip:0 "§Y合衆国の政治§!に以下の修正\nイデオロギードリフト防衛: §G+25%§!\n§Y合衆国陸軍§!に以下の修正\n陸軍組織率: §G+5%§!"
 
 USA_minutemen_aux:0 "ミニットメン補助隊"
 USA_minutemen_aux_desc:0 "ロングの私兵組織「ミニットメン」を、正式な準軍事組織として全国に展開する。彼らは茶色のシャツと赤い腕章を身につけ、「富の共有」のシンボルを掲げる。表向きは「治安維持」を名目とするが、実際には国内の反対派を監視・弾圧し、ロング体制を暴力で守護する突撃隊である。夜の街角で、「反革命的」とされた市民が連行される光景が日常化していく。"
 USA_minutemen_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n徴兵可能人口: §G+1%§!"
 
 USA_share_clubs:0 "富の共有クラブ"
 USA_share_clubs_desc:0 "全国に「富の共有クラブ」を設立し、ロング体制の草の根組織とする。郵便局員、教師、鉄道労働者、農民——あらゆる職業の人々が、毎週末にクラブの集会に参加する。そこで彼らは、富裕層から没収した富を「公平に」再分配することを学び、ロングへの忠誠を新たにする。クラブは相互扶助の機能も果たすが、同時に密告システムとしても機能し、「反革命的」な言動は即座に報告される。"
 USA_share_clubs_tooltip:0 "§Y合衆国経済§!に以下の修正\n消費財: §G-3%§!"
 
 USA_purge_barons:0 "財閥の粛清"
 USA_purge_barons_desc:0 "「泥棒男爵」と呼ばれる大企業家たちを逮捕し、その資産を没収する。ロックフェラー、デュポン、メロン——これらの名家の人々が法廷に引き出され、「人民への搾取」の罪で裁かれる。彼らの邸宅は「人民の宮殿」として開放され、美術品は博物館に移され、株式と工場は国有化される。富裕層の間にパニックが広がり、多くが海外への逃亡を試みるが、国境は厳重に封鎖されている。"
 USA_purge_barons_tooltip:0 "§Y合衆国の政治§!に以下の修正\n安定度: §G+5%§!"
 
 USA_wealth_cap:0 "富の上限"
 USA_wealth_cap_desc:0 "個人の資産に法的な上限を設け、それを超える富を強制的に没収する法律を制定する。「誰も王様以上に裕福になってはならない。そして唯一の王様は、民衆全体である」——これがロングのスローガンである。上限額は年間所得500万ドル、総資産5000万ドルに設定され、超過分は全額国庫に納入される。富の蓄積は犯罪行為とみなされ、違反者には厳しい罰則が科される。"
 
 USA_estate_tax:0 "相続税100%"
 USA_estate_tax_desc:0 "死亡時の相続を原則として禁止し、すべての資産を国家が接収する「100%相続税」を導入する。「富は一代限りのものであり、世襲してはならない」という原則の下、死者の財産は全て「民衆の共有財産」として国有化される。これにより、世襲的な富裕層の形成を完全に防ぎ、階級の固定化を阻止する。反対派は「これは財産権の完全な否定だ」と抗議するが、ロングは「民衆に財産権などなかった。今こそ、真の平等が実現される」と宣言する。"
 
 USA_pres_for_life:0 "終身大統領"
 USA_pres_for_life_desc:0 "ヒューイ・ロングは憲法を「民衆の意志を妨げる時代遅れの障害」と断じ、終身大統領への就任を宣言した。憲法修正という形式を取りつつも、実質的には憲法の廃棄である。今後の「選挙」は、キングフィッシュへの信任投票という形式的な儀式と化す。批判者たちは投獄され、メディアはロングを称える歌で溢れる。「すべての人が王様になれる」という約束の下、実際に王座に座るのはただ一人だけである。民主主義の理想は、ポピュリズムの怪物に食い尽くされた。"
 USA_pres_for_life_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+15%§!\n降伏限界: §G+10%§!"
 
 # Long経済ツリー
 USA_plunder_economy:0 "略奪経済"
 USA_plunder_economy_desc:0 "既存の資本主義経済秩序を根底から破壊し、富裕層と外国資本から富を組織的に奪い取る「略奪経済」を開始する。銀行口座は凍結され、株式は無価値化し、工場は労働者評議会の管理下に置かれる。これは経済学者たちが「狂気の沙汰」と呼ぶ政策だが、ロングは「搾取者から搾取し返す正義の実現」と断言する。この略奪した富こそが、「アメリカ再建」の資金源となる。"
 USA_plunder_economy_tooltip:0 "§Y合衆国経済§!に以下の修正\n消費財: §G-3%§!\n§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+5%§!"
 
 USA_nationalize_banks:0 "銀行国有化"
 USA_nationalize_banks_desc:0 "すべての民間銀行を国有化し、単一の「人民銀行」を設立する。ウォール街の銀行家たちは絶望の叫びを上げるが、武装したミニットメンが銀行を次々と接収していく。預金は「人民の財産」として管理され、融資は「革命への貢献度」に基づいて割り当てられる。金融システムを完全に政府管理下に置くことで、資本の流れを統制し、反革命勢力への資金供給を断つ。"
 USA_nationalize_banks_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+10%§!\n§Y合衆国経済§!に以下の修正\n民需工場建設速度: §G+5%§!"
 
 USA_seize_foreign_assets:0 "外国資産没収"
 USA_seize_foreign_assets_desc:0 "日本企業とイギリス企業が所有する全ての資産を「敵性資産」として一方的に接収する。三菱、三井、ロイヤル・ダッチ・シェル——これらの企業の工場、鉱山、油田が、武装警察によって占拠される。国際法違反だと非難されるが、ロングは「彼らこそがアメリカを違法に搾取してきたのだ」と反論する。外交関係は急速に悪化し、戦争の足音が近づいてくる。"
 USA_seize_foreign_assets_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+10%§!"
 
 USA_redistribute_wealth:0 "富の再分配"
 USA_redistribute_wealth_desc:0 "没収した富と資産を、「公平に」民衆に再分配する——これがロングの約束である。所得再分配政策により、最低賃金は大幅に引き上げられ、累進課税は最高税率95%に達する。社会保障制度が拡充され、無料の医療と教育が提供される。中産階級の生活水準は向上するが、それは富裕層からの略奪によって成り立っている。経済の持続可能性は疑問視されるが、今はまだ、「富の共有」の蜜月期である。"
 USA_redistribute_wealth_tooltip:0 "§Y合衆国経済§!に以下の修正\n消費財: §G-5%§!"
 
 # Long軍事ツリー
 USA_peoples_army:0 "人民の軍隊"
 USA_peoples_army_desc:0 "軍をキングフィッシュに忠実な「人民の軍隊」として再編成する。伝統的な階級制度は「ブルジョア的特権」として緩和され、将校と兵士の格差は縮小される。代わりに、政治将校（コミッサール）が各部隊に配置され、兵士の思想教育と忠誠心の維持を担当する。軍は国家防衛組織から、ロング体制の暴力装置へと変貌していく。"
 USA_peoples_army_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍組織率: §G+5%§!"
 
 USA_mass_conscription:0 "国民皆兵"
 USA_mass_conscription_desc:0 "すべての成人男性に兵役義務を課す国民皆兵制を導入する。「すべてのアメリカ人は戦士である」というスローガンの下、大規模な動員が行われる。訓練は短期間で、装備は簡素だが、数で敵を圧倒する戦略である。質より量——これが人民の軍隊の原則となる。"
 USA_mass_conscription_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n徴兵可能人口: §G+5%§!"
 
 # ========================================================================
 # PHASE 2B: MacArthurルート
 # ========================================================================
 
 USA_mac_victory:0 "マッカーサーの勝利"
 USA_mac_victory_desc:0 "ダグラス・マッカーサー将軍は、軍部と保守派の圧倒的な支持を背景に大統領に選出された。就任演説で彼は「秩序と規律」「軍の統制」を掲げ、「腐敗した政治家と無能な官僚の時代は終わった」と宣言した。軍人としての手腕で国家を再建し、効率的な組織運営により経済を復興させる——これがマッカーサーの約束である。日英との協調路線により、アメリカは再び大国としての地位を取り戻すだろう。しかし、その代償として、民主主義は大きく後退することになる。"
 USA_mac_victory_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+10%§!"
 
 USA_american_caesar:0 "アメリカのカエサル"
 USA_american_caesar_desc:0 "ダグラス・マッカーサーは自らを「アメリカのカエサル」と称し、共和国を「救済」する歴史的使命を負うと宣言する。古代ローマのカエサルが共和政の混乱を終わらせたように、彼もまた、派閥争いで麻痺した共和国に秩序をもたらす。軍人としての規律と名誉が、新たなアメリカの基盤となる。これは独裁の始まりか、それとも秩序ある統治の実現か——歴史が判断するだろう。"
 USA_american_caesar_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+15%§!\n安定度: §G+10%§!"
 
 USA_military_government:0 "軍事政権"
 USA_military_government_desc:0 "軍部による本格的な政治統制が確立される。主要な閣僚ポストは軍人が占め、州知事には退役将校が任命される。軍の効率的な組織体制を国家全体に適用し、命令系統を明確化する。民間部門も軍事的秩序の下に置かれ、「規律こそが効率の源泉」という原則が徹底される。議会は諮問機関と化し、実権は大統領府の軍事評議会に移る。"
 USA_military_government_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+10%§!\n安定度: §G+5%§!"
 
 USA_meritocracy:0 "能力主義"
 USA_meritocracy_desc:0 "出自、人脈、政治的関係ではなく、純粋に能力と実績に基づく人事を徹底する。軍の効率的な組織運営を政府全体に適用し、無能な官僚を次々と解任する。昇進は試験と業績評価によって決定され、縁故主義は厳しく罰せられる。これにより、政府機構の効率は劇的に向上するが、政治的多様性は失われていく。"
 USA_meritocracy_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+5%§!"
 
 USA_technocracy:0 "テクノクラシー"
 USA_technocracy_desc:0 "技術者、科学者、経営学者を国家の中枢に登用し、技術的優位性と科学的手法に基づく国力強化を推進する。「感情ではなく理性、政治ではなく科学」——これがテクノクラシーの原則である。経済政策は数理モデルに基づいて策定され、社会問題は工学的に「最適化」される。人間性は数値化され、政治は技術的問題へと還元されていく。"
 USA_technocracy_tooltip:0 "§Y合衆国経済§!に以下の修正\n研究速度: §G+10%§!"
 
 USA_industrial_council:0 "産業評議会"
 USA_industrial_council_desc:0 "軍、政府、企業の代表からなる産業評議会を設立し、国家の産業政策を調整・統制する。軍の合理的な組織運営手法を経済全体に適用し、資源配分を最適化し、生産効率を最大化する。これは国家資本主義の一形態であり、自由市場経済からは大きく逸脱するが、マッカーサーは「効率こそが正義である」と断言する。"
 USA_industrial_council_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+10%§!\n生産効率上限: §G+5%§!"
 
 USA_fordism_mega:0 "フォーディズムの極致"
 USA_fordism_mega_desc:0 "ヘンリー・フォードが確立した大量生産方式を、極限まで推し進める。流れ作業、部品の完全な標準化、垂直統合——これらの原則を全産業に適用する。工場は巨大な機械となり、労働者はその部品として組み込まれる。人間性は犠牲になるが、生産効率は桁違いに向上し、アメリカは世界最大の工業国として復活する。"
 USA_fordism_mega_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+20%§!\n生産効率上限: §G+10%§!"
 
 # ========================================================================
 # イベント
 # ========================================================================
 
 # 派閥対立イベント
 usa.1.t:0 "派閥対立の激化"
 usa.1.desc:0 "大恐慌によって打ちのめされたアメリカは、致命的な分裂の危機に直面している。一方には、ルイジアナ州知事ヒューイ・ロングがいる。彼の「富の共有」運動は数百万の貧困層を熱狂させ、「すべての人が王様になれる」という過激なスローガンが全国に響き渡る。もう一方には、ダグラス・マッカーサー将軍がいる。軍の英雄である彼は「秩序と規律」を掲げ、軍事的効率性による国家再建を訴える。両者の対立は単なる政治闘争を超え、アメリカの魂をめぐる戦いとなっている。我々はどちらを支持すべきか?"
 usa.1.a:0 "ヒューイ・ロングを支持する"
 usa.1.b:0 "ダグラス・マッカーサーを支持する"
 usa.1.c:0 "中立を保つのも一つの道だ"
 
 # 選挙イベント
 usa.10.t:0 "1936年選挙結果"
 usa.10.desc:0 "運命の夜が訪れた。1936年11月、全米が固唾を飲んで選挙結果を待っている。ラジオから流れる速報、街角で叫ぶ新聞売り、投票所前の長蛇の列——激しい選挙戦の末、ついに結果が発表される。ヒューイ・ロングの「富の共有」か、ダグラス・マッカーサーの「秩序と規律」か。アメリカ国民は歴史的な選択を行った。この結果は、アメリカだけでなく世界の未来をも決定するだろう。"
 usa.10.a:0 "ヒューイ・ロングの勝利！"
 usa.10.b:0 "ダグラス・マッカーサーの勝利！"
 usa.10.c:0 "同点だ...選択を迫られる"
 
 usa.11.t:0 "決選投票"
 usa.11.desc:0 "選挙結果は僅差で決着がつかず、国家は分裂の危機に瀕している。両陣営の支持者が街頭で衝突し、一部では暴力沙汰も発生している。憲法の規定により、議会が大統領を選出しなければならない。しかし、議会もまた派閥に分裂している。この決定は、平和的に行われるのか、それとも内戦の引き金となるのか——誰にも予測できない。国民は不安と期待の中で、議会の決定を待っている。"
 usa.11.a:0 "ヒューイ・ロングを選出"
 usa.11.b:0 "ダグラス・マッカーサーを選出"
 
 # Longルートイベント
 usa.20.t:0 "キングフィッシュ革命"
 usa.20.desc:0 "1937年1月、ヒューイ・P・ロングが第32代アメリカ合衆国大統領として就任した。就任演説で彼は「真の民主主義革命」の開始を宣言した。「我々は富裕層の手から国家を取り戻し、民衆に返還する!」——首都に集まった数万の支持者が歓声を上げる。その日のうちに、緊急大統領令が次々と発令された。富裕層への課税強化、資産の強制的再分配、反対派議員の追放——「キングフィッシュ革命」が始まった。既存の秩序は根底から覆され、新たなアメリカが誕生しようとしている。これは民衆の勝利か、それとも独裁の始まりか?"
 usa.20.a:0 "新時代の始まりだ"
 
 usa.21.t:0 "財閥粛清の影響"
 usa.21.desc:0 "ロックフェラー、デュポン、メロン——アメリカの「泥棒男爵」たちが次々と逮捕され、その資産は没収された。「人民の法廷」で彼らは「民衆への搾取」の罪で裁かれ、有罪判決を受けた。彼らの邸宅は「人民の宮殿」として開放され、株式と工場は国有化された。しかし、この過激な政策は経済に大きな混乱をもたらしている。株式市場は大暴落し、外国投資家は逃げ出し、失業率は一時的に上昇した。民衆は正義の実現と喜んでいるが、経済学者たちは「これは経済自殺だ」と警告している。革命には代償が伴う——問題は、その代償が支払う価値があるかどうかだ。"
 usa.21.a:0 "革命の代償は必要だ"
 usa.21.b:0 "もう少し穏健に進めよう"
 
 # MacArthurルートイベント
 usa.30.t:0 "軍政の確立"
 usa.30.desc:0 "1937年1月、ダグラス・マッカーサー将軍が第32代アメリカ合衆国大統領として就任した。彼の就任演説は、軍人らしく簡潔で力強いものだった。「混乱は終わった。秩序が回復される」——これが彼の約束である。就任初日から、軍的組織運営手法が政府全体に適用された。無能な官僚は即座に解雇され、退役将校が主要ポストに任命された。命令系統は明確化され、意思決定は迅速化された。腐敗した政治家たちは震え上がっている。これは効率的な統治の始まりか、それとも軍事独裁への道か——歴史が判断するだろう。"
 usa.30.a:0 "秩序が回復される"
 
 usa.31.t:0 "産業復興"
 usa.31.desc:0 "マッカーサー政権の産業政策が驚異的な成果を上げている。ヘンリー・フォードが確立した大量生産方式を極限まで推し進め、標準化・垂直統合・品質管理を徹底した結果、アメリカの工場は再びフル稼働を始めた。失業率は劇的に低下し、生産量は恐慌前の水準を回復した。工場は24時間休みなく稼働し、鋼鉄と機械の轟音が再び大地を揺るがす。「産業の奇跡」——新聞はこう報じている。しかし、この繁栄は軍事的規律と労働者の犠牲の上に成り立っている。工場は軍隊の兵舎のように運営され、労働者は兵士のように働かされる。効率か人間性か——マッカーサーの選択は明らかである。"
 usa.31.a:0 "産業の奇跡だ"
 
