l_japanese:
 # ============================================================================
 # USA Localization - Empire of Breakwaters
 # ============================================================================

 # ========================================================================
 # PHASE 1: 共通ツリー - National Focus
 # ========================================================================

 # 開始点
 USA_hollow_state:0 "空洞化した共和国"
 USA_hollow_state_desc:0 "かつての繁栄は遠い過去のものとなった。大恐慌と世界革命の余波により、アメリカ合衆国は日本の財閥とロンドンの銀行家たちの経済的支配下に置かれている。国内産業は空洞化し、政治は派閥争いで麻痺している。しかし、この苦境から立ち上がる時が来た。"
 USA_hollow_state_tt:0 "§HUSA変数システムを初期化§!"

 # 経済ブランチ
 USA_gold_standard:0 "金本位制の再確立"
 USA_gold_standard_desc:0 "通貨の安定こそが経済復興の第一歩である。金本位制に復帰することで、ドルの信頼性を取り戻し、投資家の信頼を回復する。"

 USA_rfc_loans:0 "復興金融公社"
 USA_rfc_loans_desc:0 "政府主導の融資プログラムにより、苦境に立つ銀行と企業を救済する。この緊急措置により、経済の崩壊を食い止める。"

 USA_bank_stabilization:0 "銀行安定化法"
 USA_bank_stabilization_desc:0 "金融システムの改革により、銀行の破綻連鎖を防ぐ。連邦預金保険制度の導入で、国民の貯蓄を保護する。"

 USA_tariff_war:0 "関税戦争"
 USA_tariff_war_desc:0 "外国製品に高関税を課すことで、国内産業を保護する。これは貿易相手国との摩擦を招くが、アメリカの産業復興には不可欠である。"

 USA_debt_audit:0 "債務監査"
 USA_debt_audit_desc:0 "外国への債務状況を詳細に監査し、不当な条件で結ばれた契約を見直す。これは日英の経済支配からの脱却への第一歩となる。"

 # 社会ブランチ
 USA_address_strikes:0 "ストライキへの対応"
 USA_address_strikes_desc:0 "全国で発生している労働争議に対処する。労働者の要求を聞き入れるか、断固たる態度で臨むか、選択を迫られている。"

 USA_veterans_bonus:0 "退役軍人ボーナス"
 USA_veterans_bonus_desc:0 "世界大戦の退役軍人たちに約束されたボーナスを支給する。これにより社会不安を軽減し、軍との関係を強化する。"

 USA_dust_bowl_relief:0 "ダストボウル救済"
 USA_dust_bowl_relief_desc:0 "大平原を襲った大干ばつと砂嵐により、数百万の農民が土地を失った。連邦政府による救済プログラムを実施し、農業危機に対処する。"

 USA_civil_unrest:0 "市民不安への対処"
 USA_civil_unrest_desc:0 "経済危機により全国で暴動と抗議が続いている。秩序を回復し、社会の安定を取り戻さなければならない。"

 # 政治ブランチ
 USA_faction_rivalry:0 "派閥対立"
 USA_faction_rivalry_desc:0 "共和国は二つの派閥に分裂している。ヒューイ・ロングの「富の共有」運動と、ダグラス・マッカーサー将軍の軍改革派が、国家の将来をめぐって激しく争っている。"

 USA_administrative_failure:0 "行政の機能不全"
 USA_administrative_failure_desc:0 "現政権は危機に対処する能力を完全に失った。派閥争いと汚職により、連邦政府は麻痺状態に陥っている。次の選挙で、国民が新たな道を選ぶ時が来た。"

 USA_election_1936:0 "1936年選挙"
 USA_election_1936_desc:0 "運命の日が来た。アメリカ国民は、ヒューイ・ロングの「富の共有」か、ダグラス・マッカーサー将軍の「秩序と規律」か、国家の将来を決定する。"

 # ========================================================================
 # PHASE 2A: Longルート - National Focus
 # ========================================================================

 # ルート開始
 USA_long_victory:0 "ロングの勝利"
 USA_long_victory_desc:0 "「すべての人が王様になれる！」ヒューイ・ロングは圧倒的な支持を得て大統領に選出された。富の再分配と日英への復讐を掲げ、アメリカ史上最も急進的な政権が誕生する。"

 # 政治ブランチ
 USA_kingfish_revolution:0 "キングフィッシュ革命"
 USA_kingfish_revolution_desc:0 "ロングは自らを「キングフィッシュ」と称し、既存の政治体制を一掃する。議会は形骸化し、すべての権力が大統領に集中する。"

 USA_suspend_habeas:0 "人身保護令状の停止"
 USA_suspend_habeas_desc:0 "反革命分子と「民衆の敵」を迅速に処理するため、人身保護令状を停止する。政治的反対派は次々と拘束される。"

 USA_loyalty_oaths:0 "忠誠の誓い"
 USA_loyalty_oaths_desc:0 "すべての公務員と軍人に、キングフィッシュへの忠誠を誓わせる。この制度により、ロング体制への支持を確認する。"

 USA_minutemen_aux:0 "ミニットメン補助隊"
 USA_minutemen_aux_desc:0 "ロングの私兵組織「ミニットメン」を正式な準軍事組織として編成する。彼らは国内の反対派を弾圧し、革命を守護する。"

 USA_share_clubs:0 "富の共有クラブ"
 USA_share_clubs_desc:0 "全国に「富の共有クラブ」を設立し、ロング体制の草の根組織とする。彼らは富裕層から没収した富を「公平に」再分配する。"

 USA_purge_barons:0 "財閥の粛清"
 USA_purge_barons_desc:0 "「泥棒男爵」と呼ばれる大企業家たちを逮捕し、その資産を没収する。彼らの富は「民衆のもの」として国有化される。"

 USA_wealth_cap:0 "富の上限"
 USA_wealth_cap_desc:0 "個人の資産に上限を設け、それを超える富を強制的に没収する。「誰も王様以上に裕福になってはならない」がスローガンである。"

 USA_estate_tax:0 "相続税100%"
 USA_estate_tax_desc:0 "死亡時の相続を原則として禁止し、すべての資産を国家が接収する。これにより、世襲的な富裕層の形成を完全に防ぐ。"

 USA_pres_for_life:0 "終身大統領"
 USA_pres_for_life_desc:0 "憲法を改正し、ヒューイ・ロングを終身大統領に就任させる。「民主主義は民衆の意志を反映している」として、今後の選挙は形式的なものとなる。"

 # 経済ブランチ
 USA_plunder_path:0 "略奪の道"
 USA_plunder_path_desc:0 "既存の経済秩序を破壊し、富裕層と外国資本から富を奪い取る。これが「アメリカ再建」の資金源となる。"

 USA_default_debts:0 "債務不履行"
 USA_default_debts_desc:0 "日英への債務を一方的に破棄する。「植民地的搾取への賠償」として、逆に補償を要求する。"

 USA_expro_oil:0 "石油産業の接収"
 USA_expro_oil_desc:0 "スタンダード・オイルを筆頭とする石油企業を国有化する。外国資本の影響を排除し、戦略資源を国家管理下に置く。"

 USA_seize_factories:0 "工場の接収"
 USA_seize_factories_desc:0 "日本企業が所有する工場を「敵性資産」として接収する。これらは「民衆の財産」として国営化される。"

 USA_national_bank:0 "国立銀行"
 USA_national_bank_desc:0 "すべての銀行を国有化し、単一の国立銀行を設立する。これにより、金融システムを完全に政府管理下に置く。"

 USA_long_dollars:0 "ロング・ドル"
 USA_long_dollars_desc:0 "新通貨「ロング・ドル」を発行し、旧通貨との交換レートを政府が決定する。これにより、富の再分配を加速する。"

 USA_mississippi_project:0 "ミシシッピ・プロジェクト"
 USA_mississippi_project_desc:0 "大規模な公共事業により、ミシシッピ川流域を産業地帯として開発する。失業者を動員し、「民衆の力」で国家を再建する。"

 USA_plunder_economy_mega:0 "略奪経済の完成"
 USA_plunder_economy_mega_desc:0 "アメリカ経済は完全にロング体制の支配下に入った。すべての富は「民衆のもの」であり、国家がその配分を決定する。"

 # 軍事ブランチ
 USA_military_long:0 "人民の軍隊"
 USA_military_long_desc:0 "軍をキングフィッシュに忠実な「人民の軍隊」として再編成する。階級制度を緩和し、政治将校を配置する。"

 USA_man_soldier:0 "国民皆兵"
 USA_man_soldier_desc:0 "すべての成人男性に兵役義務を課す。「すべてのアメリカ人は戦士である」というスローガンの下、大規模な動員を行う。"

 USA_commissars:0 "政治委員"
 USA_commissars_desc:0 "軍の各部隊に政治委員を配置し、兵士の思想教育と士気の維持を担当させる。"

 USA_attrition_doc:0 "消耗戦ドクトリン"
 USA_attrition_doc_desc:0 "人的資源を最大限に活用した消耗戦を採用する。「一人倒れれば十人が立ち上がる」精神で敵を圧倒する。"

 USA_mosquito_fleet:0 "蚊の艦隊"
 USA_mosquito_fleet_desc:0 "高価な大型艦艇ではなく、安価で大量生産可能な小型艦艇を重視する。潜水艦と魚雷艇で日英の艦隊に立ち向かう。"

 USA_arsenal_poor:0 "貧者の兵器廠"
 USA_arsenal_poor_desc:0 "高級な兵器ではなく、大量生産可能な簡素な装備で軍を武装する。質より量で敵を圧倒する戦略である。"

 # 外交ブランチ
 USA_revenge_start:0 "復讐の始まり"
 USA_revenge_start_desc:0 "日英への復讐の時が来た。彼らはアメリカを搾取し、屈辱を与えた。今こそ、その代償を払わせる時である。"

 USA_panama_seize:0 "パナマ運河の接収"
 USA_panama_seize_desc:0 "パナマ運河は本来アメリカのものである。パナマ政府を転覆させ、運河地帯を永久に併合する。"

 USA_alaska_ulti:0 "アラスカ最後通牒"
 USA_alaska_ulti_desc:0 "カナダ領アラスカは歴史的にアメリカの領土である。カナダに対し、アラスカの即時返還を要求する。"

 USA_maple_operation:0 "メイプル作戦"
 USA_maple_operation_desc:0 "カナダ全土を征服する。英国の植民地を解放し、北米大陸を統一する。"

 USA_pacific_typhoon:0 "太平洋の嵐"
 USA_pacific_typhoon_desc:0 "日本帝国を打倒する。彼らがアメリカに与えた屈辱の代償を、何倍にもして返す。"

 USA_london_fall:0 "ロンドンの没落"
 USA_london_fall_desc:0 "大英帝国を崩壊させる。彼らの植民地帝国を解体し、世界の人民を解放する。"

 USA_tokyo_burn:0 "東京炎上"
 USA_tokyo_burn_desc:0 "日本本土を灰燼に帰す。戦略爆撃により、日本の戦争継続能力を完全に破壊する。"

 USA_emperor_of_world:0 "世界の民衆皇帝"
 USA_emperor_of_world_desc:0 "ヒューイ・ロングは全世界の「民衆皇帝」として君臨する。日英を打倒し、アメリカは世界帝国となった。すべての国は「富の共有」の下に置かれる。"

 # ========================================================================
 # PHASE 2B: MacArthurルート - National Focus
 # ========================================================================

 # ルート開始
 USA_mac_victory:0 "マッカーサーの勝利"
 USA_mac_victory_desc:0 "ダグラス・マッカーサー将軍が大統領に選出された。「秩序と規律」を掲げ、軍人としての手腕で国家を再建する。日英との協調により、アメリカは再び大国としての地位を取り戻す。"

 # 政治ブランチ
 USA_mac_caesar:0 "アメリカのカエサル"
 USA_mac_caesar_desc:0 "マッカーサーは自らを「アメリカのカエサル」と称し、共和国を救済する使命を負う。軍人としての規律と名誉が、新たなアメリカの基盤となる。"

 USA_martial_law:0 "戒厳令"
 USA_martial_law_desc:0 "社会秩序を回復するため、一時的に戒厳令を布告する。軍が治安維持を担当し、犯罪と暴動を鎮圧する。"

 USA_meritocracy:0 "能力主義"
 USA_meritocracy_desc:0 "出自ではなく能力に基づく人事を徹底する。軍の効率的な組織運営を政府全体に適用する。"

 USA_anti_commie:0 "反共十字軍"
 USA_anti_commie_desc:0 "共産主義は最大の敵である。国内の共産主義者を取り締まり、欧州連合の脅威に備える。"

 USA_stratocracy:0 "軍政国家"
 USA_stratocracy_desc:0 "軍人による統治が最も効率的である。政府の主要ポストを軍人が占め、国家運営を軍事的精度で行う。"

 USA_eternal_regent:0 "永遠の摂政"
 USA_eternal_regent_desc:0 "マッカーサーは「永遠の摂政」として、共和国の守護者となる。彼が生きる限り、アメリカは強く、秩序正しい国家であり続ける。"

 # 経済ブランチ
 USA_reconstruction_path:0 "再建の道"
 USA_reconstruction_path_desc:0 "秩序ある経済再建を開始する。無駄を排除し、効率的な資源配分により、産業を復興させる。"

 USA_stabilize_dollar:0 "ドルの安定化"
 USA_stabilize_dollar_desc:0 "通貨の安定は経済の基盤である。健全な財政政策により、ドルの信頼性を回復する。"

 USA_technocracy:0 "テクノクラシー"
 USA_technocracy_desc:0 "技術者と専門家による統治を推進する。科学的手法で経済問題を解決し、効率を最大化する。"

 USA_standardize_parts:0 "部品の標準化"
 USA_standardize_parts_desc:0 "軍の効率的な補給体系を民間産業に適用する。部品の互換性を高め、生産効率を向上させる。"

 USA_industrial_council:0 "産業評議会"
 USA_industrial_council_desc:0 "軍、政府、企業の代表からなる産業評議会を設立し、国家の産業政策を調整する。"

 USA_federal_highways:0 "連邦高速道路"
 USA_federal_highways_desc:0 "全国を結ぶ高速道路網を建設する。これは経済発展と軍事的機動力の両方に貢献する。"

 USA_military_ind_complex:0 "軍産複合体"
 USA_military_ind_complex_desc:0 "軍と民間企業の緊密な協力関係を構築する。防衛産業の発展が、経済成長の原動力となる。"

 USA_fordism_mega:0 "フォーディズムの極致"
 USA_fordism_mega_desc:0 "大量生産方式を極限まで推し進める。流れ作業と標準化により、アメリカは世界最大の工業国として復活する。"

 USA_hegemony_economy:0 "覇権経済"
 USA_hegemony_economy_desc:0 "アメリカ経済は完全に復活した。日英の経済的支配から脱却し、自立した産業基盤を確立した。"

 # 軍事ブランチ
 USA_military_mac:0 "軍の近代化"
 USA_military_mac_desc:0 "最新の軍事技術を導入し、軍を近代化する。質の高い精鋭軍を編成し、いかなる敵にも対抗する。"

 USA_firepower_mega:0 "火力の優位"
 USA_firepower_mega_desc:0 "圧倒的な火力で敵を粉砕する。砲兵と航空支援を重視した戦闘ドクトリンを採用する。"

 USA_air_superiority:0 "航空優勢"
 USA_air_superiority_desc:0 "制空権の獲得を最優先とする。強力な空軍を建設し、戦場の上空を支配する。"

 USA_mobile_modern:0 "機動戦の近代化"
 USA_mobile_modern_desc:0 "機甲部隊を中心とした機動戦を採用する。迅速な機動と集中攻撃で敵を撃破する。"

 USA_strategic_bombing:0 "戦略爆撃"
 USA_strategic_bombing_desc:0 "敵国の産業基盤を破壊する戦略爆撃能力を構築する。長距離爆撃機の開発を推進する。"

 USA_blue_water:0 "ブルーウォーター海軍"
 USA_blue_water_desc:0 "外洋で作戦可能な大洋艦隊を建設する。太平洋と大西洋の両方で覇権を確立する。"

 USA_carrier_doctrine:0 "空母ドクトリン"
 USA_carrier_doctrine_desc:0 "航空母艦を艦隊の中核とする新ドクトリンを採用。航空戦力による艦隊決戦を志向する。"

 USA_global_reach:0 "グローバル・リーチ"
 USA_global_reach_desc:0 "世界のあらゆる場所に軍事力を投射する能力を獲得する。空挺部隊と海兵隊を強化する。"

 # 外交ブランチ
 USA_hegemony_start:0 "覇権への道"
 USA_hegemony_start_desc:0 "アメリカは再び世界の舞台に立つ準備が整った。日英との協調により、共産主義の脅威に立ち向かう。"

 USA_las_league:0 "全米諸国連盟"
 USA_las_league_desc:0 "中南米諸国との同盟関係を強化する。汎アメリカ主義の下、西半球の安全保障を確立する。"

 USA_coop_with_london:0 "ロンドンとの協調"
 USA_coop_with_london_desc:0 "大英帝国との関係を修復する。過去の摩擦を乗り越え、共通の敵に対抗するため協力する。"

 USA_tokyo_entente:0 "東京協商"
 USA_tokyo_entente_desc:0 "日本帝国との関係を改善する。太平洋における勢力圏を相互に認め、協力関係を構築する。"

 USA_anti_comintern_pact:0 "反コミンテルン協定"
 USA_anti_comintern_pact_desc:0 "日英と共に反共産主義同盟を結成する。欧州連合の拡大を阻止し、自由世界を守護する。"

 USA_global_policeman:0 "世界の警察官"
 USA_global_policeman_desc:0 "アメリカは世界秩序の守護者となった。日英と協力し、共産主義を打倒して自由と民主主義を世界に広める使命を負う。"

