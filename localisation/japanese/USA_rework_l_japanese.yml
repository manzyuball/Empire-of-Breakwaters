l_japanese:
 # =========================================================================
 # リーダー & 特性
 # =========================================================================
 USA_herbert_hoover:0 "ハーバート・フーバー"
 USA_hoover_trait:0 "尻拭いの苦労人"
 USA_hoover_trait_desc:0 "フーバーは、誰もが望まなかった地位を押し付けられた哀れな男である。前任者たちの無責任な経済政策と、外国からの搾取の結果として残された瓦礫の山を、彼は今、一人で片付けようとしている。彼の誠実な努力は民衆には理解されず、彼の名は歴史において「無能な大統領」として記憶されるだろう。それでも彼は今日も、燃え盛る船の舵を握り続ける。"

 # =========================================================================
 # 国民精神 (Ideas)
 # =========================================================================
 USA_londons_servant:0 "ロンドンの下僕"
 USA_londons_servant_desc:0 "我々の祖父たちは、独立のためにイギリスと戦った。だが孫である我々は、今やロンドンのシティの奴隷に成り下がっている。第一次大戦の参戦時に結ばれた屈辱的な融資契約は、我が国の経済を完全に大英帝国の支配下に置いた。国家予算の大部分は利子返済に消え、国内への投資は滞っている。英国の銀行家たちは、我々が少しでも逆らえば、経済制裁という鞭で叩く準備ができている。"
 
 USA_zaibatsu_backyard:0 "財閥の裏庭"
 USA_zaibatsu_backyard_desc:0 "「安価で高品質」という甘言とともに、日本の大財閥は太平洋を越えて我が国の市場を浸食した。今や、自動車から玩具に至るまで、アメリカ人が手にする商品の多くは財閥のロゴが刻印されている。国内製造業は価格競争に敗れ、工場は閉鎖され、技術者や熟練労働者は路頭に迷っている。彼らは我々の富を吸い上げるだけでなく、その富で我が国の土地や資産を買い漁っている。"
 
 USA_strike_breakers:0 "ストライキ・ブレイカー"
 USA_strike_breakers_desc:0 "軍の存在意義が問われている。我が合衆国軍は、外敵からの国防のためではなく、国内の「敵」——すなわち飢えた失業者、賃上げを求める労働者——を踏みつけるために存在している。兵士たちは自国民に銃口を向けることを強いられ、士気は地に落ちた。将校たちは訓練よりも暴動鎮圧の計画に忙殺され、軍としての練度は著しく低下している。"
 
 USA_ghost_of_monroe:0 "モンローの亡霊"
 USA_ghost_of_monroe_desc:0 "かつてのモンロー・ドクトリンは、アメリカ大陸を外部の干渉から守る盾であった。だが今や、その盾は錆び付き、我々自身を守ることすらできない。中南米諸国は外国勢力になびき、カリブ海は英国海軍の庭となり、パナマ運河は債務のカタに取り上げられようとしている。国民は大洋を超えた戦争など想像もできず、国際情勢への無関心は危機的なレベルに達している。"

 # =========================================================================
 # 動的補正 (Dynamic Modifiers)
 # =========================================================================
 USA_hollowed_industry:0 "産業の空洞化"
 USA_hollowed_industry_desc:0 "「かつてこの国は世界の工場だった。だが今、その工場の煙突から煙は上がらない。」\\n\\n外国資本による買収、競争力の喪失、そして熟練労働者の流出により、アメリカの産業基盤は致命的なダメージを受けた。デトロイトの自動車工場、ピッツバーグの製鉄所——これらはもはや過去の遺物か、外国企業の倉庫と化している。物を作る力を失った国家は、戦争においても平和においても、真の独立を保つことはできない。"
 
 USA_corpse_of_democracy:0 "民主主義の死体"
 USA_corpse_of_democracy_desc:0 "「投票によって何が変わる？」——この問いに、もはや誰も答えられない。\\n\\n議会は特殊利益団体と外国ロビイストに支配され、大統領は何もできず、最高裁は憲法を都合よく解釈する。民主主義の形式は残っているが、その魂はとうの昔に死んでいる。国民は政治への希望を捨て、一部は暴力的な解決策に惹かれ始めている。"

 # =========================================================================
 # 派閥影響力 (Faction Influence)
 # =========================================================================
 USA_long_influence:0 "ヒューイ・ロングの影響力"
 USA_long_influence_desc:0 "「富の共有」を掲げるルイジアナの上院議員ヒューイ・ロングは、絶望の淵にある民衆にとっての希望の星である。彼のラジオ演説は何百万もの貧困層を熱狂させ、その過激な再分配政策は既存の秩序を根底から覆そうとしている。銀行家と大企業にとっては悪夢のような男だが、彼の支持者たちは「キングフィッシュ」こそがアメリカを救うと信じて疑わない。\\n\\n§Y現在の影響度:§!"
 
 USA_macarthur_influence:0 "ダグラス・マッカーサーの影響力"
 USA_macarthur_influence_desc:0 "ダグラス・マッカーサー将軍は、アメリカ軍における生ける伝説である。彼の経歴は輝かしく、カリスマ性は非凡である。だが、彼の政治観は民主主義の枠内に収まるものではない。マッカーサーは、混乱する社会には「秩序」が必要だと考えており、必要とあらば軍がその秩序を提供すべきだと信じている。軍部と保守派の一部は、彼こそがアメリカを救えるただ一人の男だと囁き始めている。\\n\\n§Y現在の影響度:§!"

 # =========================================================================
 # 緩和版アイデア
 # =========================================================================
 USA_londons_servant_alleviated:0 "ロンドンの下僕 (緩和)"
 USA_londons_servant_alleviated_desc:0 "関税政策と国内産業の保護により、英国への依存度は低下しつつある。しかし、依然として巨額の借金があり、ロンドンのシティは我々の首に手をかけたままである。完全な自立には、まだ長い道のりが必要だ。"
 USA_strike_breakers_alleviated:0 "ストライキ・ブレイカー (緩和)"
 USA_strike_breakers_alleviated_desc:0 "労使関係の安定化と経済状況のわずかな改善により、軍が国内の治安維持に駆り出される機会は減少した。兵士たちは本来の訓練に集中できるようになり、軍の士気と練度は回復の兆しを見せている。"

 # =========================================================================
 # イベント
 # =========================================================================
 usa.1.t:0 "最後の幻想、最初の亀裂"
 usa.1.d:0 "1936年1月。ハーバート・フーバー大統領は一般教書演説のために議会に立った。しかし、彼の声は空虚な議場に吸い込まれるだけだった。\\n\\n議員たちは居眠りをし、傍聴席は空席が目立つ。誰もが、この国のシステムがもはや機能していないことを悟っていた。演説が終わると、静まり返った議場の片隅から、誰かが呟く声が聞こえた。\\n\\n「もう終わりだ…」\\n\\n国民の間では、二人の男の名が囁かれ始めている。ルイジアナの扇動者と、軍服の将軍——彼らは全く異なる解決策を提示しているが、一つだけ共通点がある。現状を変える、という約束だ。"
 usa.1.a:0 "§R富を奪い返せ！§! ロングの言葉に耳を傾ける。"
 usa.1.b:0 "§B秩序こそが国を救う。§! マッカーサーの主張に理がある。"

 usa.2.t:0 "ピッツバーグの落日"
 usa.2.d:0 "1936年2月。かつて「鉄の都」と呼ばれたピッツバーグは、今や錆びた廃墟と化しつつあった。\\n\\nベスレヘム・スチールの巨大な溶鉱炉は冷え切り、煙突から煙が立ち上ることはもうない。日本の財閥グループがこの工場を買収し、設備をスクラップにして本国に輸送しようとしていた。\\n\\n労働者たちは工場の入口に集まり、「俺たちの仕事を奪うな！」と叫んでいる。警備員と警官隊が睨み合う中、緊張は極限に達しようとしていた。"
 usa.2.a:0 "§R外国資本を没収せよ！§! 工場は労働者のものだ！"
 usa.2.b:0 "§B暴動を鎮圧せよ。§! 治安維持が最優先だ。"

 usa.3.t:0 "豊かなる大地の飢えた子供たち"
 usa.3.d:0 "1936年3月。アメリカ中西部の穀倉地帯は、異常な光景が広がっていた。\\n\\n農家の納屋には売れ残った穀物が積み上げられ、腐り始めている。その一方で、都市部では配給の列に並ぶ人々が飢えに苦しんでいる。この矛盾の原因は、アルゼンチンやブラジルから大量に輸入される安価な食料にあった。\\n\\n国内農家は価格競争に敗れ、多くが土地を手放した。荒れ果てた農地は、やがてダストボウルの温床となるだろう。"
 usa.3.a:0 "§R高関税だ！§! 外国産の食料を締め出せ！"
 usa.3.b:0 "§B失業手当を増額§!して、農民を支援すべきだ。"

 usa.4.t:0 "桜の下の分断"
 usa.4.d:0 "1936年4月。例年なら観光客で賑わうワシントンの桜祭りは、今年は中止となった。\\n\\nポトマック川沿いの桜並木の下で、二つの集団が睨み合っている。一方はロング支持者の労働者たち、もう一方は退役軍人を中心とした保守派グループ。彼らは当初、別々のデモ行進を行う予定だったが、偶然にも同じ場所で鉢合わせしてしまった。\\n\\n罵声が飛び交い、拳が振り上げられ、一触即発の空気が流れる。この分断は、もはや癒やしがたいものになりつつあった。"
 usa.4.a:0 "§R労働者の集会§!に参加する。"
 usa.4.b:0 "§B退役軍人たち§!と握手を交わす。"

 usa.5.t:0 "沈黙する工場、囁く革命"
 usa.5.d:0 "1936年5月。ラストベルト全域で、かつてない規模のストライキが発生した。\\n\\n自動車工場、製鉄所、繊維工場——どこでも労働者たちが生産ラインを停止させ、工場を占拠している。彼らの要求は単純明快、「賃金を上げろ、さもなくば工場は動かない」。\\n\\n一部の報告によれば、欧州連合から来た扇動者——赤い旗を掲げる者たち——がストライキを煽っているという。真偽は定かではないが、革命の囁きは確実に広がりつつある。"
 usa.5.a:0 "§R労働者の怒り§!を正しい方向に導け。"
 usa.5.b:0 "§B工場を奪還§!し、秩序を取り戻せ。"

 usa.6.t:0 "屈辱の外交公電"
 usa.6.d:0 "1936年6月。大統領のデスクに、英国政府からの外交公電が届けられた。\\n\\nその内容は、アメリカ国民にとって屈辱以外の何物でもなかった。英国政府は、巨額の戦債の返済の「担保」として、パナマ運河の管理権とアラスカの利権を要求していた。\\n\\n「さもなくば、我々は経済的措置と、必要であれば海軍行動を検討せざるを得ない。」——公電の最後の一文は、明らかな脅迫だった。\\n\\nフーバー大統領は頭を抱えた。この要求を受け入れれば、政権の命運は尽きる。しかし拒否すれば、国際的な孤立と経済破綻が待っている。"
 usa.6.a:0 "§R要求を無視せよ！§! 奴らに戦争を始める度胸はない。"
 usa.6.b:0 "§B艦船を売却§!してでも、借金を返済する。"

 usa.7.t:0 "泥にまみれた星条旗"
 usa.7.d:0 "1936年7月4日。独立記念日——本来なら、国を挙げて祝うべき日。\\n\\nだが、今年の祝祭は地獄絵図と化した。ニューヨークのパレードに暴徒が乱入し、警官隊に火炎瓶を投げつけた。警官たちは逃亡し、暴徒は星条旗を泥の中に投げ捨てて踏みにじった。\\n\\n大統領に緊急報告が届く。「治安部隊だけでは制圧不能です。軍の出動を要請すべきでしょうか？」"
 usa.7.a:0 "§R民間の自警団§!に街の防衛を任せる。"
 usa.7.b:0 "§B戒厳令§!を布告し、軍を派遣する。"

 usa.8.t:0 "黒い夏とダストボウル"
 usa.8.d:0 "1936年8月。記録的な熱波と干ばつが中西部を襲った。\\n\\n数年前から続くダストボウル（砂塵嵐）により農地は荒廃し、もはや作物は育たない。何千もの家族が土地を捨て、「約束の地」カリフォルニアを目指して西へと向かった。\\n\\nしかし、カリフォルニア州境では、彼らを「オーキー（オクラホマ出身者への蔑称）」と呼ぶ自警団が待ち構えていた。「余所者は出て行け！」——難民たちは行き場を失い、州境の荒地にバラック小屋を建てて暮らし始めた。"
 usa.8.a:0 "§R難民を保護§!し、州境を強行突破させる。"
 usa.8.b:0 "§B難民を徴兵§!し、軍の一員として受け入れる。"

 usa.9.t:0 "吠える男、沈黙する将軍"
 usa.9.d:0 "1936年9月。大統領選が迫る中、二人の男が対照的な行動を取っていた。\\n\\n一人はヒューイ・ロング。彼は毎夜のようにラジオに出演し、「富の共有」を叫び、銀行家と大企業を糾弾する。彼の言葉は民衆の怒りと希望を代弁し、支持率は日に日に高まっている。\\n\\nもう一人はダグラス・マッカーサー。彼は公の場ではほとんど発言しないが、水面下で軍と財界との関係を強化している。彼の沈黙は、嵐の前の静けさのようだ。\\n\\nフーバー大統領は苦渋の決断を迫られる。どちらの勢力に歩み寄るべきか？"
 usa.9.a:0 "§Rロング陣営§!に政治資金を提供する。"
 usa.9.b:0 "§Bマッカーサー§!と直通のホットラインを開設する。"

 usa.10.t:0 "投票用紙よりも弾丸を"
 usa.10.d:0 "1936年10月。フィラデルフィアで行われた大統領候補者討論会は、惨劇で幕を閉じた。\\n\\n討論会の最中、会場に銃声が響き渡った。パニックに陥った聴衆が逃げ惑う中、さらなる銃声が続く。犯人はロング派の過激派か、反ロングの自警団か——真相は闘士も定かではなかったが、結果として数十人の死傷者が出た。\\n\\n「もはや投票用紙では何も変わらない。」——この言葉が、全国で囁かれ始めている。"
 usa.10.a:0 "§Rやられたらやり返せ！§! 敵対勢力に報復を。"
 usa.10.b:0 "§B全ての武装勢力§!を徹底的に鎮圧する。"

 usa.11.t:0 "審判の日"
 usa.11.d:0 "1936年11月。大統領選挙の日が来た。しかし、その日は民主主義の勝利ではなく、終焉を告げる日となった。\\n\\n各地の投票所で暴力事件が相次ぎ、開票作業は中断された。多くの州で結果が確定できず、憲法に定められた大統領選出のプロセスは完全に機能不全に陥った。\\n\\nホワイトハウスの執務室で、フーバー大統領は最後の決断を迫られている。窓の外では、ロング支持者と軍部支持者がそれぞれ集会を開いている。\\n\\n彼は疲れ切った目で二通の書類を見比べた。一方はロングへの政権移譲を認める文書、もう一方はマッカーサー将軍に非常事態宣言の権限を委任する文書。\\n\\n「神よ、アメリカを救いたまえ…」\\n\\n彼はペンを取り上げた。"
 usa.11.a:0 "§R民衆の声を聞け！§! ロングに政権を託す。"
 usa.11.b:0 "§B秩序が必要だ。§! マッカーサーに権限を委任する。"

 # =========================================================================
 # 変数 (GUI表示用)
 # =========================================================================
 usa_long_support:0 "ロング派支持率"
 usa_macarthur_support:0 "マッカーサー派支持率"

 # =========================================================================
 # 国家方針 - 政治
 # =========================================================================
 USA_crisis_time:0 "危機の時"
 USA_crisis_time_desc:0 "1936年、アメリカ合衆国は建国以来最大の試練の時を迎えている。経済は崩壊し、政治は機能不全に陥り、国民は希望を失いつつある。今こそ、この危機に正面から向き合い、行動を起こす時だ。しかし、どのような行動を取るかによって、この国の未来は大きく変わることになる。"
 USA_share_wealth_rhetoric:0 "富の再分配論"
 USA_share_wealth_rhetoric_desc:0 "「富を分かち合え！」——ヒューイ・ロングのスローガンは、持たざる者たちの心を掴んだ。彼が提唱する「シェア・アワ・ウェルス」計画は、大富豪の資産を没収し、全国民に最低限の収入を保障するというものだ。既存の秩序を守りたい者たちにとっては悪夢だが、飢えた民衆にとっては希望の光である。"
 USA_call_for_order:0 "秩序の呼びかけ"
 USA_call_for_order_desc:0 "「このままでは国が滅ぶ！」——マッカーサー将軍を中心とした保守派は、社会不安の拡大に深い危機感を抱いている。彼らは、過激な扇動者たちを抑え込み、法と秩序を回復することこそが、国を救う唯一の道だと主張する。そのためには、多少の「強硬手段」も辞さない覚悟だ。"
 USA_protest_wall_st:0 "ウォール街への抗議"
 USA_protest_wall_st_desc:0 "失業者と労働者の大群がウォール街を占拠した。彼らは「銀行家は泥棒だ！」と叫び、金融機関の建物に石を投げつけている。この抗議行動を支持するか弾圧するかで、政権の方向性は大きく変わるだろう。"
 USA_protect_industry_pol:0 "産業界の保護"
 USA_protect_industry_pol_desc:0 "財界のリーダーたちは、政府と軍に助けを求めている。彼らは、「過激な労働者たち」から工場を守り、生産活動を正常化することを望んでいる。彼らへの支援は、経済の安定に繋がるが、労働者の怒りをさらに煽ることにもなりかねない。"
 USA_organize_minutemen:0 "民兵の組織化"
 USA_organize_minutemen_desc:0 "ロング派の支持者たちは、既存の治安機関を信用していない。彼らは独自の武装組織——「現代のミニットマン」——を編成し始めた。これは、いざという時に自分たちの手でロングを守るためだという。"
 USA_federalize_national_guard:0 "州兵の連邦化"
 USA_federalize_national_guard_desc:0 "マッカーサー将軍は、各州の州兵を連邦政府の直接指揮下に置くことを提案している。これにより、国内の治安維持能力は大幅に強化されるが、州の自治権を侵害するとして反対の声も強い。"
 USA_election_day_1936:0 "審判の日"
 USA_election_day_1936_desc:0 "1936年の大統領選挙は、単なる政権交代ではない。それは、アメリカという国の根本的なあり方を問う歴史的な審判の日となるだろう。どちらの勢力が勝利しても、この国は二度と元には戻らない。"

 # =========================================================================
 # 国家方針 - 経済 (フーバー)
 # =========================================================================
 USA_stimulate_private_sector:0 "民間活力の導入"
 USA_stimulate_private_sector_desc:0 "フーバー大統領は、政府による直接的な経済介入に慎重な姿勢を崩さない。彼は、アメリカ経済の回復は政府ではなく、民間企業の活力によってもたらされるべきだと信じている。規制緩和と減税によって民間投資を促進することこそが、正しい道なのだ。"
  # =========================================================================
  # 国家方針 (National Focus)
  # =========================================================================
  USA_hollow_state:0 "空洞化した国家"
  USA_hollow_state_desc:0 "合衆国は今、死に体である。政府は機能せず、経済は外国の支配下にあり、国民は希望を捨てている。この現状を直視し、どこから手を付けるべきか決断しなければならない。"
  USA_hollow_state_tt:0 "§Y現在の惨状が明らかになる。§!"

  USA_gold_standard:0 "金本位制の死守"
  USA_gold_standard_desc:0 "ドルの価値を守ることは、国家の尊厳を守ることと同義である。たとえどれほど苦しくとも、我々は金を放してはならない。それが国際的な信用を維持する唯一の道だ。"

  USA_rfc_loans:0 "RFC緊急融資"
  USA_rfc_loans_desc:0 "金融再建公社(RFC)を通じて、倒産寸前の企業や銀行に資金を注入する。これは輸血に過ぎないが、死ぬよりはマシだ。"

  USA_bank_stabilization:0 "銀行安定化"
  USA_bank_stabilization_desc:0 "パニックを抑え、健全な銀行業務を回復させるための緊急措置を講じる。"

  USA_tariff_war:0 "貿易関税の強化"
  USA_tariff_war_desc:0 "安価な外国産食料や工業製品から国内生産者を守るため、関税の壁を高く築く。世界は我々を非難するだろうが、まずは自国民を救わねばならない。"
  USA_tariff_war_tt:0 "§Yアルゼンチンなどの農業大国との関係が悪化する。§!"

  USA_debt_audit:0 "対外債務の査定"
  USA_debt_audit_desc:0 "我々が負っている負債の全容を調査する。ロンドンの銀行家たちが、どれだけ我々の血を吸っているかを白日の下に晒すのだ。"

  USA_economic_paralysis:0 "経済的麻痺"
  USA_economic_paralysis_desc:0 "一時的な措置は限界に達した。経済は完全に麻痺し、もはや抜本的な外科手術なしには回復できない。"

  USA_address_strikes:0 "全米ストライキ対応"
  USA_address_strikes_desc:0 "労働者たちの不満は頂点に達している。これ以上の混乱は国家の崩壊を招く。対話か、さもなくば力による解決が必要だ。"

  USA_veterans_bonus:0 "退役軍人年金案"
  USA_veterans_bonus_desc:0 "「ボーナス・アーミー」と呼ばれた退役軍人たちの不満を解消するため、年金の一括払いを提案する。彼らを味方に引き入れることは、治安維持の鍵となる。"

  USA_dust_bowl_relief:0 "砂塵嵐救済"
  USA_dust_bowl_relief_desc:0 "中西部を襲う「ダストボウル」の被害者に食料と避難所を提供する。"

  USA_civil_unrest_pol:0 "治安維持活動"
  USA_civil_unrest_pol_desc:0 "街頭での暴動を鎮圧するため、警察と州兵の連携を強化する。"

  USA_militia_regulation:0 "民兵組織の規制案"
  USA_militia_regulation_desc:0 "民間人が武装し、勝手に法を執行することを制限する。しかし、これは火に油を注ぐ結果になるかもしれない。"

  USA_social_collapse:0 "社会的崩壊"
  USA_social_collapse_desc:0 "社会の絆は断たれた。隣人が隣人を疑い、法律は無視されている。旧き秩序は、今や完全に崩壊した。"

  USA_congressional_deadlock:0 "議会の死滅"
  USA_congressional_deadlock_desc:0 "議会は空転し、法案一つ通すことができない。党派争いとロビイストの暗躍により、アメリカの民主主義は窒息死しようとしている。"
  USA_deadlock_tt:0 "§R政治力の獲得が大幅に減少する。§!"

  USA_administrative_failure:0 "行政の末期症状"
  USA_administrative_failure_desc:0 "政府の命令は地方に届かず、公務員は給与の遅配に苦しんでいる。ワシントンはもはや、巨大な、そして無能な瓦礫の山だ。"

  USA_election_cycle:0 "1936年選挙サイクル"
  USA_election_cycle_desc:0 "混乱と暴力に満ちた選挙戦が始まる。これは単なる大統領選ではない。アメリカがどのような国として生き残るか、あるいは消え去るかを決める戦いだ。"

  USA_election_day_mega:0 "審判の日"
  USA_election_day_mega_desc:0 "ついにその日が来た。投票箱に投げ込まれるのは、未来への希望か、絶望の叫びか。神よ、合衆国を救い給え。"
  USA_election_day_tt:0 "§Y選挙結果により、ルートが決定する。§!"

  # --- Long Route ---
  USA_long_victory:0 "ロング政権の誕生"
  USA_long_victory_desc:0 "「キングフィッシュ」が勝った。民衆は現状へのNOを突きつけ、ヒューイ・ロングにこの国の舵取りを託した。ワシントンは震え上がり、ルイジアナは歓喜に包まれている。新しい時代、略奪と再分配の時代が始まる。"

  USA_kingfish_revolution:0 "キングフィッシュ革命"
  USA_kingfish_revolution_desc:0 "これは単なる政権交代ではない。旧態依然とした権力構造を根底から破壊する「革命」である。ロングの言葉は法であり、彼の意志は人々の願いである。"

  USA_suspend_habeas:0 "人身保護令の停止"
  USA_suspend_habeas_desc:0 "「敵」から民衆を守るため、一時的に個人の自由を制限しなければならない。反逆者たちに法の保護を受ける資格はない。"

  USA_loyalty_oaths:0 "国家への忠誠誓約"
  USA_loyalty_oaths_desc:0 "公務員、教師、軍人——国家を支える者たちは、ロング大統領とその方針に忠実であることを誓わねばならない。"

  USA_share_clubs:0 "富の共有クラブ"
  USA_share_clubs_desc:0 "「富の共有」を草の根レベルで浸透させる。全米に設立されたクラブは、政府の宣伝機関であり、同時に支持者の強固なネットワークとなる。"

  USA_bureau_redist:0 "再分配省の創設"
  USA_bureau_redist_desc:0 "富を奪い、そして与えるための巨大な行政組織を立ち上げる。彼らは銀行家たちが隠した財産を見逃さない。"

  # ... (typo fix) ...
  
  USA_military_long:0 "持たざる者の国防"
  USA_military_long_desc:0 "我々の敵は強大だが、我々には数がある。民衆一人ひとりが銃を取り、この国を守る意志を持つならば、いかなる侵略者も恐れるに足らない。"

  USA_man_soldier:0 "皆兵主義"
  USA_man_soldier_desc:0 "「全ての男を兵士に、そして全ての男に分け前を」。ロング大統領は、国防を国民の義務であると同時に、社会進出の権利であると定義した。"

  USA_commissars:0 "政治将校の導入"
  USA_commissars_desc:0 "軍隊は民主主義の道具であってはならない。それはロング大統領と民衆の意志を体現する組織であるべきだ。将校たちの忠誠を監視し、士気を高めるための委員を配置する。"

  USA_attrition_doc:0 "消耗戦ドクトリン"
  USA_attrition_doc_desc:0 "洗練された戦術など不要だ。我々の豊富な人口を活かし、敵が根を上げるまで戦い続ける。物量と不屈の意志こそがアメリカの正義だ。"

  USA_mosquito_fleet:0 "蚊型艦隊"
  USA_mosquito_fleet_desc:0 "巨大な戦艦を造る余裕はないが、安価な潜水艇や魚雷艇を数多く用意することはできる。敵の大艦隊を、無数の「蚊」が刺し殺すのだ。"

  USA_arsenal_poor:0 "貧者の兵器廠"
  USA_arsenal_poor_desc:0 "全米の町工場を軍需生産に動員する。高度な兵器ではなく、誰もが扱える単純で強力な武器を、文字通り無限に供給するのだ。"

  USA_revenge_start:0 "復讐の十字軍"
  USA_revenge_start_desc:0 "準備は整った。我々から全てを奪い、笑っていた者たちに、その代償を支払わせる時が来た。今日から、世界はアメリカの怒りを知ることになる。"

  USA_panama_seize:0 "運河の武力接収"
  USA_panama_seize_desc:0 "パナマ運河はアメリカの生命線だ。それを「国際管理」などという名目で他国に弄ばれるのはもう終わりだ。海兵隊を送り込み、物理的に我々のものにする。"

  USA_alaska_ulti:0 "アラスカ最後通牒"
  USA_alaska_ulti_desc:0 "アラスカの利権を盾に、他国（主にカナダや英国）を脅迫する。"
  USA_alaska_ulti_tt:0 "§Yアラスカ周辺の領土問題を解決する外交イベントが発生します。§!"

  USA_maple_operation:0 "メープル作戦"
  USA_maple_operation_desc:0 "カナダ。我々の北の隣人は、あまりにも長くロンドンの傀儡として振る舞ってきた。彼らを「解放」し、北米大陸から帝国の残滓を一掃する。"

  USA_london_fall:0 "ロンドンの落日"
  USA_london_fall_desc:0 "かつて我々に債務を押し付け、屈辱を与えたシティの銀行家たち。彼らの帝国の中心地に、星条旗を掲げる。これは何世代にもわたる恨みの清算である。"

  USA_pacific_typhoon_mega:0 "太平洋の台風"
  USA_pacific_typhoon_mega_desc:0 "日本。彼らは我々が苦しんでいる間に、アジアと太平洋の富を独り占めしようとした。今、その代償を払わせる。台風は今、日本本土へと進路を取った。"

  USA_tokyo_burn:0 "東京炎上"
  USA_tokyo_burn_desc:0 "略奪された富、奪われた市場。それらを灰の中から取り戻す。沈まぬ太陽など存在しない。"

  USA_argentine_wheat:0 "亜穀物壟断の破壊"
  USA_argentine_wheat_desc:0 "アルゼンチンの農業資本は、我々の農民を飢えさせた。彼らの競争力を物理的に破壊し、アメリカの農業覇権を取り戻す。"

  USA_emperor_of_world:0 "世界の民衆皇帝"
  USA_emperor_of_world_desc:0 "全ての敵は平らげられた。ヒューイ・ロングはもはや一国の大統領ではない。彼は略奪された者たちの守護者であり、全世界を支配する民衆の皇帝である。万歳、キングフィッシュ！"

  USA_wealth_cap_1m:0 "100万ドル上限法"
  USA_wealth_cap_1m_desc:0 "いかなるアメリカ人も、100万ドルを超える個人資産を持つことは許されない。超過分は直ちに没収され、貧困層に分配される。これが正義だ。"
  USA_wealth_cap_tt:0 "§W100万ドルを超える資産は全て国庫に収められます。§!"

  USA_estate_tax_100:0 "遺産税100%"
  USA_estate_tax_100_desc:0 "死は究極の富の共有をもたらす。何百万ドルもの遺産が少数の相続人に引き継がれる時代は終わった。死者の富は、生ける国民全体のものとなる。"

  USA_pres_for_life:0 "終身大統領"
  USA_pres_for_life_desc:0 "この改革を完遂するには、4年や8年という短期間では足りない。国民が望む限り、ロングが舵を握り続けるべきだ。民主主義の形式よりも、民衆の利益を優先せよ。"
  USA_pres_for_life_tt:0 "§Y任期制限が撤廃され、独裁体制が整う。§!"

  USA_plunder_path:0 "略奪の開始"
  USA_plunder_path_desc:0 "我々の貧困の原因は、海を越えた強欲な帝国主義者たちにある。盗まれたものを取り戻す時が来た。"

  USA_default_debts:0 "戦債の支払い拒否"
  USA_default_debts_desc:0 "ロンドンの銀行家に支払うための汗水垂らした税金は、一銭も残っていない。我々の借金は、あの忌まわしい大戦の泥沼ですでに完済されている。"

  USA_expro_oil:0 "英国油田の没収"
  USA_expro_oil_desc:0 "テキサスやルイジアナにある英国系石油資本の設備を強制的に接収する。我々の燃料は、我々のものだ。"

  USA_seize_factories:0 "日本工場の接収"
  USA_seize_factories_desc:0 "デトロイトやシカゴで跋扈する日本財閥の工場を直ちに国営化し、あるいは労働者に払い下げる。財閥のロゴは、今夜中に塗り潰されるだろう。"

  # --- MacArthur Route ---
  USA_macarthur_victory:0 "マッカーサーの勝利"
  USA_macarthur_victory_desc:0 "ダグラス・マッカーサー将軍が合衆国大統領に就任した。混乱を極めるワシントンに対し、彼は「秩序」と「権威」を約束した。星条旗は今や、揺るぎない規律の下で再構築される時を迎えた。"

  USA_caesar_american:0 "アメリカのカエサル"
  USA_caesar_american_desc:0 "共和制の形式は残されるが、実質的な権力はマッカーサー一人の下へ集約される。非常事態には非常の手段が必要だ。彼は民衆のために剣を握ったのだ。"

  USA_martial_law_mega:0 "治安維持法の強化"
  USA_martial_law_mega_desc:0 "街頭の混乱。それを鎮めるのは議論ではなく、軍の規律である。全米に戒厳令を敷き、安全な社会を取り戻す。"

  USA_meritocracy:0 "実力主義の導入"
  USA_meritocracy_desc:0 "政治的コネやロビー活動は排除される。能力のある者が、然るべき地位に就く。それがマッカーサーの信条だ。"

  USA_technocracy:0 "経済技術者会議"
  USA_technocracy_desc:0 "経済はイデオロギーではなく、技術の問題である。熟練したエンジニアや経営者に経済運営を任せる。"

  USA_industrial_council:0 "産業協力評議会"
  USA_industrial_council_desc:0 "大企業と政府が一体となり、国家の産業基盤を再構築する。私益よりも国益が優先される。"

  USA_anti_commie_mega:0 "共産主義への徹底抗戦"
  USA_anti_commie_mega_desc:0 "この国を蝕む赤の脅威を、根こそぎ駆逐する。自由の敵に自由を与える必要はない。"

  USA_stratocracy:0 "全軍事国家体制"
  USA_stratocracy_desc:0 "国家全体が、一つの巨大な軍隊として機能する体制を整える。軍民一体。これこそが最強の国家形態だ。"

  USA_eternal_regent:0 "永遠の摂政"
  USA_eternal_regent_desc:0 "アメリカが再び真の偉大さを取り戻すまで、マッカーサー将軍が国家の守護者（摂政）として留まり続ける。彼にはその資格がある。"
  USA_eternal_regent_tt:0 "§Yマッカーサーが終身で国家を指導します。§!"

  USA_reconstruction_path:0 "国家再建計画"
  USA_reconstruction_path_desc:0 "破壊された経済、失われた信用。それら全てを、マッカーサーの強力なリーダーシップの下で再建する。瓦礫の中から、より強く、より機能的な国家を築き上げるのだ。"

  USA_stabilize_dollar:0 "ドルの安定化"
  USA_stabilize_dollar_desc:0 "インフレを抑制し、通貨への信頼を取り戻す。安定したドルこそが、経済再建の第一歩だ。"

  USA_military_ind_complex:0 "軍産複合体の形成"
  USA_military_ind_complex_desc:0 "軍需生産を経済の牽引役とする。兵器を造ることは、雇用を生み、技術を磨くことでもある。"

  USA_standardize_parts:0 "部品の規格化"
  USA_standardize_parts_desc:0 "全米の産業において規格を統一し、生産効率を極限まで高める。フォードの精神を国家規模で実践するのだ。"

  USA_federal_highways:0 "連邦高速道路網"
  USA_federal_highways_desc:0 "全米を結ぶ広大な道路網を整備する。これは物流を改善するだけでなく、緊急時の迅速な軍の移動を可能にする。"

  USA_manhattan_pre:0 "将来技術の先行研究"
  USA_manhattan_pre_desc:0 "物理学。それは次代の戦争の鍵となるだろう。最先端の科学に惜しみない投資を行い、アメリカを科学の王国とする。"

  USA_fordism_mega:0 "究極の大量生産体制"
  USA_fordism_mega_desc:0 "ベルトコンベアは止まらない。アメリカの生産力こそが、世界を圧倒する最大の武器となる。"

  USA_hegemony_economy:0 "覇権経済の確立"
  USA_hegemony_economy_desc:0 "我々の経済は、もはや一国の枠に留まらない。それは世界を導き、支配するための強力なエンジンへと進化した。"
  
  USA_military_mac:0 "軍の現代化"
  USA_military_mac_desc:0 "旧きドクトリンを捨て、現代の戦争に適合した新たな軍隊を模索する。マッカーサーの提唱する、機動性と火力の融合こそが勝利の鍵だ。"

  USA_firepower_mega:0 "圧倒的火力主義"
  USA_firepower_mega_desc:0 "弾丸の雨。敵の陣地が消滅するまで、砲弾を撃ち続ける。兵士の命ではなく、鋼鉄の消費で勝利を掴むのだ。"

  USA_mobile_modern:0 "機動戦の完成"
  USA_mobile_modern_desc:0 "戦車と自動車化部隊による電撃的な進撃。敵が混乱から立ち直る前に、その背後を突く。"

  USA_air_superiority_mega:0 "空の支配者"
  USA_air_superiority_mega_desc:0 "高度な戦闘機と爆撃機。空からの支配こそが、地上戦の結果を決定づける。合衆国の翼は、どこまでも届く。"

  USA_blue_water_mega:0 "深海艦隊の再建"
  USA_blue_water_mega_desc:0 "二つの海を守るためには、圧倒的な海軍力が必要だ。最新鋭の空母と戦艦で、太平洋と大西洋をアメリカの湖とする。"

  USA_global_reach:0 "世界的展開能力"
  USA_global_reach_desc:0 "地球上のいかなる場所へも、24時間以内に軍を派遣できる体制を整える。アメリカの力は、もはや国境に縛られない。"

  USA_hegemony_start:0 "アメリカ覇権の宣言"
  USA_hegemony_start_desc:0 "合衆国は今や、西半球の、そして世界の指導者としての責任を引き受ける。我々は平和を守るために、強大な力を振るうことを躊躇わない。"

  USA_las_league:0 "米州諸国連盟 (LAS)"
  USA_las_league_desc:0 "アメリカ大陸の国々を、アメリカの指導下に糾合する。これは同盟であり、同時に共通の運命を歩むための組織である。"

  USA_mexico_treaty:0 "メキシコ条約"
  USA_mexico_treaty_desc:0 "南の隣人との長年の不和を解消し、彼らを安定した協力関係へと引き込む。メキシコはアメリカの強固な城壁となるだろう。"

  USA_brazil_deal:0 "ブラジル軍事協定"
  USA_brazil_deal_desc:0 "南米の大国ブラジルとの連携を強化する。彼らの資源と我々の技術が組み合わされば、向かうところ敵なしだ。"

  USA_coop_with_london:0 "ロンドンとの戦略的協調"
  USA_coop_with_london_desc:0 "かつての宿敵イギリス。だが今や、我々は共通の敵——共産主義——に直面している。文明を守るために、一時的な協力を行う。"

  USA_tokyo_entente:0 "東京協商"
  USA_tokyo_entente_desc:0 "太平洋の覇権を争った日本。彼らとも、アジアにおける秩序維持のために交渉の席に就く。力の均衡こそが、安定をもたらす。"

  USA_anti_comintern_pact:0 "反共十字軍"
  USA_anti_comintern_pact_desc:0 "共産主義という病を地球上から消し去るための、国家規模の戦いを開始する。"

  USA_global_policeman:0 "世界の警察官"
  USA_global_policeman_desc:0 "全米州諸国連盟の盟主として、そして文明の守護者として、アメリカは世界の秩序を守り続ける。マッカーサーの平和、それは力による平和である。万歳、大統領将軍！"

  USA_national_bank:0 "合衆国国立銀行"
  USA_national_bank_desc:0 "私設の連邦準備制度を廃止し、政府が直接通貨を発行する国立銀行を設立する。ウォール街の支配は終わった。"

  USA_long_dollars:0 "ロング・ドルの発行"
  USA_long_dollars_desc:0 "金の裏付けなど不要だ。裏付けはアメリカの労働と、ロング大統領の信用である。"

  USA_mississippi_project:0 "ミシシッピ川開発"
  USA_mississippi_project_desc:0 "南部の河川を大規模に開拓し、洪水被害を無くすと同時に巨大な電力を確保する。南部からアメリカを再建するのだ。"

  USA_plunder_economy_mega:0 "最終的略奪経済"
  USA_plunder_economy_mega_desc:0 "もはや隠す必要はない。我々の経済は、敵からの略奪と国民への分配という、最も純粋な形へと進化した。"
  
