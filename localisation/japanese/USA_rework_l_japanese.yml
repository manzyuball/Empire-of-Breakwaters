 # usa.5 - 選挙危機イベント
 usa.5.t:0 "選挙危機の深刻化"
 usa.5.desc:0 "1936年の大統領選挙が近づくにつれ、国家の分裂は深刻化している。ヒューイ・ロングとダグラス・マッカーサーの対立は、単なる政治闘争を超え、二つのアメリカ像をめぐる戦いとなっている。街頭では両派の支持者が衝突し、議会は機能停止に陥っている。この選挙は、アメリカの運命を決定する。"
 usa.5.a:0 "危機は深刻化している"
 USA_election_crisis_intensifies_tt:0 "§Y選挙危機§!が深刻化\n両派の対立が激化し、社会不安が増大している"

 # Long派支持イベント usa.100-109

 # usa.100 - 退役軍人行進
 usa.100.t:0 "退役軍人の行進"
 usa.100.desc:0 "戦後の経済不況により困窮した退役軍人たちが、約束されたボーナスの即時支払いを求めて首都に行進してきた。彼らは国のために戦った——今度は国が彼らのために尽くす番だと主張する。ロングは彼らと連帯を表明し、マッカーサーは秩序維持を優先すべきだと主張する。どう対応するか?"
 usa.100.a:0 "ロングが退役軍人を支援する"
 usa.100.b:0 "マッカーサーが秩序回復を主張する"

 # usa.101 - 富を共有しよう運動
 usa.101.t:0 "富の共有運動の広がり"
 usa.101.desc:0 "ヒューイ・ロングの「富の共有」運動が全国に広がっている。「すべての人が王様になれる」というスローガンの下、数百万人が彼の支持者となった。富裕層への課税と富の再分配——この過激な主張が、貧困にあえぐ民衆の心を掴んでいる。しかし、既存の経済秩序を破壊する危険性も指摘されている。"
 usa.101.a:0 "運動を全面的に支援する"
 usa.101.b:0 "穏健な支援に留める"
 usa.101.c:0 "距離を置く"

 # usa.102 - コフリン神父のラジオ放送
 usa.102.t:0 "コフリン神父のラジオ演説"
 usa.102.desc:0 "チャールズ・コフリン神父が、全国ネットのラジオ番組でロング支持を表明した。彼の影響力は絶大であり、数百万人のカトリック信徒が毎週彼の放送を聴いている。「富裕層の搾取から民衆を解放する」という彼のメッセージは、宗教的な使命感と政治的主張を結びつけている。"
 usa.102.a:0 "全国放送を支援する"
 usa.102.b:0 "地方放送に留める"

 # usa.103 - ポピュリスト集会
 usa.103.t:0 "ポピュリスト大集会"
 usa.103.desc:0 "ロング支持者による大規模な集会が開催され、数万人が集結した。「富の共有」「泥棒男爵を打倒せよ」——彼らの叫びが会場を揺るがす。この熱狂は民主主義の活力か、それとも危険な大衆扇動か。評価は分かれているが、ロングの政治力が増大していることは疑いない。"
 usa.103.a:0 "大規模集会を開催する"
 usa.103.b:0 "秩序ある集会に留める"

 # usa.104 - ロングマシーンの完成
 usa.104.t:0 "ロング政治マシーンの完成"
 usa.104.desc:0 "ルイジアナで確立されたロングの政治組織が、全国規模に拡大した。地方の政治家、労働組合、農民団体——あらゆる勢力が彼の下に結集している。この強力な政治マシーンは、選挙での勝利を確実にし、権力掌握への道を開く。しかし、その支配は民主主義の枠を超えつつある。"
 usa.104.a:0 "完全な支配体制を確立する"
 usa.104.b:0 "穏健な組織化に留める"

 # usa.105 - 労働組合への浸透 (イベントローカライズは既存のdescをそのまま使用)
 usa.105.t:0 "労働組合への浸透"
 usa.105.a:0 "労働組合を掌握する"
 usa.105.b:0 "穏健な協力関係を築く"
 USA_long_union_control_tt:0 "§Yロング派支持§!に以下の修正\n支持率: §G+8§!\n§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+2%§!"

 # usa.106 - 農民の支持獲得
 usa.106.t:0 "農民の支持獲得"
 usa.106.a:0 "農業改革を約束する"
 usa.106.b:0 "象徴的な支援のみ"
 USA_long_farmer_support_tt:0 "§Yロング派支持§!に以下の修正\n支持率: §G+12§!\n§Y合衆国の政治§!に以下の修正\n安定度: §G+3%§!"

 # usa.107 - シルバーシャツ団との連携
 usa.107.t:0 "シルバーシャツ団との連携"
 usa.107.a:0 "公然と連携する"
 usa.107.b:0 "秘密裏に連携する"
 usa.107.c:0 "距離を置く"
 USA_silver_legion_alliance_tt:0 "§Yロング派支持§!に以下の修正\n支持率: §G+15§!\n§Y合衆国の政治§!に以下の修正\nファシズム支持: §G+5%§!\n安定度: §R-5%§!"

 # usa.108 - 富の再分配演説
 usa.108.t:0 "富の再分配演説"
 usa.108.a:0 "過激な再分配を主張する"
 usa.108.b:0 "穏健な改革を主張する"

 # usa.109 - 反財閥キャンペーン
 usa.109.t:0 "反財閥キャンペーン"
 usa.109.a:0 "財閥を糾弾する"
 usa.109.b:0 "穏健なレトリックにする"
 USA_anti_foreign_rhetoric:0 "反外国レトリック"
 USA_anti_foreign_rhetoric_desc:0 "米国の過激な反外国キャンペーンにより、関係が緊張している"

 # マッカーサー派支持イベント usa.110-119

 # usa.110 - 軍改革への反響
 usa.110.t:0 "軍改革への反響"
 usa.110.desc:0 "マッカーサー将軍が提唱する軍の近代化計画が、軍部と保守派の間で大きな反響を呼んでいる。第一次世界大戦の教訓を活かし、機動力と火力を強化する——この計画は、アメリカを世界最強の軍事大国へと導くだろう。しかし、軍事力の増強は、国際緊張を高める危険性もある。"
 usa.110.a:0 "軍の近代化を推進する"
 usa.110.b:0 "慎重なアプローチを取る"

 # usa.111 - 将校団の結束
 usa.111.t:0 "将校団の結束"
 usa.111.desc:0 "マッカーサーの下、軍の将校団が結束を強めている。ウェストポイント出身のエリート将校たちが、彼の改革理念に共鳴し、忠誠を誓っている。しかし、この結束は軍の政治化を意味するのではないかという懸念も出ている。軍は政治から独立すべきか、それとも国家指導に参画すべきか?"
 usa.111.a:0 "完全な忠誠を要求する"
 usa.111.b:0 "専門性を重視する"

 # usa.112 - 秩序と規律の勝利
 usa.112.t:0 "秩序と規律"
 usa.112.desc:0 "マッカーサー将軍が「秩序と規律」をスローガンに掲げ、混乱した社会に安定をもたらすと約束した。軍隊の組織原理を社会全体に適用し、効率的で規律正しい国家を作る——この理念が、保守層と中産階級の支持を集めている。秩序か自由か、アメリカは選択を迫られている。"
 usa.112.a:0 "厳格な秩序を確立する"
 usa.112.b:0 "穏健な規律に留める"

 # usa.113 - マッカーサー連合の確立
 usa.113.t:0 "マッカーサー連合"
 usa.113.desc:0 "マッカーサーは軍部、保守派政治家、企業経営者を糾合し、強力な政治連合を形成した。彼らはロングの「急進的な富の再分配」に反対し、「秩序ある改革」を主張する。この連合が、マッカーサーを大統領の座へと押し上げるかもしれない。"
 usa.113.a:0 "広範な連合を形成する"
 usa.113.b:0 "軍中心の連合にする"

 # usa.114 - 産業界の支持獲得
 usa.114.t:0 "産業界の支持"
 usa.114.a:0 "産業界との同盟を結ぶ"
 usa.114.b:0 "緩やかな協力に留める"
 USA_mac_industry_alliance_tt:0 "§Yマッカーサー派支持§!に以下の修正\n支持率: §G+10§!\n§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+2%§!"

 # usa.115 - 退役軍人会の支持
 usa.115.t:0 "退役軍人会の支持"
 usa.115.a:0 "退役軍人を動員する"
 usa.115.b:0 "名誉ある支持を求める"
 USA_mac_veterans_support_tt:0 "§Yマッカーサー派支持§!に以下の修正\n支持率: §G+12§!\n§Y合衆国§!に以下の修正\n徴兵可能人口: §G+25,000§!"

 # usa.116 - ウエストポイント派閥の支持
 usa.116.t:0 "ウェストポイント派閥"
 usa.116.a:0 "エリート将校を糾合する"
 usa.116.b:0 "慎重な連携に留める"
 USA_mac_westpoint_support_tt:0 "§Yマッカーサー派支持§!に以下の修正\n支持率: §G+15§!\n§Y合衆国陸軍§!に以下の修正\n計画速度: §G+3%§!\n陸軍経験値: §G+25§!"

 # usa.117 - 治安回復の成功
 usa.117.t:0 "治安回復の成功"
 usa.117.a:0 "秩序を全面回復する"
 usa.117.b:0 "段階的な回復を図る"

 # usa.118 - 保守派の結集
 usa.118.t:0 "保守派の結集"
 usa.118.a:0 "保守連合を形成する"
 usa.118.b:0 "軍を優先する"

 # usa.119 - 反共演説
 usa.119.t:0 "反共演説"
 usa.119.a:0 "強硬な反共姿勢を取る"
 usa.119.b:0 "穏健な反共姿勢にする"

 # ========================================================================
 # イベント: Phase 2 - Longルート (usa.20-21, usa.200-299)
 # ========================================================================

 # usa.200 - 反対派粛清
 usa.200.t:0 "反対派の粛清"
 usa.200.desc:0 "キングフィッシュ政権は「人民の敵」とされた政治的反対派を組織的に逮捕している。旧体制の政治家、抵抗する資本家、批判的な知識人——彼らは次々と「再教育キャンプ」に送られている。これは必要な革命的正義か、それとも恐怖政治の始まりか?"
 usa.200.a:0 "徹底的に粛清する"
 usa.200.b:0 "穏健な粛清に留める"

 # usa.210 - 復讐の宣言
 usa.210.t:0 "復讐の宣言"
 usa.210.desc:0 "ヒューイ・ロングは全国民に向けたラジオ演説で、日英両帝国への「復讐」を宣言した。「彼らはアメリカを搾取し、我々の富を奪った。今こそ、その代償を支払わせる時だ！」——演説は全米で熱狂的に受け入れられ、戦争への気運が高まっている。民衆の怒りは沸点に達した。"
 usa.210.a:0 "日英への復讐を誓う！"
 USA_revenge_declaration:0 "米国の復讐宣言"
 USA_revenge_declaration_desc:0 "米国が我が国への復讐を公然と宣言した。関係は最悪の状態にある"

 # usa.220 - 国民統制経済
 usa.220.t:0 "国民統制経済の確立"
 usa.220.desc:0 "ロング政権は資本主義経済を廃止し、国家統制経済への移行を宣言した。すべての主要産業が国有化され、生産計画は中央政府が決定する。「人民のための経済」が実現されつつあるが、効率性と自由は大きく犠牲になっている。"
 usa.220.a:0 "統制経済を推進する"

 # usa.230 - 人民軍の創設
 usa.230.t:0 "人民の軍隊"
 usa.230.desc:0 "軍をキングフィッシュに忠実な「人民の軍隊」として再編成する命令が下された。政治将校が各部隊に配置され、兵士の思想教育と忠誠心の維持を担当する。伝統的な軍の階級制度は「ブルジョア的特権」として緩和され、平等が強調される。軍は国家防衛組織から、ロング体制の暴力装置へと変貌していく。"
 usa.230.a:0 "人民軍を創設する"

 # usa.240 - パナマ接収警告
 usa.240.t:0 "パナマへの最後通牒"
 usa.240.desc:0 "ロング政権はパナマ共和国に対し、パナマ運河の完全な統制権を譲渡するよう最後通牒を突きつけた。「歴史的にアメリカが建設したこの運河は、アメリカのものである」——パナマ政府は震撼している。これは交渉か、それとも侵略の口実か?"
 usa.240.a:0 "パナマへの圧力を強める"

 # usa.241 - パナマへの最後通牒 (パナマ視点)
 usa.241.t:0 "米国からの最後通牒"
 usa.241.desc:0 "アメリカ合衆国が我が国に対し、パナマ運河の完全な統制権を譲渡するよう要求してきた。拒否すれば軍事侵攻は避けられない。しかし、国家主権を放棄することは、独立国としての尊厳を失うことを意味する。我々はどうすべきか?"
 USA.241.a:0 "降伏する..."
 usa.241.b:0 "抵抗する！"

 # ========================================================================
 # イベント: Phase 3 - MacArthurルート (usa.30-31, usa.300-399)
 # ========================================================================

 # usa.300 - ロンドン協力への招待 (イギリス視点)
 usa.300.t:0 "米国からの協力要請"
 usa.300.desc:0 "マッカーサー大統領から、英米協力を強化する提案が届いた。ファシズムと共産主義という二つの脅威に対抗するため、民主主義国家が連帯すべきだという主張である。この提案を受け入れるべきか?"
 usa.300.a:0 "協力を受諾する"
 usa.300.b:0 "協力を拒否する"

 # usa.301 - イギリスが協力を受諾
 usa.301.t:0 "英国の協力受諾"
 usa.301.desc:0 "イギリスが我々の提案を受け入れた。英米の協力により、世界の民主主義勢力の連帯が強化される。共通の価値観と戦略的利益が、両国を結びつける。"
 usa.301.a:0 "英米同盟を強化する"

 # usa.302 - イギリスが協力を拒否
 usa.302.t:0 "英国の協力拒否"
 usa.302.desc:0 "イギリスが我々の提案を拒否した。彼らは独自の政策を優先するようだ。これは残念な結果だが、我々は独自の道を進むしかない。"
 usa.302.a:0 "独自の道を進む"

 # usa.310 - 東京協商への招待 (日本視点)
 usa.310.t:0 "米国からの協商提案"
 usa.310.desc:0 "マッカーサー大統領から、太平洋地域の安定のための協商提案が届いた。アメリカは我が国との協力を望んでおり、共産主義の拡大を共同で阻止することを提案している。この提案をどう扱うべきか?"
 usa.310.a:0 "協商を受諾する"
 usa.310.b:0 "協商を拒否する"

 # usa.311 - 日本が協商を受諾
 usa.311.t:0 "日本の協商受諾"
 usa.311.desc:0 "日本が我々の提案を受け入れた。太平洋地域における安定が確保され、共産主義の脅威に共同で対抗できる。これは戦略的に重要な成果である。"
 usa.311.a:0 "太平洋の安定を確保する"

 # usa.312 - 日本が協商を拒否
 usa.312.t:0 "日本の協商拒否"
 usa.312.desc:0 "日本が我々の提案を拒否した。彼らは独自の帝国主義的野心を優先するようだ。太平洋における対立は避けられないかもしれない。"
 usa.312.a:0 "警戒を強める"

 # usa.320 - 技術者層の結集
 usa.320.t:0 "テクノクラートの時代"
 usa.320.desc:0 "マッカーサー政権の下、技術者・科学者・経営学者が国家の中枢に登用されている。「感情ではなく理性、政治ではなく科学」——テクノクラートたちが、技術的優位性に基づく国力強化を推進する。効率と合理性が、新たな国家運営の原則となる。"
 usa.320.a:0 "科学的統治を推進する"
 USA_technocrat:0 "テクノクラート技術"

 # usa.330 - 軍近代化の進展
 usa.330.t:0 "軍の近代化"
 usa.330.desc:0 "マッカーサーの軍改革が成果を上げている。新しいドクトリン、近代的な装備、優秀な将校団——アメリカ軍は世界最強の軍隊として生まれ変わりつつある。規律と効率がその源泉である。"
 usa.330.a:0 "世界最強の軍を目指す"

 # usa.340 - 汎米同盟の提案
 usa.340.t:0 "汎アメリカ連盟"
 usa.340.desc:0 "マッカーサー大統領は、アメリカ大陸全体の統一を目指す「汎アメリカ連盟」構想を発表した。カナダ、メキシコ、中南米諸国——すべてのアメリカ大陸国家が、アメリカの指導の下で協力する。モンロー主義の現代的解釈である。"
 usa.340.a:0 "アメリカ大陸の統一を目指す"
 USA_pan_league_opinion:0 "汎米連盟"
 USA_pan_league_opinion_desc:0 "汎アメリカ連盟への参加により、米国との関係が強化されている"

 # ========================================================================
 # イベント: Phase 4 - 共通イベント (usa.400-440)
 # ========================================================================

 # usa.400 - 産業空洞化の克服
 usa.400.t:0 "産業復興の完成"
 usa.400.desc:0 "長年の努力の末、アメリカの産業は完全に復興した。日英の経済支配は打破され、国内産業は再び活力を取り戻した。失業率は劇的に低下し、工場はフル稼働している。空洞化した共和国は、再び世界の工場として蘇った。新たな時代が始まる。"
 usa.400.a:0 "産業の復活を祝う"
 USA_hollowed_overcome_tt:0 "§H空洞化の克服§!\n産業が完全に復興し、経済的独立を達成した"

 # usa.410 - マンハッタン計画開始
 usa.410.t:0 "マンハッタン計画"
 usa.410.desc:0 "極秘の核兵器開発計画が開始された。世界中から最高の科学者を結集し、ニューメキシコの砂漠で人類史上最強の兵器を開発する——これがマンハッタン計画である。この計画の成功は、戦争の終結方法を永遠に変えることになるだろう。"
 usa.410.a:0 "核開発を推進する"

 # usa.420 - ジェット機計画開始
 usa.420.t:0 "ジェット推進航空機"
 usa.420.desc:0 "ジェット推進航空機の開発計画が開始された。プロペラ機の限界を超え、音速に迫る超高速戦闘機——これが未来の空中戦を支配する。ドイツやイギリスとの技術競争に勝利し、制空権を確保するための決定的兵器である。"
 usa.420.a:0 "ジェット機開発を加速する"

 # usa.430 - ロケット計画開始
 usa.430.t:0 "ロケット計画"
 usa.430.desc:0 "長距離ロケット・ミサイルの開発が開始された。地球上のいかなる場所をも攻撃可能な兵器体系を構築する——これは単なる軍事技術ではなく、将来的には宇宙への扉を開く技術となる。科学の最前線で、アメリカがリードする。"
 usa.430.a:0 "ロケット開発を推進する"
 USA_rocket_tech:0 "ロケット技術"

 # usa.440 - 超兵器開発完了
 usa.440.t:0 "超兵器の時代"
 usa.440.desc:0 "核兵器、ジェット機、ロケット——すべての超兵器開発プログラムが成果を上げている。アメリカは科学技術において世界を圧倒的にリードし、戦争における絶対的優位を確保した。この力をどう使うかが、世界の運命を決定する。"
 usa.440.a:0 "超兵器による優位を確立する"
 USA_superweapons_complete_tt:0 "§H超兵器完成§!\n核・ジェット・ロケット技術において世界をリードする"

