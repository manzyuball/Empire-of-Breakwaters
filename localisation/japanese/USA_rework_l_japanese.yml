l_japanese:
 # =========================================================================
 # リーダー & 特性
 # =========================================================================
 USA_herbert_hoover:0 "ハーバート・フーバー"
 USA_hoover_trait:0 "尻拭いの苦労人"
 USA_hoover_trait_desc:0 "フーバーは、誰もが望まなかった地位を押し付けられた哀れな男である。前任者たちの無責任な経済政策と、外国からの搾取の結果として残された瓦礫の山を、彼は今、一人で片付けようとしている。彼の誠実な努力は民衆には理解されず、彼の名は歴史において「無能な大統領」として記憶されるだろう。それでも彼は今日も、燃え盛る船の舵を握り続ける。"

 # =========================================================================
 # 国民精神 (Ideas)
 # =========================================================================
 USA_londons_servant:0 "ロンドンの下僕"
 USA_londons_servant_desc:0 "我々の祖父たちは、独立のためにイギリスと戦った。だが孫である我々は、今やロンドンのシティの奴隷に成り下がっている。第一次大戦の参戦時に結ばれた屈辱的な融資契約は、我が国の経済を完全に大英帝国の支配下に置いた。国家予算の大部分は利子返済に消え、国内への投資は滞っている。英国の銀行家たちは、我々が少しでも逆らえば、経済制裁という鞭で叩く準備ができている。"
 
 USA_zaibatsu_backyard:0 "財閥の裏庭"
 USA_zaibatsu_backyard_desc:0 "「安価で高品質」という甘言とともに、日本の大財閥は太平洋を越えて我が国の市場を浸食した。今や、自動車から玩具に至るまで、アメリカ人が手にする商品の多くは財閥のロゴが刻印されている。国内製造業は価格競争に敗れ、工場は閉鎖され、技術者や熟練労働者は路頭に迷っている。彼らは我々の富を吸い上げるだけでなく、その富で我が国の土地や資産を買い漁っている。"
 
 USA_strike_breakers:0 "ストライキ・ブレイカー"
 USA_strike_breakers_desc:0 "軍の存在意義が問われている。我が合衆国軍は、外敵からの国防のためではなく、国内の「敵」——すなわち飢えた失業者、賃上げを求める労働者——を踏みつけるために存在している。兵士たちは自国民に銃口を向けることを強いられ、士気は地に落ちた。将校たちは訓練よりも暴動鎮圧の計画に忙殺され、軍としての練度は著しく低下している。"
 
 USA_ghost_of_monroe:0 "モンローの亡霊"
 USA_ghost_of_monroe_desc:0 "かつてのモンロー・ドクトリンは、アメリカ大陸を外部の干渉から守る盾であった。だが今や、その盾は錆び付き、我々自身を守ることすらできない。中南米諸国は外国勢力になびき、カリブ海は英国海軍の庭となり、パナマ運河は債務のカタに取り上げられようとしている。国民は大洋を超えた戦争など想像もできず、国際情勢への無関心は危機的なレベルに達している。"

 # =========================================================================
 # 動的補正 (Dynamic Modifiers)
 # =========================================================================
 USA_hollowed_industry:0 "産業の空洞化"
 USA_hollowed_industry_desc:0 "「かつてこの国は世界の工場だった。だが今、その工場の煙突から煙は上がらない。」\\n\\n外国資本による買収、競争力の喪失、そして熟練労働者の流出により、アメリカの産業基盤は致命的なダメージを受けた。デトロイトの自動車工場、ピッツバーグの製鉄所——これらはもはや過去の遺物か、外国企業の倉庫と化している。物を作る力を失った国家は、戦争においても平和においても、真の独立を保つことはできない。"
 
 USA_corpse_of_democracy:0 "民主主義の死体"
 USA_corpse_of_democracy_desc:0 "「投票によって何が変わる？」——この問いに、もはや誰も答えられない。\\n\\n議会は特殊利益団体と外国ロビイストに支配され、大統領は何もできず、最高裁は憲法を都合よく解釈する。民主主義の形式は残っているが、その魂はとうの昔に死んでいる。国民は政治への希望を捨て、一部は暴力的な解決策に惹かれ始めている。"

 # =========================================================================
 # 派閥影響力 (Faction Influence)
 # =========================================================================
 USA_long_influence:0 "ヒューイ・ロングの影響力"
 USA_long_influence_desc:0 "「富の共有」を掲げるルイジアナの上院議員ヒューイ・ロングは、絶望の淵にある民衆にとっての希望の星である。彼のラジオ演説は何百万もの貧困層を熱狂させ、その過激な再分配政策は既存の秩序を根底から覆そうとしている。銀行家と大企業にとっては悪夢のような男だが、彼の支持者たちは「キングフィッシュ」こそがアメリカを救うと信じて疑わない。\\n\\n§Y現在の影響度:§!"
 
 USA_macarthur_influence:0 "ダグラス・マッカーサーの影響力"
 USA_macarthur_influence_desc:0 "ダグラス・マッカーサー将軍は、アメリカ軍における生ける伝説である。彼の経歴は輝かしく、カリスマ性は非凡である。だが、彼の政治観は民主主義の枠内に収まるものではない。マッカーサーは、混乱する社会には「秩序」が必要だと考えており、必要とあらば軍がその秩序を提供すべきだと信じている。軍部と保守派の一部は、彼こそがアメリカを救えるただ一人の男だと囁き始めている。\\n\\n§Y現在の影響度:§!"

 # =========================================================================
 # 緩和版アイデア
 # =========================================================================
 USA_londons_servant_alleviated:0 "ロンドンの下僕 (緩和)"
 USA_londons_servant_alleviated_desc:0 "関税政策と国内産業の保護により、英国への依存度は低下しつつある。しかし、依然として巨額の借金があり、ロンドンのシティは我々の首に手をかけたままである。完全な自立には、まだ長い道のりが必要だ。"
 USA_strike_breakers_alleviated:0 "ストライキ・ブレイカー (緩和)"
 USA_strike_breakers_alleviated_desc:0 "労使関係の安定化と経済状況のわずかな改善により、軍が国内の治安維持に駆り出される機会は減少した。兵士たちは本来の訓練に集中できるようになり、軍の士気と練度は回復の兆しを見せている。"

 # =========================================================================
 # イベント
 # =========================================================================
 usa.1.t:0 "最後の幻想、最初の亀裂"
 usa.1.d:0 "1936年1月。ハーバート・フーバー大統領は一般教書演説のために議会に立った。しかし、彼の声は空虚な議場に吸い込まれるだけだった。\\n\\n議員たちは居眠りをし、傍聴席は空席が目立つ。誰もが、この国のシステムがもはや機能していないことを悟っていた。演説が終わると、静まり返った議場の片隅から、誰かが呟く声が聞こえた。\\n\\n「もう終わりだ…」\\n\\n国民の間では、二人の男の名が囁かれ始めている。ルイジアナの扇動者と、軍服の将軍——彼らは全く異なる解決策を提示しているが、一つだけ共通点がある。現状を変える、という約束だ。"
 usa.1.a:0 "§R富を奪い返せ！§! ロングの言葉に耳を傾ける。"
 usa.1.b:0 "§B秩序こそが国を救う。§! マッカーサーの主張に理がある。"

 usa.2.t:0 "ピッツバーグの落日"
 usa.2.d:0 "1936年2月。かつて「鉄の都」と呼ばれたピッツバーグは、今や錆びた廃墟と化しつつあった。\\n\\nベスレヘム・スチールの巨大な溶鉱炉は冷え切り、煙突から煙が立ち上ることはもうない。日本の財閥グループがこの工場を買収し、設備をスクラップにして本国に輸送しようとしていた。\\n\\n労働者たちは工場の入口に集まり、「俺たちの仕事を奪うな！」と叫んでいる。警備員と警官隊が睨み合う中、緊張は極限に達しようとしていた。"
 usa.2.a:0 "§R外国資本を没収せよ！§! 工場は労働者のものだ！"
 usa.2.b:0 "§B暴動を鎮圧せよ。§! 治安維持が最優先だ。"

 usa.3.t:0 "豊かなる大地の飢えた子供たち"
 usa.3.d:0 "1936年3月。アメリカ中西部の穀倉地帯は、異常な光景が広がっていた。\\n\\n農家の納屋には売れ残った穀物が積み上げられ、腐り始めている。その一方で、都市部では配給の列に並ぶ人々が飢えに苦しんでいる。この矛盾の原因は、アルゼンチンやブラジルから大量に輸入される安価な食料にあった。\\n\\n国内農家は価格競争に敗れ、多くが土地を手放した。荒れ果てた農地は、やがてダストボウルの温床となるだろう。"
 usa.3.a:0 "§R高関税だ！§! 外国産の食料を締め出せ！"
 usa.3.b:0 "§B失業手当を増額§!して、農民を支援すべきだ。"

 usa.4.t:0 "桜の下の分断"
 usa.4.d:0 "1936年4月。例年なら観光客で賑わうワシントンの桜祭りは、今年は中止となった。\\n\\nポトマック川沿いの桜並木の下で、二つの集団が睨み合っている。一方はロング支持者の労働者たち、もう一方は退役軍人を中心とした保守派グループ。彼らは当初、別々のデモ行進を行う予定だったが、偶然にも同じ場所で鉢合わせしてしまった。\\n\\n罵声が飛び交い、拳が振り上げられ、一触即発の空気が流れる。この分断は、もはや癒やしがたいものになりつつあった。"
 usa.4.a:0 "§R労働者の集会§!に参加する。"
 usa.4.b:0 "§B退役軍人たち§!と握手を交わす。"

 usa.5.t:0 "沈黙する工場、囁く革命"
 usa.5.d:0 "1936年5月。ラストベルト全域で、かつてない規模のストライキが発生した。\\n\\n自動車工場、製鉄所、繊維工場——どこでも労働者たちが生産ラインを停止させ、工場を占拠している。彼らの要求は単純明快、「賃金を上げろ、さもなくば工場は動かない」。\\n\\n一部の報告によれば、欧州連合から来た扇動者——赤い旗を掲げる者たち——がストライキを煽っているという。真偽は定かではないが、革命の囁きは確実に広がりつつある。"
 usa.5.a:0 "§R労働者の怒り§!を正しい方向に導け。"
 usa.5.b:0 "§B工場を奪還§!し、秩序を取り戻せ。"

 usa.6.t:0 "屈辱の外交公電"
 usa.6.d:0 "1936年6月。大統領のデスクに、英国政府からの外交公電が届けられた。\\n\\nその内容は、アメリカ国民にとって屈辱以外の何物でもなかった。英国政府は、巨額の戦債の返済の「担保」として、パナマ運河の管理権とアラスカの利権を要求していた。\\n\\n「さもなくば、我々は経済的措置と、必要であれば海軍行動を検討せざるを得ない。」——公電の最後の一文は、明らかな脅迫だった。\\n\\nフーバー大統領は頭を抱えた。この要求を受け入れれば、政権の命運は尽きる。しかし拒否すれば、国際的な孤立と経済破綻が待っている。"
 usa.6.a:0 "§R要求を無視せよ！§! 奴らに戦争を始める度胸はない。"
 usa.6.b:0 "§B艦船を売却§!してでも、借金を返済する。"

 usa.7.t:0 "泥にまみれた星条旗"
 usa.7.d:0 "1936年7月4日。独立記念日——本来なら、国を挙げて祝うべき日。\\n\\nだが、今年の祝祭は地獄絵図と化した。ニューヨークのパレードに暴徒が乱入し、警官隊に火炎瓶を投げつけた。警官たちは逃亡し、暴徒は星条旗を泥の中に投げ捨てて踏みにじった。\\n\\n大統領に緊急報告が届く。「治安部隊だけでは制圧不能です。軍の出動を要請すべきでしょうか？」"
 usa.7.a:0 "§R民間の自警団§!に街の防衛を任せる。"
 usa.7.b:0 "§B戒厳令§!を布告し、軍を派遣する。"

 usa.8.t:0 "黒い夏とダストボウル"
 usa.8.d:0 "1936年8月。記録的な熱波と干ばつが中西部を襲った。\\n\\n数年前から続くダストボウル（砂塵嵐）により農地は荒廃し、もはや作物は育たない。何千もの家族が土地を捨て、「約束の地」カリフォルニアを目指して西へと向かった。\\n\\nしかし、カリフォルニア州境では、彼らを「オーキー（オクラホマ出身者への蔑称）」と呼ぶ自警団が待ち構えていた。「余所者は出て行け！」——難民たちは行き場を失い、州境の荒地にバラック小屋を建てて暮らし始めた。"
 usa.8.a:0 "§R難民を保護§!し、州境を強行突破させる。"
 usa.8.b:0 "§B難民を徴兵§!し、軍の一員として受け入れる。"

 usa.9.t:0 "吠える男、沈黙する将軍"
 usa.9.d:0 "1936年9月。大統領選が迫る中、二人の男が対照的な行動を取っていた。\\n\\n一人はヒューイ・ロング。彼は毎夜のようにラジオに出演し、「富の共有」を叫び、銀行家と大企業を糾弾する。彼の言葉は民衆の怒りと希望を代弁し、支持率は日に日に高まっている。\\n\\nもう一人はダグラス・マッカーサー。彼は公の場ではほとんど発言しないが、水面下で軍と財界との関係を強化している。彼の沈黙は、嵐の前の静けさのようだ。\\n\\nフーバー大統領は苦渋の決断を迫られる。どちらの勢力に歩み寄るべきか？"
 usa.9.a:0 "§Rロング陣営§!に政治資金を提供する。"
 usa.9.b:0 "§Bマッカーサー§!と直通のホットラインを開設する。"

 usa.10.t:0 "投票用紙よりも弾丸を"
 usa.10.d:0 "1936年10月。フィラデルフィアで行われた大統領候補者討論会は、惨劇で幕を閉じた。\\n\\n討論会の最中、会場に銃声が響き渡った。パニックに陥った聴衆が逃げ惑う中、さらなる銃声が続く。犯人はロング派の過激派か、反ロングの自警団か——真相は闘士も定かではなかったが、結果として数十人の死傷者が出た。\\n\\n「もはや投票用紙では何も変わらない。」——この言葉が、全国で囁かれ始めている。"
 usa.10.a:0 "§Rやられたらやり返せ！§! 敵対勢力に報復を。"
 usa.10.b:0 "§B全ての武装勢力§!を徹底的に鎮圧する。"

 usa.11.t:0 "審判の日"
 usa.11.d:0 "1936年11月。大統領選挙の日が来た。しかし、その日は民主主義の勝利ではなく、終焉を告げる日となった。\\n\\n各地の投票所で暴力事件が相次ぎ、開票作業は中断された。多くの州で結果が確定できず、憲法に定められた大統領選出のプロセスは完全に機能不全に陥った。\\n\\nホワイトハウスの執務室で、フーバー大統領は最後の決断を迫られている。窓の外では、ロング支持者と軍部支持者がそれぞれ集会を開いている。\\n\\n彼は疲れ切った目で二通の書類を見比べた。一方はロングへの政権移譲を認める文書、もう一方はマッカーサー将軍に非常事態宣言の権限を委任する文書。\\n\\n「神よ、アメリカを救いたまえ…」\\n\\n彼はペンを取り上げた。"
 usa.11.a:0 "§R民衆の声を聞け！§! ロングに政権を託す。"
 usa.11.b:0 "§B秩序が必要だ。§! マッカーサーに権限を委任する。"

 # =========================================================================
 # 変数 (GUI表示用)
 # =========================================================================
 usa_long_support:0 "ロング派支持率"
 usa_macarthur_support:0 "マッカーサー派支持率"

 # =========================================================================
 # 国家方針 - 政治
 # =========================================================================
 USA_crisis_time:0 "危機の時"
 USA_crisis_time_desc:0 "1936年、アメリカ合衆国は建国以来最大の試練の時を迎えている。経済は崩壊し、政治は機能不全に陥り、国民は希望を失いつつある。今こそ、この危機に正面から向き合い、行動を起こす時だ。しかし、どのような行動を取るかによって、この国の未来は大きく変わることになる。"
 USA_share_wealth_rhetoric:0 "富の再分配論"
 USA_share_wealth_rhetoric_desc:0 "「富を分かち合え！」——ヒューイ・ロングのスローガンは、持たざる者たちの心を掴んだ。彼が提唱する「シェア・アワ・ウェルス」計画は、大富豪の資産を没収し、全国民に最低限の収入を保障するというものだ。既存の秩序を守りたい者たちにとっては悪夢だが、飢えた民衆にとっては希望の光である。"
 USA_call_for_order:0 "秩序の呼びかけ"
 USA_call_for_order_desc:0 "「このままでは国が滅ぶ！」——マッカーサー将軍を中心とした保守派は、社会不安の拡大に深い危機感を抱いている。彼らは、過激な扇動者たちを抑え込み、法と秩序を回復することこそが、国を救う唯一の道だと主張する。そのためには、多少の「強硬手段」も辞さない覚悟だ。"
 USA_protest_wall_st:0 "ウォール街への抗議"
 USA_protest_wall_st_desc:0 "失業者と労働者の大群がウォール街を占拠した。彼らは「銀行家は泥棒だ！」と叫び、金融機関の建物に石を投げつけている。この抗議行動を支持するか弾圧するかで、政権の方向性は大きく変わるだろう。"
 USA_protect_industry_pol:0 "産業界の保護"
 USA_protect_industry_pol_desc:0 "財界のリーダーたちは、政府と軍に助けを求めている。彼らは、「過激な労働者たち」から工場を守り、生産活動を正常化することを望んでいる。彼らへの支援は、経済の安定に繋がるが、労働者の怒りをさらに煽ることにもなりかねない。"
 USA_organize_minutemen:0 "民兵の組織化"
 USA_organize_minutemen_desc:0 "ロング派の支持者たちは、既存の治安機関を信用していない。彼らは独自の武装組織——「現代のミニットマン」——を編成し始めた。これは、いざという時に自分たちの手でロングを守るためだという。"
 USA_federalize_national_guard:0 "州兵の連邦化"
 USA_federalize_national_guard_desc:0 "マッカーサー将軍は、各州の州兵を連邦政府の直接指揮下に置くことを提案している。これにより、国内の治安維持能力は大幅に強化されるが、州の自治権を侵害するとして反対の声も強い。"
 USA_election_day_1936:0 "審判の日"
 USA_election_day_1936_desc:0 "1936年の大統領選挙は、単なる政権交代ではない。それは、アメリカという国の根本的なあり方を問う歴史的な審判の日となるだろう。どちらの勢力が勝利しても、この国は二度と元には戻らない。"

 # =========================================================================
 # 国家方針 - 経済 (フーバー)
 # =========================================================================
 USA_stimulate_private_sector:0 "民間活力の導入"
 USA_stimulate_private_sector_desc:0 "フーバー大統領は、政府による直接的な経済介入に慎重な姿勢を崩さない。彼は、アメリカ経済の回復は政府ではなく、民間企業の活力によってもたらされるべきだと信じている。規制緩和と減税によって民間投資を促進することこそが、正しい道なのだ。"
 USA_expand_rfc:0 "復興金融公社の拡充"
 USA_expand_rfc_desc:0 "復興金融公社（RFC）は、フーバー政権が設立した政府機関であり、経営難に陥った銀行や鉄道会社への融資を行っている。この機関の資金を増強し、融資先を拡大することで、産業基盤の崩壊を食い止めることができるかもしれない。"
 USA_voluntary_cooperation:0 "自発的協力の呼びかけ"
 USA_voluntary_cooperation_desc:0 "フーバーは、強制的な規制ではなく、経営者と労働者の「自発的な協力」によって経済危機を乗り越えられると信じている。彼は両者に対し、賃金を維持し、解雇を控え、協力して困難を乗り越えるよう呼びかけている。"
 USA_emergency_loans:0 "産業界への緊急融資"
 USA_emergency_loans_desc:0 "多くの企業が倒産の瀬戸際に立たされている。これらの企業を救済するために緊急融資を行えば、雇用を維持し、経済のさらなる悪化を防ぐことができるだろう。"
 USA_save_banks:0 "銀行救済法の制定"
 USA_save_banks_desc:0 "銀行への信頼が失われ、取り付け騒ぎが頻発している。金融システムの安定を取り戻すために、銀行救済のための緊急法案を制定する必要がある。"
 USA_encourage_charity:0 "慈善事業の奨励"
 USA_encourage_charity_desc:0 "フーバーは、貧困者への支援は政府の仕事ではなく、民間の慈善団体や地域社会が担うべきだと考えている。彼は富裕層や教会に対し、積極的な慈善活動を呼びかけている。"
 USA_maintain_wages:0 "賃金維持の要請"
 USA_maintain_wages_desc:0 "デフレスパイラルを防ぐため、フーバーは企業経営者に対し、従業員の賃金をカットしないよう要請している。これは強制力のない「紳士協定」だが、一定の効果を期待できる。"
 USA_trickle_down_theory:0 "トリクルダウン理論"
 USA_trickle_down_theory_desc:0 "「富裕層を豊かにすれば、その恩恵はやがて社会全体に浸透する。」——フーバーはこの経済理論を信奉している。大企業と富裕層への減税を行い、彼らの投資と消費を促進することで、経済全体を活性化させるのだ。"
 USA_maintain_gold_standard:0 "金本位制の堅持"
 USA_maintain_gold_standard_desc:0 "多くの経済学者は、金本位制からの離脱を勧告している。しかし、フーバーはドルの価値と国際的な信用を維持するために、金本位制を堅持する決意だ。これはインフレを防ぐが、デフレを悪化させる可能性もある。"
 USA_smoot_hawley_tariff:0 "スムート・ホーリー関税の強化"
 USA_smoot_hawley_tariff_desc:0 "外国からの安価な輸入品に国内産業が駆逐されている。これを防ぐために、輸入関税を大幅に引き上げるのだ。しかし、この措置は貿易相手国の報復を招き、国際関係を悪化させる可能性がある。"
 USA_market_recovery:0 "市場の自律的回復"
 USA_market_recovery_desc:0 "フーバーの政策は、ようやく実を結びつつある。産業基盤は再建され、雇用は回復し始め、アメリカ経済は長いトンネルの出口を見つけた。市場の自律的な回復力が証明されたのだ——もちろん、多少の政府の援助は必要だったが。"

