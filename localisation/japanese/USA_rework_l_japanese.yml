 # ========================================================================
 # Long経済ツリー - 追加tooltips
 # ========================================================================
 
 USA_default_debts:0 "債務不履行"
 USA_default_debts_desc:0 "日英への債務を一方的に破棄する。「これらは植民地的搾取による不当な債務であり、支払う義務はない」——ロングはこう宣言し、対外債務の完全な不履行を決定した。さらに、「搾取への賠償」として、逆に日英に補償を要求する。国際金融市場では大混乱が起こり、アメリカの信用は地に落ちるが、ロングは「泥棒の信頼など不要だ」と一蹴する。"
 USA_default_debts_tooltip:0 "§Y合衆国経済§!に以下の修正\n消費財: §G-5%§!"
 
 USA_expro_oil:0 "石油産業の接収"
 USA_expro_oil_desc:0 "スタンダード・オイルを筆頭とする石油企業を国有化し、戦略資源を国家管理下に置く。テキサス、オクラホマ、カリフォルニアの油田が軍によって占拠され、外国資本の技術者は追放される。短期的には生産効率が低下するが、長期的には自給自足を実現し、エネルギー安全保障を確立する。ロックフェラー家は没落し、石油利権は「人民のもの」となる。"
 USA_expro_oil_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+5%§!"
 
 USA_seize_factories:0 "工場の接収"
 USA_seize_factories_desc:0 "フォード、ゼネラルモーターズ、USスティールなどの巨大工場を次々と接収し、国有化する。工場の労働者たちは歓喜の声を上げ、「人民の工場」の旗を掲げる。元経営者たちは逮捕され、「労働者搾取」の罪で裁判にかけられる。生産管理は労働者評議会に委ねられ、効率は一時的に低下するが、ロングは「民衆の所有こそが真の効率である」と主張する。"
 USA_seize_factories_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+10%§!\n生産効率上限: §G+5%§!"
 
 # MacArthur経済ツリー
 USA_war_economy:0 "戦時経済"
 USA_war_economy_desc:0 "国家全体を戦時体制に移行させ、すべての資源を軍事生産に振り向ける。工場は24時間稼働体制に入り、民需から軍需への転換が加速される。消費が制限され、配給制が導入されるが、軍事生産能力は飛躍的に向上する。「犠牲なくして勝利なし」——これがマッカーサーの信条である。"
 USA_war_economy_tooltip:0 "§Y合衆国経済§!に以下の修正\n消費財: §G-10%§!\n軍需工場建設速度: §G+20%§!"
 
 USA_total_mobilization:0 "総動員体制"
 USA_total_mobilization_desc:0 "国民総動員法を制定し、全ての成人男性を軍事動員の対象とする。民間労働力は大幅に減少するが、軍事力は圧倒的に増強される。工場、農場、学校——すべてが軍事目的のために再編される。これは平時の民主国家から、総力戦体制の軍事国家への完全な転換である。"
 USA_total_mobilization_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n徴兵可能人口: §G+10%§!\n§Y合衆国経済§!に以下の修正\n消費財: §G-5%§!"
 
 # ========================================================================
 # Long経済ツリー - 残りのNF
 # ========================================================================
 
 USA_autarky_achieved:0 "経済自給自足の達成"
 USA_autarky_achieved_desc:0 "日英からの経済的独立を完全に達成した。外国資本を排除し、国内資源を最大限に活用することで、アメリカは真の意味で自立した経済圏となった。もはや外国の銀行家や商人の意向に左右されることはない。しかし、国際的な孤立という代償を払っている。"
 USA_autarky_achieved_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+10%§!\n生産効率上限: §G+20%§!\n§Y合衆国経済§!に以下の修正\n資源産出量: §G+15%§!"
 
 USA_long_nationalization:0 "全産業の国有化"
 USA_long_nationalization_desc:0 "鉄鋼、石炭、鉄道、航空——すべての基幹産業を国有化し、「人民の財産」とする。民間企業は完全に消滅し、すべての経済活動が国家の計画下に置かれる。これは資本主義の完全な廃止であり、新たな経済システムの誕生である。"
 USA_long_nationalization_tooltip:0 "§Y合衆国経済§!に以下の修正\n消費財: §G-5%§!\n§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+8%§!"
 
 USA_long_wealth_tax:0 "富裕税"
 USA_long_wealth_tax_desc:0 "残存する富裕層に対し、資産額に応じた「富裕税」を課す。この税収は、社会福祉プログラムと軍事費に充てられる。税率は資産額が増えるほど累進的に上昇し、最高で年間資産の30%に達する。"
 USA_long_wealth_tax_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+8%§!"
 
 USA_long_peoples_bank:0 "人民銀行"
 USA_long_peoples_bank_desc:0 "単一の国有銀行「人民銀行」を設立し、すべての金融サービスを統合する。利息は廃止され、融資は「革命への貢献度」に基づいて無償で提供される。貧困層は住宅ローンや事業資金を容易に得られるようになるが、富裕層は融資から完全に排除される。"
 USA_long_peoples_bank_tooltip:0 "§Y合衆国経済§!に以下の修正\n消費財: §G-3%§!\n§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+5%§!"
 
 USA_long_share_wealth:0 "富の共有の完成"
 USA_long_share_wealth_desc:0 "「富の共有」プログラムが完全に実現された。所得格差は劇的に縮小し、極端な貧困は消滅した。すべての家庭に最低限の生活が保障され、教育と医療は完全無償化された。しかし、経済の活力は失われ、技術革新は停滞している。平等は達成されたが、繁栄の代償として。"
 USA_long_share_wealth_tooltip:0 "§Y合衆国の政治§!に以下の修正\n安定度: §G+10%§!\n§Y合衆国経済§!に以下の修正\n消費財: §G-8%§!\n§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+15%§!"
 
 USA_long_guaranteed_income:0 "最低所得保障"
 USA_long_guaranteed_income_desc:0 "すべての国民に対し、働く働かないに関わらず、最低限の生活を営むための所得を保障する。「労働の義務」は維持されるが、失業しても飢えることはない。これは史上初の包括的な社会保障制度であり、世界中の注目を集めている。"
 USA_long_guaranteed_income_tooltip:0 "§Y合衆国の政治§!に以下の修正\n安定度: §G+5%§!\n§Y合衆国経済§!に以下の修正\n消費財: §G-3%§!"
 
 USA_long_free_education:0 "完全無償教育"
 USA_long_free_education_desc:0 "幼稚園から大学まで、すべての教育を完全に無償化する。教科書、給食、寮費——すべてが国家負担となる。しかし、カリキュラムは「キングフィッシュの思想」を中心に編成され、批判的思考よりも忠誠心が重視される。教育は解放の手段から、洗脳の道具へと変質していく。"
 USA_long_free_education_tooltip:0 "§Y合衆国経済§!に以下の修正\n研究速度: §G+5%§!"
 
 # ========================================================================
 # Long軍事ツリー
 # ========================================================================
 
 USA_peoples_army_desc:0 "軍をキングフィッシュに忠実な「人民の軍隊」として再編成する。伝統的な階級制度は「ブルジョア的特権」として緩和され、将校と兵士の格差は縮小される。代わりに、政治将校（コミッサール）が各部隊に配置され、兵士の思想教育と忠誠心の維持を担当する。軍は国家防衛組織から、ロング体制の暴力装置へと変貌していく。"
 USA_peoples_army_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍組織率: §G+5%§!"
 
 USA_mass_conscription_desc:0 "すべての成人男性に兵役義務を課す国民皆兵制を導入する。「すべてのアメリカ人は戦士である」というスローガンの下、大規模な動員が行われる。訓練は短期間で、装備は簡素だが、数で敵を圧倒する戦略である。質より量——これが人民の軍隊の原則となる。"
 USA_mass_conscription_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n徴兵可能人口: §G+3%§!"
 
 USA_political_commissars:0 "政治将校制度"
 USA_political_commissars_desc:0 "各部隊に政治将校を配置し、兵士の思想教育と政治的忠誠を監視する。彼らは軍事作戦には関与しないが、反革命的な言動を報告し、疑わしい兵士を粛清する権限を持つ。これにより、軍の忠誠心は向上するが、士気への悪影響も懸念される。"
 USA_political_commissars_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍組織率: §G+5%§!\n陸軍攻撃: §G+5%§!"
 
 # ========================================================================
 # Long外交ツリー
 # ========================================================================
 
 USA_revenge_declaration:0 "復讐の宣言"
 USA_revenge_declaration_desc:0 "ヒューイ・ロングは全国民に向けたラジオ演説で、日英両帝国への「復讐」を宣言した。「彼らはアメリカを搾取し、我々の富を奪った。今こそ、その代償を支払わせる時だ！」——演説は全米で熱狂的に受け入れられ、戦争への気運が高まる。"
 USA_revenge_declaration_tooltip:0 "§Y合衆国の政治§!に以下の修正\n戦争協力度: §G+10%§!"
 
 USA_crush_canada:0 "カナダ侵攻"
 USA_crush_canada_desc:0 "イギリスの盟友カナダを攻撃し、大英帝国の北米における橋頭堡を破壊する。カナダは弱小国であり、人民の軍隊の数的優位により、短期間で制圧できるだろう。これは日英への復讐戦争の序章である。"
 USA_crush_canada_tooltip:0 "§Y合衆国海軍§!に以下の修正\n上陸作戦能力: §G+10§!"
 
 USA_pacific_storm:0 "太平洋の嵐"
 USA_pacific_storm_desc:0 "太平洋艦隊を増強し、日本海軍との決戦に備える。ハワイ、ミッドウェー、フィリピン——これらの島々を巡る海戦が、アメリカと日本の運命を決定する。「太平洋の嵐」が来る。その中心には、キングフィッシュの復讐心がある。"
 USA_pacific_storm_tooltip:0 "§Y合衆国海軍§!に以下の修正\n海軍ダメージ: §G+10%§!"
 
 USA_atlantic_fury:0 "大西洋の怒り"
 USA_atlantic_fury_desc:0 "大西洋艦隊を展開し、イギリス海軍の制海権に挑戦する。Uボート戦術を研究し、通商破壊により英国を経済的に窒息させる。「イギリスを海の底に沈めろ」——これが人民海軍の合言葉となる。"
 USA_atlantic_fury_tooltip:0 "§Y合衆国海軍§!に以下の修正\n命中率: §G+10%§!"
 
 USA_burn_tokyo:0 "東京を焼け"
 USA_burn_tokyo_desc:0 "戦略爆撃機を大量生産し、日本本土への無差別爆撃を計画する。東京、大阪、名古屋——日本の主要都市を灰燼に帰し、日本国民の戦意を完全に破砕する。これは復讐であり、正義であり、キングフィッシュの意志である。"
 USA_burn_tokyo_tooltip:0 "§Y合衆国海軍§!に以下の修正\n戦略爆撃: §G+15%§!\n航空攻撃: §G+10%§!"
 
 USA_fall_of_london:0 "ロンドン陥落"
 USA_fall_of_london_desc:0 "英国本土への上陸作戦を敢行し、大英帝国の心臓部を直接攻撃する。ドーバー海峡を渡り、ロンドンの街にアメリカ国旗を掲げる——これがロングの究極の目標である。世界の覇権が、大西洋を越えてアメリカへと移る瞬間である。"
 USA_fall_of_london_tooltip:0 "§Y合衆国海軍§!に以下の修正\n上陸作戦能力: §G+15§!\n§Y合衆国陸軍§!に以下の修正\n特殊部隊上限: §G+5%§!"
 
 USA_world_emperor:0 "世界皇帝"
 USA_world_emperor_desc:0 "日英両帝国を打倒し、世界の覇権を掌握したヒューイ・ロングは、自らを「世界皇帝」と称する。かつて「すべての人が王様になれる」と約束した男は、今や唯一無二の世界支配者として君臨する。民主主義の理想は完全に死に、新たな帝国の時代が始まる。"
 USA_world_emperor_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+15%§!\n§Y合衆国陸軍§!に以下の修正\n陸軍攻撃: §G+15%§!"
 
 # ========================================================================
 # アイデア（Ideas）
 # ========================================================================
 
 USA_hollow_state_idea:0 "空洞化した共和国"
 USA_hollow_state_idea_desc:0 "大恐慌と外国資本の支配により、アメリカの産業は深刻なダメージを受けている。"
 
 USA_faction_struggle_idea:0 "派閥対立"
 USA_faction_struggle_idea_desc:0 "ロング派とマッカーサー派の対立が、政治を麻痺させている。"
 
 USA_long_regime:0 "キングフィッシュ体制"
 USA_long_regime_desc:0 "ヒューイ・ロングの個人独裁により、急進的な富の再分配が実施されている。"
 
 USA_mac_regime:0 "軍政"
 USA_mac_regime_desc:0 "マッカーサー将軍による効率的な軍事統制が確立されている。"
 
 USA_minutemen:0 "ミニットメン"
 USA_minutemen_desc:0 "ロングの私兵組織が、国内の治安維持と政治的弾圧を担当している。"
 
 USA_share_wealth:0 "富の共有"
 USA_share_wealth_desc:0 "富裕層からの富の没収と再分配により、社会的平等が推進されている。"
 
 USA_war_machine:0 "戦争機構"
 USA_war_machine_desc:0 "軍産複合体が確立され、戦時生産体制が整っている。"
 
 # ========================================================================
 # キャラクター（Characters）
 # ========================================================================
 
 POLITICS_HUEY_LONG_DESC:0 "「キングフィッシュ」と呼ばれるヒューイ・P・ロングは、ルイジアナ州の貧困層出身の野心的なポピュリストである。彼は「すべての人が王様になれる」と訴え、富裕層への課税と富の再分配を掲げて大衆の支持を獲得した。カリスマ性と無慈悲さを兼ね備えた彼は、アメリカを根底から変革しようとしている。"
 
 POLITICS_DOUGLAS_MACARTHUR_DESC:0 "ダグラス・マッカーサーは、第一次世界大戦の英雄であり、名門軍人一家の出身である。彼は軍の近代化と効率的な組織運営を信条とし、政治家たちの無能さに憤りを感じている。軍人としての規律と名誉により、アメリカを再び偉大な国家にすると誓っている。"
 
 # ========================================================================
 # 特性（Traits）
 # ========================================================================
 
 USA_kingfish:0 "キングフィッシュ"
 USA_kingfish_desc:0 "カリスマ性と独裁的手法により、大衆を動員する能力に優れている。"
 
 USA_american_caesar:0 "アメリカのカエサル"
 USA_american_caesar_desc:0 "軍事的天才と組織運営能力により、効率的な統治を実現する。"
 
 USA_populist_demagogue:0 "ポピュリスト扇動家"
 USA_populist_demagogue_desc:0 "民衆の不満を巧みに利用し、政治的支持を獲得する。"
 
 USA_military_genius:0 "軍事的天才"
 USA_military_genius_desc:0 "戦術と戦略の両面で優れた能力を発揮する。"
 
 # ========================================================================
 # MacArthurルート - 詳細desc
 # ========================================================================
 
 USA_mac_victory_desc:0 "ダグラス・マッカーサー将軍は、軍部と保守派の圧倒的な支持を背景に大統領に選出された。就任演説で彼は「秩序と規律」「軍の統制」を掲げ、「腐敗した政治家と無能な官僚の時代は終わった」と宣言した。軍人としての手腕で国家を再建し、効率的な組織運営により経済を復興させる——これがマッカーサーの約束である。日英との協調路線により、アメリカは再び大国としての地位を取り戻すだろう。しかし、その代償として、民主主義は大きく後退することになる。"
 USA_mac_victory_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍組織率: §G+5%§!"
 
 USA_american_caesar_desc:0 "ダグラス・マッカーサーは自らを「アメリカのカエサル」と称し、共和国を「救済」する歴史的使命を負うと宣言する。古代ローマのカエサルが共和政の混乱を終わらせたように、彼もまた、派閥争いで麻痺した共和国に秩序をもたらす。軍人としての規律と名誉が、新たなアメリカの基盤となる。これは独裁の始まりか、それとも秩序ある統治の実現か——歴史が判断するだろう。"
 USA_american_caesar_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+5%§!"
 
 USA_martial_law:0 "戒厳令"
 USA_martial_law_desc:0 "全国に戒厳令を布告し、軍が治安維持の全権を掌握する。夜間外出禁止令が施行され、主要都市には装甲車が配備される。「秩序の回復」という名目の下、反対派の集会は解散させられ、批判的なメディアは閉鎖される。これは一時的な措置か、それとも恒久的な軍政への移行か——国民は不安に震えている。"
 USA_martial_law_tooltip:0 "§Y合衆国の政治§!に以下の修正\n安定度: §G+5%§!"
 
 USA_meritocratic_government_desc:0 "出自、人脈、政治的関係ではなく、純粋に能力と実績に基づく人事を徹底する。軍の効率的な組織運営を政府全体に適用し、無能な官僚を次々と解任する。昇進は試験と業績評価によって決定され、縁故主義は厳しく罰せられる。これにより、政府機構の効率は劇的に向上するが、政治的多様性は失われていく。"
 USA_meritocratic_government_tooltip:0 "§Y合衆国経済§!に以下の修正\n研究速度: §G+3%§!"
 
 USA_anti_communist_purge:0 "反共粛清"
 USA_anti_communist_purge_desc:0 "政府、軍、教育機関から共産主義者とその同調者を徹底的に排除する。「赤狩り」と呼ばれるこの運動は、容疑者の人権を無視した苛烈なものとなる。疑わしきは罰せず——ではなく、疑わしきは排除する。これにより、共産主義の脅威は根絶されるが、自由と人権は大きく損なわれる。"
 USA_anti_communist_purge_tooltip:0 "§Y合衆国の政治§!に以下の修正\nイデオロギードリフト防衛: §G+25%§!"
 
 USA_military_government_desc:0 "軍部による本格的な政治統制が確立される。主要な閣僚ポストは軍人が占め、州知事には退役将校が任命される。軍の効率的な組織体制を国家全体に適用し、命令系統を明確化する。民間部門も軍事的秩序の下に置かれ、「規律こそが効率の源泉」という原則が徹底される。議会は諮問機関と化し、実権は大統領府の軍事評議会に移る。"
 USA_military_government_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+10%§!\n§Y合衆国陸軍§!に以下の修正\n陸軍組織率: §G+5%§!"
 
 USA_technocratic_elite_desc:0 "技術者、科学者、経営学者を国家の中枢に登用し、技術的優位性と科学的手法に基づく国力強化を推進する。「感情ではなく理性、政治ではなく科学」——これがテクノクラシーの原則である。経済政策は数理モデルに基づいて策定され、社会問題は工学的に「最適化」される。人間性は数値化され、政治は技術的問題へと還元されていく。"
 USA_technocratic_elite_tooltip:0 "§Y合衆国経済§!に以下の修正\n研究速度: §G+5%§!\n§Y合衆国の軍事産業§!に以下の修正\n生産効率上限: §G+3%§!"
 
 USA_eternal_regent:0 "永遠の摂政"
 USA_eternal_regent_desc:0 "マッカーサーは自らを「永遠の摂政」と位置づけ、「真の民主主義が回復するまでの一時的な措置」として無期限の統治を宣言する。選挙は無期限に延期され、議会は名目上存在するが実権を持たない。「民主主義を守るために、一時的に民主主義を停止する」——この矛盾した論理が、アメリカの新たな現実となる。"
 USA_eternal_regent_tooltip:0 "§Y合衆国の政治§!に以下の修正\n政治力獲得: §G+15%§!\n安定度: §G+10%§!"
 
 USA_industrial_reconstruction:0 "産業再建"
 USA_industrial_reconstruction_desc:0 "軍の組織運営手法を産業界に適用し、効率的な生産体制を確立する。標準化、垂直統合、品質管理——これらの軍事的原則が、民間工場にも導入される。工場は軍事的規律の下で運営され、労働者は兵士のように訓練される。生産効率は劇的に向上するが、労働環境は軍隊の兵舎に近づいていく。"
 USA_industrial_reconstruction_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+10%§!\n生産効率上限: §G+3%§!"
 
 USA_dollar_stabilization:0 "ドル安定化"
 USA_dollar_stabilization_desc:0 "通貨価値を安定させるため、金本位制を強化し、財政規律を徹底する。インフレは厳しく抑制され、国際貿易における信用が回復する。しかし、緊縮政策により内需は冷え込み、国民生活は苦しくなる。「犠牲なくして復興なし」——マッカーサーの信条が、経済政策にも適用される。"
 USA_dollar_stabilization_tooltip:0 "§Y合衆国経済§!に以下の修正\n消費財: §G-5%§!\n最小輸出: §G-5%§!"
 
 USA_fordism_principles:0 "フォーディズムの原則"
 USA_fordism_principles_desc:0 "ヘンリー・フォードが確立した大量生産方式を、全産業に適用する。流れ作業、部品の完全な標準化、垂直統合——これらの原則により、生産効率は飛躍的に向上する。労働者は部品のように扱われ、人間性は犠牲になるが、「効率こそが正義」である。"
 USA_fordism_principles_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n生産効率上限: §G+5%§!\n生産効率獲得: §G+5%§!"
 
 USA_standardized_production:0 "標準化生産"
 USA_standardized_production_desc:0 "すべての製品規格を統一し、互換性を確保する。これにより、生産ラインの転換が容易になり、柔軟な生産体制が実現される。軍需と民需の切り替えも迅速に行えるようになり、総力戦への対応能力が向上する。"
 USA_standardized_production_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\nライン変更効率: §G+10%§!\n工場出力: §G+5%§!"
 
 USA_industrial_miracle:0 "産業の奇跡"
 USA_industrial_miracle_desc:0 "マッカーサーの産業政策が完全に実を結び、「産業の奇跡」と呼ばれる驚異的な経済成長が実現された。工場は24時間休みなく稼働し、生産量は数年前の数倍に達する。アメリカは再び世界の工場となり、その経済力は他国を圧倒する。しかし、この繁栄は軍事的統制と労働者の犠牲の上に成り立っている。"
 USA_industrial_miracle_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+15%§!\n造船所出力: §G+10%§!\n§Y合衆国経済§!に以下の修正\n消費財: §G-10%§!\n最小輸出: §G-20%§!"
 
 USA_mac_corporate_state_desc:0 "軍、政府、企業が一体となったコーポラティズム体制を確立する。各産業部門に評議会が設置され、生産目標と資源配分が中央で決定される。これは国家資本主義の一形態であり、市場経済とは大きく異なる統制経済である。効率は向上するが、自由は失われる。"
 USA_mac_corporate_state_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+8%§!\n§Y合衆国経済§!に以下の修正\n軍需工場建設速度: §G+10%§!"
 
 USA_mac_industrial_council_desc:0 "軍、政府、企業の代表からなる産業評議会を設立し、国家の産業政策を調整・統制する。軍の合理的な組織運営手法を経済全体に適用し、資源配分を最適化し、生産効率を最大化する。これは国家資本主義の一形態であり、自由市場経済からは大きく逸脱するが、マッカーサーは「効率こそが正義である」と断言する。"
 USA_mac_industrial_council_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n生産効率上限: §G+8%§!"
 
 USA_mac_military_contracts:0 "軍事契約"
 USA_mac_military_contracts_desc:0 "政府が主要企業と長期軍事契約を締結し、安定的な受注を保証する。これにより、企業は大規模な設備投資を行い、軍需生産能力を飛躍的に拡大する。軍産複合体が形成され、産業と軍事が不可分に結びつく。"
 USA_mac_military_contracts_tooltip:0 "§Y合衆国経済§!に以下の修正\n軍需工場建設速度: §G+15%§!\n§Y合衆国の軍事産業§!に以下の修正\n造船所出力: §G+5%§!"
 
 USA_mac_war_economy_desc:0 "国家全体を戦時経済体制に移行させる。すべての資源が軍事生産に優先的に配分され、民需は最低限に抑えられる。消費は制限され、配給制が導入される。「犠牲なくして勝利なし」——国民はこのスローガンの下、苦難に耐える。"
 USA_mac_war_economy_tooltip:0 "§Y合衆国経済§!に以下の修正\n消費財: §G-15%§!\n軍需工場建設速度: §G+25%§!\n§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+12%§!"
 
 USA_mac_rationing:0 "配給制"
 USA_mac_rationing_desc:0 "食料、燃料、衣料品など、あらゆる生活必需品を配給制とする。国民は配給カードを受け取り、定められた量の物資のみを購入できる。これにより、資源を軍事生産に集中させることができるが、国民生活の質は大きく低下する。"
 USA_mac_rationing_tooltip:0 "§Y合衆国経済§!に以下の修正\n消費財: §G-10%§!\n軍需工場建設速度: §G+10%§!"
 
 USA_mac_total_mobilization_desc:0 "国民総動員法を制定し、全ての成人男性を軍事動員の対象とする。民間労働力は大幅に減少するが、軍事力は圧倒的に増強される。工場、農場、学校——すべてが軍事目的のために再編される。これは平時の民主国家から、総力戦体制の軍事国家への完全な転換である。"
 USA_mac_total_mobilization_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n徴兵可能人口: §G+5%§!"
 
 USA_military_modernization:0 "軍の近代化"
 USA_military_modernization_desc:0 "陸軍を徹底的に近代化する。新しいドクトリンを導入し、訓練方法を改革し、指揮系統を合理化する。将校教育を強化し、下士官の質を向上させる。これにより、アメリカ陸軍は世界で最も効率的で規律正しい軍隊となる。"
 USA_military_modernization_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍組織率: §G+5%§!\n計画速度: §G+5%§!"
 
 USA_global_projection:0 "世界展開能力"
 USA_global_projection_desc:0 "世界中のどこにでも迅速に軍を展開できる能力を確立する。輸送船団を整備し、前進基地を建設し、補給網を確立する。アメリカは世界のどこでも戦える軍隊を持つことになる。"
 USA_global_projection_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍攻撃: §G+10%§!\n特殊部隊上限: §G+5%§!"
 
 USA_crusade_democracy:0 "民主主義十字軍"
 USA_crusade_democracy_desc:0 "マッカーサーは「民主主義を守るための聖戦」を宣言する。共産主義とファシズムを打倒し、世界に民主主義を広めることが、アメリカの使命である——と彼は主張する。しかし、その「民主主義」は軍事的統制の下にあり、自由は大きく制限されている。この矛盾をどう説明するのか、マッカーサーは答えない。"
 USA_crusade_democracy_tooltip:0 "§Y合衆国の政治§!に以下の修正\n戦争協力度: §G+10%§!\n§Y合衆国陸軍§!に以下の修正\n陸軍攻撃: §G+5%§!"
 
 USA_liberation_europe:0 "欧州解放"
 USA_liberation_europe_desc:0 "欧州大陸への大規模上陸作戦を計画する。ノルマンディー、イタリア、ギリシャ——複数の上陸地点を確保し、欧州を解放する。これは史上最大の軍事作戦となり、アメリカの軍事力を世界に示すことになる。"
 USA_liberation_europe_tooltip:0 "§Y合衆国海軍§!に以下の修正\n上陸作戦能力: §G+15§!\n§Y合衆国陸軍§!に以下の修正\n特殊部隊上限: §G+5%§!"
 
 USA_world_policeman:0 "世界の警察"
 USA_world_policeman_desc:0 "アメリカは「世界の警察」として、世界秩序の維持に責任を負う——マッカーサーはこう宣言する。紛争地域に軍を派遣し、秩序を強制する。アメリカの価値観が、世界の標準として押し付けられる。これは平和の維持か、それとも帝国主義の新しい形態か。"
 USA_world_policeman_tooltip:0 "§Y合衆国の軍事産業§!に以下の修正\n工場出力: §G+15%§!\n§Y合衆国陸軍§!に以下の修正\n陸軍攻撃: §G+15%§!"
 
 # ========================================================================
 # 陸海軍ツリー（共通）
 # ========================================================================
 
 USA_army_reform:0 "陸軍改革"
 USA_army_reform_desc:0 "第一次世界大戦の教訓を活かし、陸軍の組織と訓練を抜本的に改革する。新しいドクトリンを導入し、指揮系統を合理化し、将校教育を強化する。"
 USA_army_reform_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍組織率: §G+5%§!"
 
 USA_officer_training:0 "将校訓練"
 USA_officer_training_desc:0 "ウェストポイントを筆頭とする士官学校の教育内容を刷新し、近代戦に対応できる将校を育成する。戦術、戦略、指揮統制——すべての分野で世界最高水準を目指す。"
 USA_officer_training_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍組織率: §G+3%§!"
 
 USA_nco_corps:0 "下士官団育成"
 USA_nco_corps_desc:0 "下士官は軍の背骨である。彼らの質が軍全体の質を決定する。下士官学校を拡充し、経験豊富な下士官を大量に育成する。"
 USA_nco_corps_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍攻撃: §G+5%§!\n陸軍防御: §G+5%§!"
 
 USA_motorization:0 "自動車化"
 USA_motorization_desc:0 "歩兵師団をトラックで自動車化し、機動力を飛躍的に向上させる。アメリカの自動車産業の力を活かし、世界で最も機動的な軍隊を作る。"
 USA_motorization_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n補給消費: §G-10%§!\n陸軍組織率: §G+5%§!"
 
 USA_combined_arms:0 "諸兵科連合"
 USA_combined_arms_desc:0 "歩兵、戦車、砲兵、航空機——異なる兵科を有機的に連携させる諸兵科連合戦術を確立する。これにより、戦闘力は個々の兵科の総和を超える。"
 USA_combined_arms_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍攻撃: §G+10%§!\n陸軍防御: §G+10%§!\n計画速度: §G+10%§!"
 
 USA_army_supremacy:0 "陸軍の覇権"
 USA_army_supremacy_desc:0 "アメリカ陸軍が世界最強の陸軍として完成された。訓練、装備、戦術——すべての面で他国を圧倒する。地上戦において、アメリカに敵う国は存在しない。"
 USA_army_supremacy_tooltip:0 "§Y合衆国陸軍§!に以下の修正\n陸軍組織率: §G+15%§!\n陸軍攻撃: §G+15%§!\n陸軍防御: §G+15%§!"
 
 USA_navy_reform:0 "海軍改革"
 USA_navy_reform_desc:0 "海軍の組織と戦術を近代化する。空母を中心とした新しい艦隊編成を確立し、太平洋と大西洋の両方で優位を確保する。"
 USA_navy_reform_tooltip:0 "§Y合衆国海軍§!に以下の修正\n海軍組織率: §G+5%§!"
 
 USA_amphibious_capability:0 "上陸作戦能力"
 USA_amphibious_capability_desc:0 "大規模な上陸作戦を実施するための特殊部隊と装備を整備する。上陸用舟艇を大量生産し、海兵隊を拡充する。"
 USA_amphibious_capability_tooltip:0 "§Y合衆国海軍§!に以下の修正\n上陸作戦能力: §G+15§!\n§Y合衆国陸軍§!に以下の修正\n特殊部隊上限: §G+5%§!"
 
 USA_naval_aviation:0 "海軍航空隊"
 USA_naval_aviation_desc:0 "空母を中心とした海軍航空戦力を強化する。艦載機の性能を向上させ、パイロットの訓練を徹底する。制空権を握ることが、制海権の鍵となる。"
 USA_naval_aviation_tooltip:0 "§Y合衆国海軍§!に以下の修正\n航空攻撃: §G+8%§!\n航空防御: §G+8%§!"
 
 USA_fleet_train:0 "艦隊補給"
 USA_fleet_train_desc:0 "遠洋での長期作戦を可能にする補給システムを確立する。補給艦を増強し、前進基地を整備し、艦隊の航続距離を延長する。"
 USA_fleet_train_tooltip:0 "§Y合衆国海軍§!に以下の修正\n護衛効率: §G+15%§!\n海軍組織率: §G+5%§!"
 
 USA_two_ocean_navy:0 "二大洋艦隊"
 USA_two_ocean_navy_desc:0 "太平洋と大西洋の両方で同時に作戦を展開できる「二大洋艦隊」を建設する。これは史上最大の海軍建設計画であり、アメリカの工業力の証明となる。"
 USA_two_ocean_navy_tooltip:0 "§Y合衆国海軍§!に以下の修正\n命中率: §G+10%§!\n海軍ダメージ: §G+10%§!\n海軍組織率: §G+10%§!"
 
 USA_navy_supremacy:0 "海軍の覇権"
 USA_navy_supremacy_desc:0 "アメリカ海軍が世界の海を支配する。太平洋、大西洋、地中海——どこにおいても、アメリカ海軍の優位は絶対的である。海の覇権は、世界の覇権を意味する。"
 USA_navy_supremacy_tooltip:0 "§Y合衆国海軍§!に以下の修正\n命中率: §G+15%§!\n海軍ダメージ: §G+15%§!\n上陸作戦能力: §G+20§!"

 # ========================================================================
 # 追加ローカライズ: 未翻訳NF (51個)
