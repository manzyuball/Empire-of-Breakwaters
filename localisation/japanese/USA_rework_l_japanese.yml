 USA_long_victory_election_tt:0 "§Hヒューイ・ロングの勝利§!\n「富の共有」ルートが開始される\n急進的な経済改革と外国資本への対決が始まる"
 USA_mac_victory_election_tt:0 "§Hマッカーサーの勝利§!\n「秩序と規律」ルートが開始される\n軍事的効率性と協調外交に基づく統治が始まる"
