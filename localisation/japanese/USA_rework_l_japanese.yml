 # usa.50 - 大恐慌の終焉
 usa.50.t:0 "大恐慌の終焉"
 usa.50.desc:0 "長く暗い経済の冬が終わりを告げた。失業率は劇的に低下し、工場は再び稼働を始めている。人々の顔に笑顔が戻り、街角には活気が蘇った。大恐慌という悪夢は終わった——アメリカの復興が始まる。これは新たな時代の幕開けである。"
 usa.50.a:0 "希望の時代が始まる"
 USA_depression_ended_tt:0 "§H大恐慌の終焉§!\n国民は再び希望を取り戻した"

 # usa.51 - 工業力回復
 usa.51.t:0 "工業大国への復帰"
 usa.51.desc:0 "アメリカの工業力が完全に回復した。鉄鋼生産は戦前水準を超え、工場の煙突からは再び黒煙が立ち昇っている。失われた十年を経て、合衆国は再び世界有数の工業大国としての地位を取り戻した。産業復興は完了した——次は世界への復帰である。"
 usa.51.a:0 "工業力の復活を祝う"
 USA_industrial_recovery_tt:0 "§H工業力回復§!\n工場生産が完全に復活し、さらなる拡張が可能になった"

 # usa.52 - 経済的独立達成
 usa.52.t:0 "経済的独立の達成"
 usa.52.desc:0 "日本と英国による経済支配から、ついに脱却した。外国資本への依存は過去のものとなり、アメリカは再び経済的主権を取り戻した。不平等条約は破棄され、関税自主権は完全に回復した。空洞化した共和国は終わりを告げる——自立した大国が蘇る。"
 usa.52.a:0 "経済的自由を祝う"
 USA_economic_independence_tt:0 "§H経済的独立§!\n外国依存から脱却し、完全な経済主権を回復した"

 # usa.53 - 海軍再建完了
 usa.53.t:0 "二洋海軍の完成"
 usa.53.desc:0 "太平洋と大西洋——両大洋で同時に作戦可能な強大な艦隊が完成した。空母・戦艦・巡洋艦・潜水艦——あらゆる艦種において世界最高水準の戦力を保有する。合衆国海軍は再び七つの海を支配する力を手にした。海洋国家アメリカの復活である。"
 usa.53.a:0 "海軍の栄光を取り戻した"
 USA_navy_rebuilt_tt:0 "§H海軍再建完了§!\n世界最強の海軍力を取り戻した"

 # usa.54 - 陸軍近代化達成
 usa.54.t:0 "陸軍近代化の完成"
 usa.54.desc:0 "合衆国陸軍が完全に近代化された。機械化歩兵、機甲師団、空挺部隊——最新ドクトリンと最新装備で武装した精強な軍隊が誕生した。かつての小規模な陸軍は、今や世界有数の地上戦力へと変貌を遂げた。いかなる敵も、我が陸軍の前に屈するだろう。"
 usa.54.a:0 "陸軍の復活を祝う"
 USA_army_modernized_tt:0 "§H陸軍近代化完了§!\n世界最強級の地上戦力を獲得した"

 # usa.55 - 技術革新の加速
 usa.55.t:0 "技術革新の時代"
 usa.55.desc:0 "科学技術分野において、アメリカが世界をリードし始めた。大学と企業の協力、連邦政府の研究投資、優秀な科学者の結集——これらが相乗効果を生み出し、画期的な技術革新が次々と実現している。技術こそが未来の戦争を決する。そして技術でアメリカは優位に立つ。"
 usa.55.a:0 "科学の力を活用する"
 USA_tech_boom_tt:0 "§H技術革新ブーム§!\n研究速度が大幅に向上し、産業技術で優位を確立"

 # usa.60 - 完全復興達成
 usa.60.t:0 "偉大な共和国の復活"
 usa.60.desc:0 "復興は完了した。経済・産業・軍事——あらゆる分野において、アメリカは再び世界の頂点に立った。大恐慌と外国支配という屈辱的な時代は終わった。再建された合衆国は、かつてよりも強大であり、かつてよりも団結している。新たな世紀が始まる——そして主役はアメリカである。"
 usa.60.a:0 "新たな時代の幕開けだ"
 USA_full_recovery_tt:0 "§H完全復興達成§!\nアメリカは再び世界の超大国として復活した"

