 # 影響力ボーナス — NF・ディシジョンのcustom_effect_tooltip
 CHI_influence_A_coastal_bonus_tt:0 "沿岸州を保有している場合、追加ボーナス（秩序派影響力+5）"
 CHI_influence_B_urban_bonus_tt:0 "都市州を保有している場合、追加ボーナス（パリ派影響力+5）"
 CHI_influence_C_rural_bonus_tt:0 "農村州を保有している場合、追加ボーナス（モスクワ派影響力+5）"
 CHI_influence_central_zone_bonus_tt:0 "中央工業地帯を保有している場合、追加ボーナス（影響力+3）"

 # 内戦スポーン
 CHI_civil_war_spawn_units_tt:0 "内戦開始と同時に、支配地域各地に追加部隊が召集される。"

 # ============================================================
 # DM（dynamic_modifier）本体の説明
 # ============================================================

 CHI_economy_development:0 "中国経済の発展"
 CHI_economy_development_desc:0 "農業国から工業国への転換が始まりつつある。各勢力の施策が産業基盤、工場効率、輸出構造を形作っていく。"

 CHI_military_power:0 "中国軍事力"
 CHI_military_power_desc:0 "百年にわたる列強の侵略と内戦で鍛えられた中国の軍事力。近代化の程度と指揮系統の整備が、戦場での命運を左右する。"

 CHI_political_governance:0 "中国政治統治"
 CHI_political_governance_desc:0 "派閥抗争が続く中、誰がこの国を統治するかが問われている。安定した統治体制の確立こそが、近代国家への第一歩である。"
