 # ルートB（紅い工業都市）
 CHI_B_revolution:0 "紅い工業都市"
 CHI_B_revolution_desc:0 "もはや妥協はない！工場に響くサイレンは、労働者たちが資本家の鎖を断ち切る合図である。都市を制圧し、この国を第四インターナショナルの前衛国家へと生まれ変わらせるのだ！"
