 # ルートA（秩序の代償）
 CHI_A_civil_war:0 "秩序の代償"
 CHI_A_civil_war_desc:0 "国家を蝕む急進的なダニどもを駆除する時が来た。彼らが夢見る「革命」などという狂気は、軍隊の鉄靴で踏みにじり、我が中華に真の規律と秩序を取り戻すのだ。"
