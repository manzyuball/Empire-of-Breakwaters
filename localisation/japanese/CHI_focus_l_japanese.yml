l_japanese:
 # 共通ツリー — 実際のフォーカスIDによるローカライズ
 CHI_crumbling_balance:0 "崩れゆく均衡"
 CHI_crumbling_balance_desc:0 "南京政府の権威は名ばかりである。右派、革命派、農民派——三つの勢力が水面下で牙を研ぎ、「その日」の到来を待っている。"
 CHI_urban_rural_rift:0 "都市と農村の亀裂"
 CHI_urban_rural_rift_desc:0 "沿岸の近代都市と広大な内陸農村の経済的・思想的断絶が、国家を内側から引き裂きつつある。"
 CHI_political_crisis:0 "政治の麻痺"
 CHI_political_crisis_desc:0 "派閥対立により政府の意思決定機能は事実上停止している。この混乱が、全ての派閥に好機をもたらしている。"
 CHI_military_review:0 "軍の総点検"
 CHI_military_review_desc:0 "国軍の忠誠心は薄く、装備は時代遅れだ。しかし、誰が軍を掌握するかが内戦の勝敗を決める。"
 CHI_voice_of_order:0 "秩序派の台頭"
 CHI_voice_of_order_desc:0 "財閥と旧官僚を背景とする秩序派が、沿岸部への影響力を広げ始めた。"
 CHI_voice_of_factories:0 "工場の声"
 CHI_voice_of_factories_desc:0 "第四インターナショナルの思想が都市の工場地帯に浸透しつつある。労働者たちが声を上げ始めた。"
 CHI_voice_of_earth:0 "大地の声"
 CHI_voice_of_earth_desc:0 "モスクワの影響を受けた農村活動家たちが、農民の怒りに火をつけている。"
 CHI_order_network:0 "秩序派工作網"
 CHI_order_network_desc:0 "沿岸の商人・貿易業者を取り込む組織的工作を展開する。秩序派の影響力を本格的に行使せよ。"
 CHI_factory_agitation:0 "工場煽動"
 CHI_factory_agitation_desc:0 "都市の工場委員会と労働組合に深く潜入し、パリ派の影響力拡大ディシジョンを解禁する。"
 CHI_rural_mobilization:0 "農村動員"
 CHI_rural_mobilization_desc:0 "農村部に工作員を送り込み、モスクワ派の地盤を確立する。影響力拡大ディシジョンが使用可能になる。"
 CHI_order_southern_push:0 "南方への圧力"
 CHI_order_southern_push_desc:0 "広州を拠点に南方地域への秩序派浸透を強化する。"
 CHI_order_nanjing_grip:0 "南京の掌握"
 CHI_order_nanjing_grip_desc:0 "首都南京の政府機構を秩序派で固め、影響力の重心を確立する。"
 CHI_factory_chengdu:0 "成都への浸透"
 CHI_factory_chengdu_desc:0 "内陸の大都市、成都の工場地帯にパリ派のネットワークを展開する。"
 CHI_factory_chongqing:0 "重慶の獲得"
 CHI_factory_chongqing_desc:0 "揚子江上流の要衝・重慶を工業革命の拠点とする。"
 CHI_rural_xian:0 "西安の支配"
 CHI_rural_xian_desc:0 "西北の要衝・西安を農民動員の中心に据え、モスクワ派の勢力を拡大する。"
 CHI_rural_shanxi:0 "山西の民衆"
 CHI_rural_shanxi_desc:0 "山がちな山西省の農民を組織し、モスクワ派の人民の海を作り出す。"

 # 共通ツリー（旧キー — 一部のUIで参照される可能性があるため残存）
 CHI_start_influence:0 "嵐の前の静けさ"
 CHI_start_influence_desc:0 "もはや政府の中枢は機能していない。表向きは静穏でも、地下水脈では革命と反動のエネルギーがマグマのように煮え滾っている。来るべき「その日」に備えよ。"
 CHI_influence_factions:0 "各派閥の台頭"
 CHI_order_prepare:0 "秩序の護持者"
 CHI_paris_prepare:0 "紅色同盟の台頭"
 CHI_moscow_prepare:0 "大地の覚醒"
 CHI_secure_the_coast:0 "沿岸部の確保"
 CHI_secure_the_coast_desc:0 "貿易と富の集積地である沿岸部を制する者が、経済を支配するだろう。"
 CHI_political_fund:0 "政治資金の調達"
 CHI_industrial_nexus:0 "産業の要衝"
