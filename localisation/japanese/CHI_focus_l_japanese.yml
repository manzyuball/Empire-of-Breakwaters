 CHI_C_uprising:0 "大地の革命"
 CHI_C_uprising_desc:0 "同志諸君、見よ。数千年にわたりこの大地を耕してきた無数の人民が、今ついに怒りの声を上げているのだ。偽りの都市エリートどもを包囲し、農村から国家を根本から覆せ！"
