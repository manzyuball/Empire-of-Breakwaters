 # 統一戦争サブツリー
 CHI_unite_china:0 "中国の完全統一"
 CHI_unite_china_desc:0 "国内の思想的対立には決着がついた。次に我々が為すべきは、かつての清朝が失った領域を再びまとめ上げ、帝国主義者によって切り取られた全ての祖国を取り戻すことである。真の中華の復興がいま始まる。"
 CHI_deal_with_warlords:0 "軍閥問題の解決"
